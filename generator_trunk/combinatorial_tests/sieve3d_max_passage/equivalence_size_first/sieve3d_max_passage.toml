''']

[[constraints]]
id = "rigid_policy_forbids_scale"
sheets = ["POLICY", "MODIFICATION"]
polarity = "forbid"
pairs = [
  { POLICY = 'search.select_policy("rigid_only");', MODIFICATION = 'search.select_modification("scale");' },
]
gate = {}
desc = "The main proof is rigid-only; scaling is represented for classification and removed by the mandatory Bundle sieve before SUT execution."

