spec_version = "1"
title = "all-body all-hole deterministic staged rigid-passage proof"
note = "One Bundle candidate owns one fixed body/hole pair. The candidate constructs the complete user-declared staged universe through FW_Combi products, executes neutral first, fully exhausts the first successful measured-action tier, records every executed predecessor, and emits a valid failed observation with FW_VAR=0 when the discrete space is exhausted. The mandatory Bundle sieve removes the deliberately represented rigid-policy/scale contradiction before Reader assembly."
args = ["mode=sieve3d_all_pairs_staged"]

[[goals]]
key = "full_pass"
dir = "max"
[[goals]]
key = "passed_volume_pct"
dir = "max"
[[goals]]
key = "solution_actions"
dir = "min"
[[goals]]
key = "solution_keyframes"
dir = "min"
[[goals]]
key = "changed_parameter_count"
dir = "min"
[[goals]]
key = "worst_clearance"
dir = "max"
[[goals]]
key = "search_attempts"
dir = "min"

[[slots]]
sheet = "HEAD"
key = "head"
verb = "FW_Combi(1)"
raw = true
values = ['''
import os, sys
from pathlib import Path
_roots = []
_env = os.environ.get("SIEVE3D_MAX_PASSAGE_ROOT")
if _env:
    _roots.append(Path(_env))
_cwd = Path(os.getcwd())
_roots.extend([
    _cwd / "combinatorial_tests" / "sieve3d_max_passage" / "equivalence_size_first",
    _cwd / "generator_trunk" / "combinatorial_tests" / "sieve3d_max_passage" / "equivalence_size_first",
    Path(os.environ.get("BUNDLE_REPO_ROOT", _cwd)) / "generator_trunk" / "combinatorial_tests" / "sieve3d_max_passage" / "equivalence_size_first",
])
for _root in _roots:
    if _root.exists():
        sys.path.insert(0, str(_root))
        break
import staged_passage_search as search
search.reset_bundle_context()
''']

