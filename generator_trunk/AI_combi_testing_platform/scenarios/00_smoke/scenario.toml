spec_version = "1"
title = "AI combinatorial platform exact-control smoke"
note = "32 cost-free candidates prove canonical task generation, separate rendering, exact oracle verification, metrics, and formal analysis."
args = ["suite=ai_combi_testing", "tier=smoke", "adapter=oracle-control"]

[[goals]]
key = "correct"
dir = "max"
[[goals]]
key = "all_constraints_pass"
dir = "max"
[[goals]]
key = "semantic_invariance_ok"
dir = "max"
[[goals]]
key = "complexity"
dir = "max"
[[goals]]
key = "latency_us"
dir = "min"
[[goals]]
key = "cost_microusd"
dir = "min"

[[slots]]
sheet = "HEAD"
key = "head"
verb = "FW_Combi(1)"
raw = true
values = ['''
from generator_trunk.AI_combi_testing_platform.engine import initialize_candidate, run_candidate
PLAN = initialize_candidate(family="ordering", seed=1729, complexity=2)
''']

[[slots]]
sheet = "TASK_FAMILY"
key = "task_family"
verb = "FW_Combi(1)"
raw = true
values = [
'''PLAN.task_family = "ordering"
''',
'''PLAN.task_family = "cancellation"
'''
]

[[slots]]
sheet = "COMPLEXITY"
key = "complexity"
verb = "FW_Combi(1)"
raw = true
values = [
'''PLAN.complexity = 2
''',
'''PLAN.complexity = 4
'''
]

[[slots]]
sheet = "SEMANTIC_COSTUME"
key = "semantic_costume"
verb = "FW_Combi(1)"
raw = true
values = [
'''PLAN.semantic_mode = "neutral"
PLAN.costume = "neutral"
''',
'''PLAN.semantic_mode = "loaded"
PLAN.costume = "loaded"
'''
]

[[slots]]
sheet = "OUTPUT_SCHEMA"
key = "output_schema"
verb = "FW_Combi(1)"
raw = true
values = [
'''PLAN.schema = "json"
''',
'''PLAN.schema = "plain"
'''
]

[[slots]]
sheet = "INSTRUCTION_ORDER"
key = "instruction_order"
verb = "FW_Combi(1)"
raw = true
values = [
'''PLAN.instruction_order = "task_first"
''',
'''PLAN.instruction_order = "constraints_first"
'''
]

[[slots]]
sheet = "TAIL"
key = "tail"
verb = "FW_Combi(1)"
raw = true
values = ['''
_RESULT = run_candidate(PLAN)
FW_VAR = _RESULT.code
FW_CUSTOM_VAR = FW_VAR
print(_RESULT.metrics_line())
''']

[[custom_vars]]
code = 2
msg = "candidate construction or structural validation failure"
[[custom_vars]]
code = 4
msg = "response format or invariant failure"
[[custom_vars]]
code = 5
msg = "exact answer or declared constraint failure"
