[[slots]]
sheet = "HEAD"
raw = true
values = [
'''import time

CHANNEL = PAYMENT = REGION = SHIPPING = REVIEW = None


class CheckoutRiskEngine:
    payment_risk = {"card": 0, "invoice": 1, "wire": 2}
    review_risk = {"none": 0, "auto": 1, "manual": 2}
    region_risk = {"us": 0, "eu": 1}
    channel_risk = {"web": 0, "ivr": 1, "partner": 2}

    @staticmethod
    def structural_violations(channel, payment, region, shipping, review):
        violations = []
        if channel == "partner" and payment == "invoice":
            violations.append("partner_invoice")
        if payment in {"invoice", "wire"} and region == "eu" and shipping == "express":
            violations.append("eu_express_invoice_or_wire")
        if payment == "wire" and review == "manual":
            violations.append("wire_manual_review")
        if channel == "ivr" and payment == "wire" and review == "auto":
            violations.append("ivr_wire_auto")
        return violations

    def evaluate(self, channel, payment, region, shipping, review):
        violations = self.structural_violations(channel, payment, region, shipping, review)
        risk = (
            self.payment_risk[payment]
            + self.review_risk[review]
            + self.region_risk[region]
            + self.channel_risk[channel]
        )
        latency = 6.0 + risk * 1.25 + (2.5 if shipping == "express" else 0.0)
        return {
            "correct": 0 if violations else 1,
            "risk_score": risk,
            "latency_ms": latency,
            "pruned_violation": 1 if violations else 0,
            "violations": violations,
        }
'''
]

