'''_broken = TelemetryLookup.validate(DatasetFamily, SignalClass, ExcludeRestricted, AccessTier, Geometry)
FW_VAR = 0 if not _broken else 2
FW_CUSTOM_VAR = FW_VAR
_url = TelemetryLookup.url("grid-sample", DatasetFamily, SignalClass, ExcludeRestricted, AccessTier, Geometry)
print(
    "app=telemetry_catalog "
    "family=%s signal=%s exclude=%s access=%s geometry=%s "
    "valid=%d broken=%s broken_count=%d url=%s FW_VAR=%d"
    % (DatasetFamily, SignalClass, ExcludeRestricted, AccessTier, Geometry,
       int(not _broken), "+".join(_broken) or "none", len(_broken), _url, FW_VAR)
)'''
]
