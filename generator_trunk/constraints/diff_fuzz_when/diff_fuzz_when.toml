title = "Differential fuzzing #4 (RUN) — correct vs naive evaluator, full Bundle"
note  = "Slots concatenate into a self-checking .py; FW_VAR=2 marks a precedence divergence."
[[goals]]
key = "divergences"
dir = "max"
args  = ["mode=diff_fuzz_run"]

[[slots]]
sheet = "HEAD"
key   = "head"
verb  = "FW_Combi(1)"
raw   = true
values = [
'''
def impl_A(e):                       # CORRECT precedence evaluator (reference)
    return int(eval(e, {"__builtins__": {}}, {}))
def impl_B(e):                       # NAIVE left-to-right evaluator (the bug under test)
    s = e.replace(" ", ""); acc = int(s[0]); i = 1
    while i < len(s):
        op = s[i]; rhs = int(s[i + 1])
        acc = acc + rhs if op == "+" else acc - rhs if op == "-" else acc * rhs
        i += 2
    return acc
E = ""
''',
]

[[slots]]
sheet = "O1"
key   = "o1"
verb  = "FW_Combi(1)"
raw   = true
values = [
'''
E += "1"
''',
'''
E += "2"
''',
'''
E += "3"
''',
]

[[slots]]
sheet = "OP1"
key   = "op1"
verb  = "FW_Combi(1)"
raw   = true
values = [
'''
E += "+"
''',
'''
E += "-"
''',
'''
E += "*"
''',
]

[[slots]]
sheet = "O2"
key   = "o2"
verb  = "FW_Combi(1)"
raw   = true
values = [
'''
E += "1"
''',
'''
E += "2"
''',
'''
E += "3"
''',
]

[[slots]]
sheet = "OP2"
key   = "op2"
verb  = "FW_Combi(1)"
raw   = true
values = [
'''
E += "+"
''',
'''
E += "-"
''',
'''
E += "*"
''',
]

[[slots]]
sheet = "O3"
key   = "o3"
verb  = "FW_Combi(1)"
raw   = true
values = [
'''
E += "1"
''',
'''
E += "2"
''',
'''
E += "3"
''',
]

[[slots]]
sheet = "TAIL"
key   = "tail"
verb  = "FW_Combi(1)"
raw   = true
values = [
'''
_a = impl_A(E); _b = impl_B(E)
FW_VAR = 0 if _a == _b else 2        # FW_VAR=2 == DIVERGENCE found (impl_B is wrong)
print("app=diff_fuzz expr=%s correct=%d naive=%d divergences=%d FW_VAR=%d"
      % (E, _a, _b, 0 if _a == _b else 1, FW_VAR))   # 'app=' prefix => Analyzer collect_kv picks it up
''',
]

[[custom_vars]]
code = 2
msg  = "implementations DIVERGED (precedence bug)"

# --- params + a WHEN-PREDICATE constraint (Blockly tier) for the --sieve end-to-end test ---
# Each O1/O3 operand value carries n (its numeric value); forbid combinations whose operands sum > 4.
[[params]]
sheet = "O1"
value = 'E += "1"'
n = 1
[[params]]
sheet = "O1"
value = 'E += "2"'
n = 2
[[params]]
sheet = "O1"
value = 'E += "3"'
n = 3
[[params]]
sheet = "O3"
value = 'E += "1"'
n = 1
[[params]]
sheet = "O3"
value = 'E += "2"'
n = 2
[[params]]
sheet = "O3"
value = 'E += "3"'
n = 3

[[constraints]]
id = "sum_operands_gt_4"
sheets = ["O1", "O3"]
when = "O1.n + O3.n > 4"
gate = {}
desc = "forbid when the O1 and O3 operand values sum above 4"
