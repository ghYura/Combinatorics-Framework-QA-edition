[[slots]]
sheet = "TAIL"
key   = "tail"
verb  = "FW_Combi(1)"
raw   = true
values = ['''
_t0 = time.time()
code = 0
err = ""
out = None
exp = None
try:
    torch.manual_seed(0)
    if flags["threads"]:
        torch.set_num_threads(1)
    M = build()
    if flags["eval"]:
        M.eval()
    ctx = torch.no_grad() if flags["nograd"] else contextlib.nullcontext()
    with ctx:
        out, exp = run_forward(M)
    shape_ok = tuple(out.shape) == exp
    finite_ok = bool(torch.isfinite(out).all())
    if not shape_ok:
        code = 1
    elif not finite_ok:
        code = 2
    elif not (flags["nograd"] or flags["eval"]):
        out.square().mean().backward()
        g = next((p.grad for p in M.parameters() if p.grad is not None), None)
        if g is None:
            code = 3
    METRICS["params"] = sum(p.numel() for p in M.parameters())
except Exception as e:
    code = 9
    err = type(e).__name__
METRICS["variant"] = cfg["variant"]
METRICS["n_layers"] = cfg["n_layers"]
METRICS["d_ffn"] = cfg["d_ffn"]
METRICS["src_len"] = cfg["src_len"]
METRICS["latency_ms"] = round((time.time() - _t0) * 1000.0, 1)
METRICS["code"] = code
METRICS["defect"] = 1 if code else 0
METRICS["err"] = err
FW_VAR = code
FW_CUSTOM_VAR = code
METRICS["FW_VAR"] = code
print(" ".join("%s=%s" % (k, v) for k, v in METRICS.items()))
''']

