spec_version = "1"
title = "considerme_as_upgradeMIXtest — synthesize ternary Medusa transformers from chunk-variants (Combinatorics)"
note = """GENERATIVE architecture synthesis using the Bundle. The transformer in ../../ was decomposed
(across considerme_as_upgrade1..4) into independent logical UNITS; each candidate COMPOSES a brand-new
tiny ternary Medusa transformer from one variant of every unit, builds it, runs forward+backward+1 SGD
step + cheap proxies, and emits a verdict. Freedom->verb: every unit is 'exactly one of a set' ->
FW_Combi(1): NORM(2) x TOKENMIX(3) x CHANMIX(3) x NORMPOS(2) x MEDUSA(2) = 72 mandatory architectures.
Two add-ons are 'may or may not fire, in any combination' -> FW_Optional (present (+) absent): router
JITTER and an extra Conv1D on Q -> x 2^2. Total fw_final = 72 x 4 = 288 candidates (EXACT).
FW_RunMeFirstOnce is the one-time BOOTSTRAP (compile the FX-8320 C++ kernel once, seed, smoke) — it is
NOT an axis and does not multiply the count. The TAIL is the FW_VAR oracle (the 'meaning' layer):
code0 valid; 1 wrong shape; 2 non-finite; 3 untrainable grad; 4 causal leak; 5 non-deterministic;
6 optimizer did not reduce the same-batch loss; 7 recurrence cache inexact; 8 incompatible genotype
caught fail-loud (sieve should prune); 9 crash. The Analyzer then surfaces the Pareto front over
params:min x latency_ms:min x proxy_gradnorm:max. Everything is TINY on purpose (weak FX-8320 PC)."""
args = ["mode=arch_mix"]

# FW_RunMeFirstOnce — one-time, run-level BOOTSTRAP (not an axis): compile kernel once + seed + smoke.
runme = '''
# class RunMeFirstOnce { public static String FW_ARGS = ""; }  // satisfies Core WorkbookParser.validateRunMeFirstOnce (no-op Python comment)
import os, sys
from pathlib import Path
_repo_hint = Path(os.environ.get("BUNDLE_REPO_ROOT", Path.cwd())).expanduser().resolve()
_repo_root = next((p for p in (_repo_hint, *_repo_hint.parents) if (p / "generator_trunk" / "sut_paths.py").is_file()), _repo_hint)
sys.path.insert(0, str(_repo_root / "generator_trunk" / "transformers_sweep_288"))
import mix_arch
_boot = mix_arch.bootstrap(threads=4, compile_kernel=True)
print("FW_RunMeFirstOnce[BOOTSTRAP] kernel_backend=%s smoke_code=%d" % (_boot["kernel_backend"], _boot["smoke_code"]))
'''

[[goals]]
key = "params"
dir = "min"
[[goals]]
key = "latency_ms"
dir = "min"
[[goals]]
key = "proxy_gradnorm"
dir = "max"

# ---------------- HEAD : metrics initialization (per-candidate scaffold) ----------------
[[slots]]
sheet = "HEAD"
key   = "head"
verb  = "FW_Combi(1)"
raw   = true
values = ['''
import os, sys
from pathlib import Path
_repo_hint = Path(os.environ.get("BUNDLE_REPO_ROOT", Path.cwd())).expanduser().resolve()
_repo_root = next((p for p in (_repo_hint, *_repo_hint.parents) if (p / "generator_trunk" / "sut_paths.py").is_file()), _repo_hint)
sys.path.insert(0, str(_repo_root / "generator_trunk" / "transformers_sweep_288"))
import mix_arch
geno = mix_arch.default_geno()
desc = dict(norm="rmsnorm", tok="lin_cumsum", chan="moe_shared_top1", pos="pre", med="vectorized", opt=[])
''']

