''']

# ---------------- TAIL : FW_VAR oracle + metrics gathering + stdout ----------------
[[slots]]
sheet = "TAIL"
key   = "tail"
verb  = "FW_Combi(1)"
raw   = true
values = ['''
_m = mix_arch.evaluate(geno, batch=2, seq=10)
FW_VAR = 0 if _m["code"] == 0 else 1
FW_CUSTOM_VAR = _m["code"]
print("app=arch_mix norm=%s tok=%s chan=%s pos=%s med=%s opt=%s "
      "params=%d model_bytes=%d latency_ms=%.3f tokens_per_s=%.1f loss=%.4f loss_improvement=%.8f "
      "proxy_gradnorm=%.4f grad_coverage=%.4f recur_delta=%.3e recur_ok=%d deterministic_ok=%d "
      "causal_ok=%d causal_checks=%d int8_ok=%d aux=%.4f code=%d err=%s FW_VAR=%d FW_CUSTOM_VAR=%d"
      % (desc["norm"], desc["tok"], desc["chan"], desc["pos"], desc["med"],
         ("+".join(desc["opt"]) if desc["opt"] else "none"),
         _m["params"], _m["model_bytes"], _m["latency_ms"], _m["tokens_per_s"], _m["loss"], _m["loss_improvement"],
         _m["proxy_gradnorm"], _m["grad_coverage"], max(_m["recur_delta"], 0.0), _m["recur_ok"], _m["deterministic_ok"],
         _m["causal_ok"], _m["causal_checks"], _m["int8_ok"], _m["aux"], _m["code"], _m["err"], FW_VAR, FW_CUSTOM_VAR))
''']

