title = "Superoptimization #2 — shortest branchless straight-line program for abs(x)"
note  = "Each slot rK is one SSA instruction over {x,r1..r(K-1)}; FW_Combi(1) cartesian over the slots = every length-N straight-line program. Executor runs the correctness oracle (match the reference on all 256 inputs) -> FW_VAR=0 iff correct; Analyzer minimises instruction count to return the superoptimal program."
# directions overridden: 'instructions'/'cycles' are not in the MIN/MAX lexicon
args  = ["target=abs", "width=8bit", "domain=all_256_inputs"]
[[goals]]
key = "correct"
dir = "max"
[[goals]]
key = "instructions"
dir = "min"
[[goals]]
key = "cycles"
dir = "min"

[[slots]]
sheet = "HEAD"
key   = "head"
verb  = "FW_Combi(1)"
raw   = true
values = [
'''
def candidate(x):
    x &= 0xFF
    if x >= 128: x -= 256
'''
]

