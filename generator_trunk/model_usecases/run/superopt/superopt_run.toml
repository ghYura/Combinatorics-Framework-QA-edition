title = "Superoptimization #2 (RUN) — exhaustive branchless abs search, full Bundle"
note  = "Each candidate is a length-3 straight-line program; FW_VAR=0 iff it equals abs on all 256 inputs. The Bundle runs the whole space; the Analyzer correct:max surfaces the needles (the branchless-abs programs)."
args = ["target=abs", "mode=superopt_run"]
[[goals]]
key = "correct"
dir = "max"

[[slots]]
sheet = "HEAD"
key   = "head"
verb  = "FW_Combi(1)"
raw   = true
values = [
'''
def _s(b):
    b &= 0xFF
    return b - 256 if b >= 128 else b
def candidate(x):
    x = _s(x)
''',
]

[[slots]]
sheet = "R1"
key   = "r1"
verb  = "FW_Combi(1)"
raw   = true
values = [
'''
    r1 = x >> 7
''',
'''
    r1 = _s((x & 255) ^ (x & 255))
''',
'''
    r1 = _s(x + x)
''',
'''
    r1 = _s(x - x)
''',
]

