title = "C12 - ordering encoded per position, so the sieve's bonds can speak about ORDER"
note  = "A positional gate resolves pos per materialized AXIS, and two placements sharing a position are never paired - so a single FW_Permut sheet's internal order is invisible to a bond. Encoding the sequence as one slot per STEP gives every step its own pos, and adjacency/window gates become real ordering constraints. The bonds here MASK the shapes already explained (a refund immediately followed by a replay = F3; two refunds anywhere = F2) so the remaining budget goes to sequences that are not yet accounted for."
args  = ["mode=c12_order_bonds"]

[[goals]]
key = "viol"
dir = "max"

[[slots]]
sheet = "FRAME"
key   = "frame"
verb  = "FW_Combi(1)"
raw   = true
values = ['''import os, sys
sys.path.insert(0, os.environ.get("PROOF_SUT_ROOT", "proof_billing/sut"))
import billing_core as B
FW_VAR = 0
trace = []
seen = set()
def _probe():
    for i in a.audit():
        seen.add(i)
def _do(name, fn):
    try:
        fn(); trace.append(name)
    except B.BillingError:
        trace.append(name + "!")
    except Exception as _e:
        trace.append(name + ":" + type(_e).__name__)
    _probe()
''']

[[slots]]
sheet = "BUILD"
key   = "build"
verb  = "FW_Combi(1)"
raw   = true
values = ['''a = B.BillingAccount(plan="pro", cycle_days=30, proration="none")
''']

[[slots]]
sheet = "STEP1"
key   = "step1"
verb  = "FW_Combi(1)"
raw   = true
values = ['_do("tick", lambda: a.tick(30))', '_do("up", lambda: a.change_plan("team"))', '_do("refund", a.refund)', '_do("replay", a.replay)', '_do("coupon", lambda: a.apply_coupon("half"))']

[[slots]]
