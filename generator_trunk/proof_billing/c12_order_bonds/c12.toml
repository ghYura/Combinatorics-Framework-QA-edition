[[slots]]
sheet = "STEP4"
key   = "step4"
verb  = "FW_Combi(1)"
raw   = true
values = ['_do("tick", lambda: a.tick(30))', '_do("up", lambda: a.change_plan("team"))', '_do("refund", a.refund)', '_do("replay", a.replay)', '_do("coupon", lambda: a.apply_coupon("half"))']

[[slots]]
sheet = "TAIL"
key   = "tail"
verb  = "FW_Combi(1)"
raw   = true
values = ['''_bad = a.audit()
_trans = sorted(seen - set(_bad))
_ghost = sum(1 for _i in a.invoices if _i["reason"] == "replay")
_v = len(_bad) + len(_trans)
FW_VAR = 1 if _v else 0
print("app=c12 viol=%d inv=%s trans=%s ghost=%d trace=%s cash=%d ninv=%d FW_VAR=%d" % (_v, "+".join(_bad) or "none", "+".join(_trans) or "none", _ghost, ">".join(trace), a.cash_collected, len(a.invoices), FW_VAR))
''']

[[constraints]]
id       = "mask_f3_refund_then_replay_12"
polarity = "forbid"
desc     = "a refund immediately followed by a webhook redelivery is the F3 shape, already explained"
gate     = { adjacent = true }
sets     = { STEP1 = ['_do("refund", a.refund)'], STEP2 = ['_do("replay", a.replay)'] }

