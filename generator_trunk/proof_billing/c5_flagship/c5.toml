title = "C5 flagship - combine EVERYTHING: config x order x mid-flight config mutation x sudden events x probe-after-every-step"
note  = "The greedy campaign. Six degrees of freedom of five different KINDS multiplied together: (1) three static config axes; (2) FW_Permut over four money verbs - the same operations in all 24 orders; (3) FW_Subsets over two MID-FLIGHT CONFIG MUTATIONS - a feature flag flipped while the account is live, which is how config actually changes in production and which no test model represents; (4) FW_Optional over two sudden events; (5) an oracle evaluated after EVERY step so self-healing corruption is caught; (6) cycle_days=7 so proration fractions stop being exact and the rounding mode starts to matter."
args  = ["mode=c5_flagship"]

[[goals]]
key = "viol"
dir = "max"

[[slots]]
sheet = "FRAME"
key   = "frame"
verb  = "FW_Combi(1)"
raw   = true
values = ['''import os, sys
sys.path.insert(0, os.environ.get("PROOF_SUT_ROOT", "proof_billing/sut"))
import billing_core as B
FW_VAR = 0
trace = []
seen = set()
def _probe():
    for i in a.audit():
        seen.add(i)
def _do(name, fn):
    try:
        fn(); trace.append(name)
    except B.BillingError:
        trace.append(name + "!")
    _probe()
''']

