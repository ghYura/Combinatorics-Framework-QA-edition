title = "C3 - the SAME operation more than once (FW_PermutR)"
note  = "Pairwise models an operation as a boolean 'did it happen'. It cannot express 'it happened twice'. FW_PermutR(4) over four money verbs draws all 4^4 = 256 length-4 SEQUENCES WITH REPETITION, so every atom may recur at any position. This is the axis a covering array does not have."
args  = ["mode=c3_repeat"]

[[goals]]
key = "viol"
dir = "max"

[[slots]]
sheet = "FRAME"
key   = "frame"
verb  = "FW_Combi(1)"
raw   = true
values = ['''import os, sys
sys.path.insert(0, os.environ.get("PROOF_SUT_ROOT", "proof_billing/sut"))
import billing_core as B
FW_VAR = 0
trace = []
seen = set()
def _probe():
    for i in a.audit():
        seen.add(i)
def _do(name, fn):
    try:
        fn(); trace.append(name)
    except B.BillingError:
        trace.append(name + "!")
    _probe()
''']

[[slots]]
sheet = "PROR"
key   = "pror"
verb  = "FW_Combi(1)"
raw   = true
values = ['''_pror = "credit"
''','''_pror = "immediate"
''','''_pror = "none"
''']

[[slots]]
sheet = "BUILD"
key   = "build"
verb  = "FW_Combi(1)"
raw   = true
values = ['''a = B.BillingAccount(plan="basic", cycle_days=30, proration=_pror)
''']

[[slots]]
sheet = "OPS"
key   = "ops"
verb  = "FW_PermutR(4)"
raw   = true
values = [
'''_do("coupon", lambda: a.apply_coupon("half"))
''',
'''_do("tick30", lambda: a.tick(30))
''',
'''_do("refund", a.refund)
''',
'''_do("up", lambda: a.change_plan("pro"))
''',
]

[[slots]]
sheet = "TAIL"
key   = "tail"
verb  = "FW_Combi(1)"
raw   = true
values = ['''_bad = a.audit()
_trans = sorted(seen - set(_bad))
_cl = sum(1 for _i in a.invoices for _l in _i["lines"] if _l["desc"].startswith("coupon:"))
FW_VAR = 1 if (_bad or _trans) else 0
print("app=c3 viol=%d inv=%s trans=%s pror=%s trace=%s couponlines=%d cash=%d FW_VAR=%d" % (len(_bad) + len(_trans), "+".join(_bad) or "none", "+".join(_trans) or "none", _pror, ">".join(trace), _cl, a.cash_collected, FW_VAR))
''']
