title = "C9 - crossing the phases nobody crosses: functional x stress x chaos"
note  = "Functional QA, performance QA and resilience/chaos are three separate phases in every classic methodology - different teams, different tools, different reports, never multiplied together. Here they are ONE space. Functional: FW_Permut over the money verbs. Stress: a billing horizon of 1 / 120 / 1200 cycles, delivered as one burst or as N separate ticks (same elapsed time, different code path). Chaos: FW_Optional injects a PROCESS RESTART mid-sequence - state is persisted the way a real store persists it (the declared columns) and rebuilt, which is exactly how a production restart behaves - and a second FW_Optional fires a webhook redelivery afterwards. A bug that needs 'long-running AND restarted AND then redelivered' has no home in any single phase."
args  = ["mode=c9_phases"]

[[goals]]
key = "viol"
dir = "max"

[[slots]]
sheet = "FRAME"
key   = "frame"
verb  = "FW_Combi(1)"
raw   = true
values = ['''import os, sys, time
sys.path.insert(0, os.environ.get("PROOF_SUT_ROOT", "proof_billing/sut"))
import billing_core as B
FW_VAR = 0
trace = []
seen = set()
def _probe():
    for i in a.audit():
        seen.add(i)
def _do(name, fn):
    try:
        fn(); trace.append(name)
    except B.BillingError:
        trace.append(name + "!")
    except Exception as _e:
        trace.append(name + ":" + type(_e).__name__)
    _probe()
def _restart(acct):
    # A persistence layer stores the DECLARED columns. Private bookkeeping
    # (leading underscore) is not part of the schema, so it does not come back.
    keep = dict((k, v) for k, v in acct.__dict__.items() if not k.startswith("_"))
    fresh = B.BillingAccount(plan=acct.plan, cycle_days=acct.cycle_days,
                             proration=acct.proration, rounding=acct.rounding)
    fresh.__dict__.update(keep)
    return fresh
''']

