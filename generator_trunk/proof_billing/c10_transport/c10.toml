title = "C10 - transport pathology x functional scenario"
note  = "A complex SUT does not receive its events cleanly. The webhook surface is at-least-once, so the transport can DELAY an event past a renewal boundary, REORDER it behind newer state, DUPLICATE it, DROP it, or hand over a DISTORTED identifier. Classic methodology puts those in a different discipline entirely - network/chaos simulation - and never multiplies them by the functional scenario. Here they are one space: FW_Permut over the functional operations x delivery lag x FW_Subsets over four transport pathologies (every combination of them, including none and all)."
args  = ["mode=c10_transport"]

[[goals]]
key = "viol"
dir = "max"

[[slots]]
sheet = "FRAME"
key   = "frame"
verb  = "FW_Combi(1)"
raw   = true
values = ['''import os, sys
sys.path.insert(0, os.environ.get("PROOF_SUT_ROOT", "proof_billing/sut"))
import billing_core as B
FW_VAR = 0
trace = []
seen = set()
def _probe():
    for i in a.audit():
        seen.add(i)
def _do(name, fn):
    try:
        fn(); trace.append(name)
    except B.BillingError:
        trace.append(name + "!")
    except Exception as _e:
        trace.append(name + ":" + type(_e).__name__)
    _probe()
''']

