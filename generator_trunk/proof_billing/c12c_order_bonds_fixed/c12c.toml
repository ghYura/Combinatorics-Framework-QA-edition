title = "C12c - the bond corrected: co-occurrence, not adjacency"
note  = "The adjacency bond encoded a hypothesis that turned out to be wrong. replay() resolves the last LEDGER entry, not the last operation, so ledger-silent operations are transparent at ANY distance. The corrected bond forbids refund and replay co-occurring at all. What survives is what the model genuinely does not yet explain."
args  = ["mode=c12_order_bonds"]

[[goals]]
key = "viol"
dir = "max"

[[slots]]
sheet = "FRAME"
key   = "frame"
verb  = "FW_Combi(1)"
raw   = true
values = ['''import os, sys
sys.path.insert(0, os.environ.get("PROOF_SUT_ROOT", "proof_billing/sut"))
import billing_core as B
FW_VAR = 0
trace = []
seen = set()
def _probe():
    for i in a.audit():
        seen.add(i)
def _do(name, fn):
    try:
        fn(); trace.append(name)
    except B.BillingError:
        trace.append(name + "!")
    except Exception as _e:
        trace.append(name + ":" + type(_e).__name__)
    _probe()
''']

