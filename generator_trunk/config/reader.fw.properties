# =============================================================================
# HEURISTIC ANALYZER BRIDGE  (com.company.sink.AnalyzerBridge)
# =============================================================================
# Optional integration with the Heuristic Analyzer.  When enabled, every
# combinatorial row that the framework emits (both the STREAMING-DIRECT path
# and the parallel driver path) is also fed into the analyzer's streaming
# pipeline (analyzeStream).  The analyzer maintains:
#   - per-key Welford μ/σ + champions (argmin/argmax line numbers),
#   - online Pareto front (multi-objective non-domination),
#   - top-K by score (heap-bounded),
#   - balanced-optimum picks via three scalarization strategies
#     (weighted-sum / Tchebycheff / distance-to-ideal).
# A formatted snapshot is printed on JVM shutdown via a registered hook.
#
# Default behaviour (with NONE of these set OR fw.analyzer.enabled=false):
#   the framework runs unchanged, byte-for-byte identical output.  The new
#   sink layer compiles in but is never activated.
#
# All properties below are commented out — uncomment + adjust to use.
# -----------------------------------------------------------------------------

# --- Master switch ---
# Default: false (analyzer disabled, framework unchanged).
#fw.analyzer.enabled=true

# --- Buffer + reporting ---
# How many rows to buffer between framework producer and analyzer consumer.
# Higher = more parallelism slack, more RAM.  Default 10000.
#fw.analyzer.queueCapacity=10000

# How many top-by-score rows to retain in the final Snapshot.  Default 20.
#fw.analyzer.topK=20

# -----------------------------------------------------------------------------
# Goals — declares MIN/MAX/TARGET per key, plus weights for scalarization.
# Format:  key:mode:targetValue:weight (comma-separated rows).
#   mode  = min | max | target
#   targetValue = numeric value the metric should approach (TARGET-only;
#                  for MIN/MAX use 0).  IMPORTANT: target value must be in
#                  the SAME canonical units the analyzer uses internally —
#                  the parser canonicalises unit suffixes ("50ms" → 0.05s,
#                  "1.2MiB" → 1257  bytes), so e.g. for latency=50ms specify
#                  target=0.05 (NOT 50).
#   weight = relative pull in scalarization (Pareto dominance ignores weight).
#
# If 'fw.analyzer.goals' is set, the legacy maximizeKeys/minimizeKeys
# properties below are ignored.  If both formats are unset, NO goals are
# declared — the analyzer relies entirely on auto-discovered keys (see
# DiscoveryPolicy section further down).
# -----------------------------------------------------------------------------

# --- Variant 1: pure agnostic (no declared goals at all) ---------------------
# Every numeric K=V the framework emits is auto-discovered AND auto-included
# in selection with mode inferred from the key's name (cost/latency/error →
# MIN, throughput/accuracy/score → MAX).  The simplest, most agnostic config.
#fw.analyzer.enabled=true

# --- Variant 2: explicit declared goals + auto-discovery for the rest -------
# Declare what you care about explicitly; the analyzer adds anything else
# that appears with auto-inferred modes.  Recommended general-purpose setup.
#fw.analyzer.enabled=true
#fw.analyzer.goals=cost:min:0:1, throughput:max:0:1, latency:target:0.050:1

# --- Variant 3: declared-only (strict; ignore auto-discovered axes) ---------
# Old-school behaviour: only the explicitly declared keys participate in
# Pareto / scalarization.  Other keys are still observed in Welford stats
# but excluded from selection.
#fw.analyzer.enabled=true
#fw.analyzer.goals=cost:min:0:1, throughput:max:0:1
#fw.analyzer.autoDiscover=false

# --- Variant 4: observe-only (auto-keys visible in stats, weight=0) ---------
# Auto-discovered keys appear in Pareto axes (so Pareto dominance considers
# them) but contribute zero weight to balanced-optimum scalarization.
#fw.analyzer.enabled=true
#fw.analyzer.goals=cost:min:0:1, throughput:max:0:1
#fw.analyzer.autoDiscoverWeight=0.0

# --- Variant 5: legacy binary key sets (kept for backward compat) -----------
# If 'fw.analyzer.goals' is unset, these two are merged: minimizeKeys all
# get MIN, maximizeKeys all get MAX, default weight 1.0.  No TARGET support
# in this format — use 'goals' if you need TARGET.
#fw.analyzer.enabled=true
#fw.analyzer.minimizeKeys=cost,latency,error_rate
#fw.analyzer.maximizeKeys=throughput,accuracy

# -----------------------------------------------------------------------------
# DiscoveryPolicy — how auto-discovered keys are treated.
# -----------------------------------------------------------------------------
# All three default values match DiscoveryPolicy.DEFAULT (truly agnostic).

# Whether to include auto-discovered keys in Pareto + scalarization at all.
# Default: true.  Set to false to revert to "declared-keys-only" semantics
# (Welford stats still computed for auto-keys, but they don't influence
#  Pareto dominance or balanced-optimum picks).
#fw.analyzer.autoDiscover=true

# Mode applied to auto-discovered keys:
#   auto = lexical inference via AutoAnalysisPlanner.inferMode (recommended)
#          - cost / latency / error / loss / fail / delay / drop / time /
#            size / memory / regret / penalty → MIN
#          - throughput / qps / score / accuracy / precision / recall / f1 /
#            success / hit / coverage / efficiency / fitness / reward → MAX
#          - everything else → MIN (conservative default)
#   min  = force every auto-key to MINIMIZE
#   max  = force every auto-key to MAXIMIZE
# Default: auto.
#fw.analyzer.autoDiscoverMode=auto

# Relative weight given to each auto-discovered axis in scalarization.
# Pareto dominance ignores weight (only mode matters there).  Default 1.0.
# Set to 0.0 to make auto-keys observe-only (visible in Pareto but don't
# bias the balanced-optimum pick).
#fw.analyzer.autoDiscoverWeight=1.0

# -----------------------------------------------------------------------------
# Where to find the rendered report
# -----------------------------------------------------------------------------
# When the analyzer is active, a multi-section snapshot is printed to stdout
# at JVM shutdown.  Sections include:
#   1. Per-metric streaming stats (Welford μ/σ + corpus min/max with line refs)
#   2. Declared goals (explicit, from this properties file)
#   3. Auto-discovered axes (added by DiscoveryPolicy with inferred mode)
#   4. Online Pareto front (up to 10 lines shown)
#   5. Top-K by score
#   6. Balanced optima (3 scalarization strategies, all axes participating)
#
# To capture the report to a file:
#   java -jar CombinatoricsReader-...-jar-with-dependencies.jar  \
#     2>analyzer.err  >analyzer.report
# (the framework's own progress prints land on stdout too — split by content
#  if desired with grep '^\['; analyzer's render output starts with a
#  Unicode box-drawing line.)

# ─── E2E TEST OVERRIDES (uncommented for ./runtime/FW_e2e_out.tsv run) ───
fw.analyzer.enabled=false
fw.analyzer.queueCapacity=1024
fw.analyzer.topK=10
fw.analyzer.autoDiscover=true
fw.analyzer.autoDiscoverMode=auto
fw.analyzer.autoDiscoverWeight=1.0

# ─── Tier-0 bug fix 0.1 ───
# Bypass StringButQuotesRefiner on cell values — preserves leading/trailing/
# multi whitespace verbatim from NumberToValue1.  Required for metric-rich
# scenarios where a leading-space-in-cell is the K=V boundary.  Leave at
# default (false) for legacy Java-code scenarios where the refiner is wanted.
reader.cells.preserveWhitespace=true

# ─── Tier-1 win 1.5: memoise LineExecutor results by candidate hash ───
# Skips re-execution when the same row text re-appears (GP outer loops,
# NSGA-II boundary re-tests, combinatorial fronts re-evaluating survivors).
# HitRate shows up in Snapshot.render() and toJson() under "cacheStats".
# Off by default → no behavioural change to the legacy non-caching path.
#fw.analyzer.cache=true
#fw.analyzer.cacheCapacity=4096

# ─── Tier-2 win 2.1: pluggable coverage-report adapter ───
# After a candidate executes, the probe reads the coverage tool's report
# and appends "coverage_line=… coverage_branch=…" to the payload.  The
# analyzer treats coverage_* axes as MAXIMIZE under the default policy.
#
# Backend options (case-insensitive):
#   jacoco        → JaCoCo XML report
#   coverage.py   → coverage.py JSON (`coverage json -o coverage.json`)
#   gcov          → gcov / gcovr summary text
#   none (default)→ disabled
#
# The report path may contain the {lineNo} substitution token for
# per-candidate runs (e.g. ./runtime/jacoco_{lineNo}.xml).  A fixed path with
# no token is treated as a single shared report.
#
# Off by default → byte-for-byte identical legacy path.
#fw.analyzer.coverage=jacoco
#fw.analyzer.coverageReport=./runtime/jacoco_{lineNo}.xml

# ─── Tier-4.2: RemoteWorker — score via the legacy Executor ───
# Closes the Master/Slave loop the bundle was originally designed around:
# the Analyzer hands each candidate to the legacy Executor (separate JVM
# watching srcDir, Janino compile, FW_VAR check) and reads the verdict back
# from the results Postgres as K=V metrics that flow into NSGA-II.
#
# Set fw.analyzer.executorType=remote to enable.  Required when enabled:
#   fw.analyzer.remote.srcDir       — the Executor's -srcDirList path
#   fw.analyzer.remote.dbUrl        — JDBC URL the Reader wrote into
#                                      resultsDbURL.properties
#   fw.analyzer.remote.tableName    — Executor's result table name
# Optional:
#   fw.analyzer.remote.idColumn     — defaults to combi_id_final
#   fw.analyzer.remote.selectColumns — CSV; defaults to
#                                       fw_var,status,combi_id_final,combi_id_optional,fw_optJ
#   fw.analyzer.remote.fileExtension  — defaults to .java
#   fw.analyzer.remote.pollIntervalMs — defaults to 200
#   fw.analyzer.remote.writeFile      — true (default) writes the candidate
#     file itself (standalone-Analyzer flow); set to false when the Reader's
#     filesMode is also on (avoids double-write — pure poller bridge mode).
#   fw.analyzer.remote.idExtractorRegex — first capture group becomes the
#     candidate id; fall back to lineNo on miss.  For Reader rows carrying
#     the <combi_id>_<opt>_<j> marker:  \b(\d+)_\d+_\d+\b
#
# Off by default → byte-for-byte identical legacy path (executorType=inline).
#fw.analyzer.executorType=remote
#fw.analyzer.remote.srcDir=./runtime/src/
#fw.analyzer.remote.dbUrl=jdbc:postgresql://localhost:5432/db_results?user=postgres&password=CHANGEME
#fw.analyzer.remote.tableName=db_e2e_test
#fw.analyzer.remote.idColumn=combi_id_final
#fw.analyzer.remote.selectColumns=fw_var,status,combi_id_final,combi_id_optional,fw_optJ
#fw.analyzer.remote.fileExtension=.java
#fw.analyzer.remote.pollIntervalMs=200
#fw.analyzer.remote.writeFile=false
#fw.analyzer.remote.idExtractorRegex=\b(\d+)_\d+_\d+\b

# ─── Tier-3.5: BundleSeed closed-loop feedback artifact ───
# Master mode — at JVM shutdown the Analyzer's Snapshot is converted to a
# BundleSeed JSON containing winners (Pareto front + per-metric champions +
# balanced-optimum picks) plus observed per-metric ranges (min/max/mean/stdev).
# The next Core iteration reads this file to bias FW_Seq generation around the
# winners (narrowing the search space without losing universality).
#
# Schema is forward-compatible: schemaVersion=1, unknown keys are ignored by
# the reader.  See BundleSeed.java for the full contract.
#
# Default empty path → no dump (legacy behaviour unchanged).  Set the path to
# enable; the parent directory is auto-created.
#fw.analyzer.seedOutputPath=./runtime/bundle_seeds.json
# Optional traceability tag in the dumped seed (default: reader-<epoch_ms>).
#fw.analyzer.seedSourceRunId=run-${experimentId}

