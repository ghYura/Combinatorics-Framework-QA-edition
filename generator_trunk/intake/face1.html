<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bundle · Face 1 — Describe your task</title>
<!--
  FACE 1 — "Describe your task" (the intake face of the Bundle / Combinatorics Framework).
  Zero-dependency, single-file, offline. Nothing is fetched; nothing leaves the page.

  This is deliberately NOT the constraints editor ("Face 2"): that face is a blue,
  canvas / graph / matrix DRAWING tool for forbidding & requiring value-pairs. Face 1
  is a guided COMPOSER — you describe the moving parts of a combinatorial task in plain
  language and it writes a valid fwgen spec for you. Different metaphor (a stepper, not a
  canvas), different palette (violet + amber, dark-mode capable), same product family
  (rounded cards, soft shadows, plain-language everywhere, RU/EN, keyboard-complete).

  The newcomer never types an FW_ token: shapes compile to fwgen's authoring aliases
  (choose_one / choose_k(k) / permute / feature_subset / optional_action). The live count
  mirrors fwgen.spec_cardinality_plan (raw -> per-slot -> mandatory -> optional -> final)
  and is honest about confidence (EXACT / BOUNDED / UNKNOWN) and run class (S/B/L/X).
-->
<style>
  :root{
    /* ===== Instrument palette — Brushed Titanium (light) ===== */
    --bg:#c6cbd2; --paper:#e9edf1; --panel:#dadfe5;
    --ink:#171b21; --muted:#535b66; --faint:#868f9a; --line:#a6aeb9; --line-2:#c1c8d0;
    --brand:#215f86; --brand-2:#3f93c4; --brand-ink:#103a54;
    --gold:#9c6410; --gold-soft:#eee1c4;
    --exact:#1a7a69; --exact-soft:#d5ebe6;
    --bounded:#9c6410; --bounded-soft:#eee1c4;
    --unknown:#687079; --unknown-soft:#d6dbe1;
    --forbid:#b02a37; --require:#1c7d55;           /* reserved: Face-2 semantics, referenced only */
    --accent-soft:#d9e7f1;
    /* physical actuator keys — theme-independent anodized metal */
    --act:linear-gradient(180deg,#4fa2d1 0%,#2c7aa8 55%,#1a557d 100%);
    --act-b:#123c56;
    --act-ok:linear-gradient(180deg,#41c6ab 0%,#1c8a76 62%,#136b5b 100%);
    --act-bad:linear-gradient(180deg,#e2606a 0%,#b83540 72%);
    /* machined surfaces + bevels */
    --metal-hi:rgba(255,255,255,.9); --metal-lo:rgba(20,28,38,.18);
    --face:linear-gradient(180deg,#f5f8fa 0%,#e4eaef 54%,#dbe1e7 100%);
    --face-2:linear-gradient(180deg,#eef2f5 0%,#dfe5ea 100%);
    --well:linear-gradient(180deg,#d3d9df 0%,#e2e7ec 100%);
    --rail-face:linear-gradient(180deg,#2c333b 0%,#20262d 45%,#161b20 100%);
    --brushed:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,rgba(0,0,0,.015) 1px 3px);
    --bevel:inset 0 1px 0 var(--metal-hi), inset 0 -1px 0 var(--metal-lo);
    --radius:6px; --radius-sm:4px;
    --shadow:0 1px 2px rgba(20,28,38,.14), 0 8px 22px rgba(20,28,38,.12);
    --shadow-lg:0 24px 60px rgba(12,18,26,.32);
    --rail-w:290px; --meter-w:330px;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  [data-theme=dark]{
    /* ===== Instrument palette — Gunmetal (dark) ===== */
    --bg:#0f1216; --paper:#1e232b; --panel:#161a21;
    --ink:#e7ebf0; --muted:#99a2ad; --faint:#6b7480; --line:#333b45; --line-2:#262d36;
    --brand:#4ea8dc; --brand-2:#74c2ec; --brand-ink:#a9d8f0;
    --gold:#d3a144; --gold-soft:#2c2410;
    --exact:#37b89f; --exact-soft:#0d2b26;
    --bounded:#d3a144; --bounded-soft:#2c2410;
    --unknown:#8b93a0; --unknown-soft:#20262f;
    --accent-soft:#10273a;
    --metal-hi:rgba(255,255,255,.09); --metal-lo:rgba(0,0,0,.5);
    --face:linear-gradient(180deg,#272d35 0%,#1e242c 52%,#191e25 100%);
    --face-2:linear-gradient(180deg,#20262e 0%,#191e25 100%);
    --well:linear-gradient(180deg,#0e1217 0%,#171c23 100%);
    --rail-face:linear-gradient(180deg,#1b2026 0%,#12161d 60%,#0c0f14 100%);
    --brushed:repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 1px,rgba(0,0,0,.12) 1px 3px);
    --shadow:0 1px 2px rgba(0,0,0,.55), 0 12px 30px rgba(0,0,0,.5);
    --shadow-lg:0 28px 70px rgba(0,0,0,.65);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
    color:var(--ink); background:var(--bg); background-image:var(--brushed);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
  p{margin:0}
  a{color:var(--brand)}
  button{font:inherit;cursor:pointer}
  ::selection{background:var(--brand);color:#fff}
  :focus-visible{outline:2px solid var(--brand); outline-offset:2px; border-radius:3px}
  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);border:0}

  /* ---------- shell — instrument chassis ---------- */
  .app{display:grid; grid-template-columns:var(--rail-w) minmax(0,1fr) var(--meter-w);
       min-height:100vh; max-width:1560px; margin:0 auto;
       border-left:1px solid var(--line); border-right:1px solid var(--line);}
  @media (max-width:1180px){ .app{grid-template-columns:var(--rail-w) minmax(0,1fr)} .meter{display:none} }
  @media (max-width:820px){ .app{grid-template-columns:1fr} .rail{position:static;height:auto} }

  /* ---------- left rail — machined selector column ---------- */
  .rail{position:sticky; top:0; align-self:start; height:100vh; overflow:auto;
        background-color:#161b20; background-image:var(--brushed),var(--rail-face);
        color:#c8d0d8; padding:20px 16px; display:flex; flex-direction:column; gap:16px;
        border-right:1px solid #05070a; box-shadow:inset -1px 0 0 rgba(255,255,255,.05);}
  [data-theme=dark] .rail{color:#bcc5ce}
  .brand{display:flex; flex-direction:column; gap:9px; align-items:center; text-align:center; position:relative;
         background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.2));
         border:1px solid rgba(0,0,0,.45); border-radius:var(--radius); padding:13px 12px 12px;
         box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 1px 2px rgba(0,0,0,.4);}
  .brand::before,.brand::after{content:"";position:absolute;top:5px;width:5px;height:5px;border-radius:50%;
         background:radial-gradient(circle at 35% 30%,#9aa4ae,#4a525b 70%,#2a3037);
         box-shadow:inset 0 0 0 .5px rgba(0,0,0,.5), 0 1px 1px rgba(0,0,0,.4)}
  .brand::before{left:6px} .brand::after{right:6px}
  .brand .logo{flex:0 0 auto}
  .brand .btxt{display:block}
  .brand b{display:block; font:700 12.5px/1.32 system-ui,-apple-system,sans-serif; letter-spacing:.1em; text-transform:uppercase; color:#eef2f5}
  .brand b span{display:block; font-size:11px; letter-spacing:.16em; color:#9fb0bd; font-weight:600; margin-top:2px}
  .brand small{display:block; color:#8f9aa6; font-weight:500; font-size:10.5px; letter-spacing:.03em; margin-top:3px}
  .rail hr{border:0;border-top:1px solid rgba(0,0,0,.45);box-shadow:0 1px 0 rgba(255,255,255,.05);margin:2px 0}
  .steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
  .step{width:100%;text-align:left;background:transparent;border:1px solid transparent;color:#aeb7c0;
        padding:10px 11px;border-radius:var(--radius-sm);display:flex;gap:12px;align-items:flex-start;
        transition:background .14s,color .14s,border-color .14s}
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
  .step:hover{background:rgba(255,255,255,.05);color:#f0f3f6;border-color:rgba(255,255,255,.06)}
  .step[aria-current=step]{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(0,0,0,.12));
        color:#fff;border-color:rgba(0,0,0,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
  .step .num{flex:0 0 26px;height:26px;border-radius:var(--radius-sm);display:grid;place-items:center;
             font:700 12px/1 var(--mono);color:#cfd7df;
             background:linear-gradient(180deg,#3a424c,#252c34);border:1px solid #12161b;
             box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
  .step[aria-current=step] .num{background:var(--act);color:#fff;
             border-color:var(--act-b);box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 0 10px rgba(79,162,209,.55)}
  .step.done .num{background:var(--act-ok);color:#eafaf6;border-color:#0e3f36}
  .step .stx b{display:block;font-size:13px;font-weight:650;letter-spacing:.01em}
  .step .stx span{display:block;font-size:11px;color:#8b95a0;line-height:1.35;margin-top:2px}
  .step[aria-current=step] .stx span{color:#b7c1cb}
  .rail .grow{flex:1 1 auto}
  .railfoot{display:flex;flex-direction:column;gap:10px}
  .toggles{display:flex;gap:7px}
  .tgl{flex:1;color:#d3dae1;border-radius:var(--radius-sm);padding:8px 6px;font-size:11.5px;letter-spacing:.03em;
       display:flex;gap:6px;align-items:center;justify-content:center;
       background:linear-gradient(180deg,#333a43,#232a31);border:1px solid #12161b;
       box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 1px 2px rgba(0,0,0,.35)}
  .tgl:hover{background:linear-gradient(180deg,#3c444e,#2a313a);color:#fff}
  .tgl:active{box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
  .f2hint{font-size:11px;color:#aab4bf;background:rgba(0,0,0,.22);
          border:1px solid rgba(0,0,0,.4);border-left:2px solid var(--gold);border-radius:var(--radius-sm);
          padding:10px 11px;line-height:1.5;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
  .f2hint b{color:#eef2f5}

  /* ---------- main ---------- */
  .main{padding:28px clamp(18px,3.2vw,48px) 60px; min-width:0}
  .mhead{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line);box-shadow:0 1px 0 var(--metal-hi)}
  .kicker{color:var(--brand);font:700 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.22em}
  [data-theme=dark] .kicker{color:var(--brand-2)}
  .mhead h1{font-size:25px;margin:9px 0 7px;letter-spacing:-.02em}
  .mhead p{color:var(--muted);max-width:72ch;font-size:14px}

  /* machined panel */
  .card{background:var(--face);border:1px solid var(--line);border-radius:var(--radius);
        box-shadow:var(--bevel),var(--shadow);padding:17px 19px;margin:14px 0;position:relative}
  .card > h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:9px}
  .card .hint{color:var(--muted);font-size:12.5px;margin:6px 0 4px}

  /* buttons — raised machined metal */
  .btn{border:1px solid var(--line);background:var(--face);color:var(--ink);
       border-radius:var(--radius-sm);padding:8px 14px;font-weight:600;font-size:13.5px;letter-spacing:.01em;
       display:inline-flex;gap:8px;align-items:center;
       box-shadow:var(--bevel),0 1px 1.5px rgba(20,28,38,.16);transition:filter .12s,border-color .12s,color .12s}
  .btn:hover{border-color:var(--brand);color:var(--brand);filter:brightness(1.03)}
  .btn:active{box-shadow:inset 0 2px 5px rgba(0,0,0,.22)}
  .btn.primary{background:var(--act);border-color:var(--act-b);color:#fff;
       text-shadow:0 1px 1px rgba(0,0,0,.4);
       box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 7px rgba(18,50,80,.42)}
  .btn.primary:hover{filter:brightness(1.08);color:#fff}
  .btn.ghost{background:transparent;box-shadow:none}
  .btn.ghost:hover{background:var(--panel)}
  .btn.sm{padding:6px 10px;font-size:12.5px}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  .btn.gold{border-color:var(--gold);color:var(--gold);background:var(--face)}
  .btn.gold:hover{filter:brightness(1.03);color:var(--gold)}
  .navrow{display:flex;justify-content:space-between;gap:12px;margin-top:22px;align-items:center;flex-wrap:wrap;
          padding-top:16px;border-top:1px solid var(--line);box-shadow:0 -1px 0 var(--metal-hi)}

  /* inputs — recessed wells */
  input[type=text], textarea, select{
    font:inherit;color:var(--ink);background:var(--well);border:1px solid var(--line);
    border-radius:var(--radius-sm);padding:8px 10px;width:100%;box-shadow:inset 0 1px 3px rgba(20,28,38,.14)}
  input[type=text]:focus, textarea:focus, select:focus{border-color:var(--brand);outline:none;
    box-shadow:inset 0 1px 3px rgba(20,28,38,.14),0 0 0 3px rgba(63,147,196,.32)}
  label.fld{display:block;margin:10px 0}
  label.fld > span{display:block;font:600 11px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row > *{flex:1 1 200px}

  /* template gallery — machined tiles */
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:12px}
  .invitebox{border:1px solid var(--act);background:linear-gradient(135deg,var(--card),var(--accent-soft));border-radius:var(--radius);padding:16px;margin:14px 0}
  .inviteq{display:grid;grid-template-columns:minmax(210px,1fr) minmax(260px,2fr);gap:10px;margin:10px 0}
  .inviteq select,.inviteq input{width:100%}
  .invitegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;margin-top:10px}
  .inviteitem{border:1px solid var(--line);background:var(--card);border-radius:var(--radius-sm);padding:10px;font-size:12px}
  .inviteitem b{display:block;margin-bottom:4px}.inviteitem small{display:block;color:var(--muted);line-height:1.4}
  .invitegrowth{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.invitegrowth span{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 9px;font-size:11px}
  .invitewarn{border-left:4px solid var(--bounded);background:var(--bounded-soft);padding:8px 10px;border-radius:5px;font-size:12px;margin-top:9px}
  @media(max-width:700px){.inviteq{grid-template-columns:1fr}}
  .tpl{text-align:left;background:var(--face);border:1px solid var(--line);border-radius:var(--radius);
       padding:15px;box-shadow:var(--bevel),var(--shadow);position:relative;transition:transform .12s,border-color .12s,box-shadow .12s}
  .tpl:hover{transform:translateY(-2px);border-color:var(--brand);box-shadow:var(--bevel),var(--shadow-lg)}
  .tpl .ic{font-size:21px;filter:grayscale(1) contrast(.9);opacity:.9}
  .tpl b{display:block;margin:9px 0 4px;font-size:14px}
  .tpl p{color:var(--muted);font-size:12.5px;line-height:1.45}
  .tpl .src{margin-top:9px;font-size:10.5px;color:var(--faint);font-family:var(--mono);letter-spacing:.02em}
  .tpl.blank{border-style:dashed;background:transparent;box-shadow:none}
  .tpl.blank .ic{filter:none;opacity:1;color:var(--brand)}
  .tpl.ex{border-left:3px solid var(--exact)}
  .tpl.ex .ic{filter:none;opacity:1;color:var(--exact);font-weight:800}
  .tpl.ex:hover{border-color:var(--exact)}

  /* dimension / action modules */
  .dim{border:1px solid var(--line);border-radius:var(--radius);background:var(--face);
       box-shadow:var(--bevel),var(--shadow);margin:12px 0;overflow:hidden}
  .dim.opt{border-left:3px solid var(--gold)}
  .dim .dhead{display:flex;gap:11px;align-items:center;padding:12px 14px;background:var(--face-2);
       border-bottom:1px solid var(--line);box-shadow:inset 0 1px 0 var(--metal-hi);flex-wrap:wrap}
  .dim .dhead .grow{flex:1 1 180px;min-width:150px}
  .dim .dbody{padding:14px}
  .drag{cursor:grab;color:var(--faint);font-size:16px;user-select:none;padding:3px 5px;border-radius:var(--radius-sm);touch-action:none;
        background:var(--well);border:1px solid var(--line);box-shadow:inset 0 1px 2px rgba(20,28,38,.12)}
  .drag:hover{color:var(--brand)}
  .drag:active{cursor:grabbing}
  .dim.dragging{opacity:.4}
  .dim.dragover{outline:2px dashed var(--brand);outline-offset:2px;border-radius:var(--radius)}
  .reord{display:inline-flex;flex-direction:column;gap:2px;margin-right:2px}
  .reord button{border:1px solid var(--line);background:var(--face);color:var(--faint);font-size:9px;line-height:1;
        padding:2px 5px;border-radius:3px;box-shadow:var(--bevel)}
  .reord button:hover:not(:disabled){color:var(--brand);border-color:var(--brand)}
  .reord button:disabled{opacity:.3;cursor:not-allowed}
  .idx{width:26px;height:26px;border-radius:var(--radius-sm);display:grid;place-items:center;flex:0 0 auto;
       font:700 12px/1 var(--mono);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.35);
       background:var(--act);border:1px solid var(--act-b);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
  .dim.opt .idx{background:linear-gradient(180deg,#d9ab52,#9c6410);border-color:#6b450b}
  .tip{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--muted);background:var(--panel);
       border:1px solid var(--line);border-left:2px solid var(--brand);border-radius:var(--radius-sm);
       padding:9px 12px;margin:2px 0 10px;box-shadow:inset 0 1px 0 var(--metal-hi)}
  .tip .ti{color:var(--brand);flex:0 0 auto;font-weight:700}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--face);border:1px solid var(--line);
        border-radius:var(--radius-sm);padding:4px 6px 4px 10px;font-size:12.5px;box-shadow:var(--bevel)}
  .chip .base{font:700 9px/1 var(--mono);color:var(--gold);background:var(--gold-soft);border-radius:3px;padding:2px 5px;text-transform:uppercase;letter-spacing:.06em}
  .chip button{border:0;background:transparent;color:var(--faint);font-size:14px;line-height:1;padding:0 2px;border-radius:3px}
  .chip button:hover{color:var(--forbid)}
  .addval{display:flex;gap:7px;max-width:420px}
  .addval input{flex:1}

  /* shape picker — selector switches */
  .shapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:9px;margin-top:6px}
  .shape{position:relative;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--face);
         padding:11px 12px;text-align:left;box-shadow:var(--bevel);transition:border-color .12s,box-shadow .12s}
  .shape:hover{border-color:var(--brand-2)}
  .shape[aria-pressed=true]{border-color:var(--brand);background:linear-gradient(180deg,var(--accent-soft),var(--face));
         box-shadow:inset 0 0 0 1px var(--brand),var(--bevel)}
  [data-theme=dark] .shape[aria-pressed=true]{background:linear-gradient(180deg,var(--accent-soft),var(--panel))}
  .shape .ttl{font-weight:650;font-size:13px;display:flex;align-items:center;gap:7px}
  .shape .ex{color:var(--muted);font-size:11.5px;margin-top:4px;line-height:1.4}
  .shape .frm{margin-top:7px;font:700 12px/1 var(--mono);color:var(--brand)}
  [data-theme=dark] .shape .frm{color:var(--brand-2)}
  .shape .tick{position:absolute;top:8px;right:9px;color:var(--brand);font-weight:800;opacity:0;font-size:13px}
  .shape[aria-pressed=true] .tick{opacity:1}
  .kbox{display:flex;align-items:center;gap:9px;margin-top:10px;font:600 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .kbox input{width:74px}
  details.adv{margin-top:12px}
  details.adv summary{cursor:pointer;color:var(--brand);font:600 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em}
  [data-theme=dark] details.adv summary{color:var(--brand-2)}

  .dcount{margin-left:auto;display:flex;align-items:center;gap:8px}
  /* status capsules — etched instrument tags */
  .pill{display:inline-flex;align-items:center;gap:6px;border-radius:3px;padding:3px 9px;font:700 12px/1.3 var(--mono);
        border:1px solid var(--line);box-shadow:var(--bevel)}
  .pill.exact{background:var(--exact-soft);color:var(--exact);border-color:var(--exact)}
  .pill.bounded{background:var(--bounded-soft);color:var(--bounded);border-color:var(--bounded)}
  .pill.unknown{background:var(--unknown-soft);color:var(--unknown);border-color:var(--unknown)}
  .pill .ico{font-weight:900}

  .empty{border:1px dashed var(--line);border-radius:var(--radius);padding:26px;text-align:center;color:var(--muted);
         background:var(--panel);box-shadow:inset 0 1px 3px rgba(20,28,38,.08)}
  .empty .big{font-size:28px;margin-bottom:8px;filter:grayscale(1);opacity:.8}

  /* goals / verdicts */
  .grow2{display:grid;grid-template-columns:1fr 176px auto;gap:9px;align-items:center;margin:8px 0}
  .grow2 .dirseg{display:flex;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--bevel)}
  .grow2 .dirseg button{flex:1;border:0;background:var(--face);color:var(--muted);padding:8px 6px;font:600 12px/1 var(--mono);letter-spacing:.03em;text-transform:uppercase}
  .grow2 .dirseg button+button{border-left:1px solid var(--line)}
  .grow2 .dirseg button.on{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3)}
  .grow2 .dirseg button.on[data-d=max]{background:var(--act-ok)}
  .grow2 .dirseg button.on[data-d=min]{background:var(--act)}
  .verdrow{display:grid;grid-template-columns:70px 1fr auto;gap:9px;align-items:center;margin:8px 0}
  .icon-x{border:1px solid transparent;background:transparent;color:var(--faint);font-size:16px;border-radius:var(--radius-sm);padding:3px 7px}
  .icon-x:hover{color:var(--forbid);background:var(--panel);border-color:var(--line)}

  /* review — etched terminal readouts */
  pre.code{background:#0d1117;color:#c9d6e2;border-radius:var(--radius);padding:14px 16px;overflow:auto;
           font:12.5px/1.6 var(--mono);border:1px solid #05070a;max-height:420px;box-shadow:inset 0 2px 8px rgba(0,0,0,.5)}
  [data-theme=dark] pre.code{background:#0a0d12}
  .codehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;gap:10px;flex-wrap:wrap}
  .codehead h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em}
  .summary-line{font-size:15px;line-height:1.6;background:var(--panel);border:1px solid var(--line);
                border-left:2px solid var(--brand);border-radius:var(--radius);padding:14px 16px;box-shadow:inset 0 1px 0 var(--metal-hi)}
  .summary-line b{color:var(--brand);font-variant-numeric:tabular-nums} [data-theme=dark] .summary-line b{color:var(--brand-2)}
  .next{display:flex;gap:11px;flex-wrap:wrap;margin-top:6px}
  .nextcard{flex:1 1 210px;border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;background:var(--face);box-shadow:var(--bevel)}
  .nextcard.act{cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .12s,border-color .12s,box-shadow .12s}
  .nextcard.act:hover{transform:translateY(-2px);border-color:var(--brand);box-shadow:var(--bevel),var(--shadow-lg)}
  .nextcard.act:active{box-shadow:inset 0 2px 5px rgba(0,0,0,.22)}
  .nextcard.act::after{content:"▸";float:right;color:var(--brand);font-weight:800;margin-top:-2px}
  .nextcard .n{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin-bottom:5px}
  .nextcard p{color:var(--muted);font-size:12.5px}
  .nextcard code{font-family:var(--mono);font-size:11.5px;background:var(--panel);border:1px solid var(--line);padding:1px 5px;border-radius:3px;word-break:break-all}

  /* ---------- right meter — gauge column ---------- */
  .meter{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;
         background:var(--panel);background-image:var(--brushed);
         border-left:1px solid var(--line);box-shadow:inset 1px 0 0 var(--metal-hi);padding:20px 17px}
  .meter h2{font:700 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
  /* digital readout display */
  .bignum{font:800 38px/1.05 var(--mono);letter-spacing:.01em;margin:12px 0 4px;word-break:break-all;
          color:#5fd0ff;background:#0b0f14;border:1px solid #05070a;border-radius:var(--radius);
          padding:12px 14px;font-variant-numeric:tabular-nums;
          box-shadow:inset 0 2px 10px rgba(0,0,0,.6);text-shadow:0 0 12px rgba(95,208,255,.45)}
  .bignum.small{font-size:26px}
  .metersub{color:var(--muted);font-size:12px}
  .metrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:12.5px;box-shadow:0 -1px 0 var(--metal-hi)}
  .metrow:first-of-type{border-top:0;box-shadow:none}
  .metrow .k{color:var(--muted)} .metrow .v{font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
  .metrow .v small{display:block;font-weight:500;color:var(--faint);font-size:10px;font-family:inherit}
  /* run-class status lamp */
  .rc{display:inline-flex;align-items:center;gap:8px;border-radius:var(--radius-sm);padding:9px 12px;font:700 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;width:100%;justify-content:center;margin-top:8px;border:1px solid var(--line);box-shadow:var(--bevel)}
  .rc small{font-weight:500;letter-spacing:0;text-transform:none;opacity:.85}
  .rc.S{background:var(--exact-soft);color:var(--exact);border-color:var(--exact)}
  .rc.B{background:var(--accent-soft);color:var(--brand);border-color:var(--brand)} [data-theme=dark] .rc.B{color:var(--brand-2)}
  .rc.L{background:var(--bounded-soft);color:var(--bounded);border-color:var(--bounded)}
  .rc.X{background:#f6e0e1;color:var(--forbid);border-color:var(--forbid)} [data-theme=dark] .rc.X{background:#331a1c;color:#ff9ea1}
  .wall{margin-top:12px;font-size:12px;line-height:1.5;color:var(--muted);background:var(--paper);
        border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:var(--radius-sm);padding:10px 11px}
  .legend{margin-top:14px;font-size:11px;color:var(--faint);line-height:1.9}
  .legend .pill{font-size:10.5px;padding:2px 7px}
  .mbar{display:none}
  @media (max-width:1180px){
    .mbar{display:flex;position:sticky;bottom:0;z-index:20;gap:14px;align-items:center;justify-content:space-between;
          background:var(--face);border-top:1px solid var(--line);box-shadow:var(--bevel),0 -6px 20px rgba(20,28,38,.14);
          padding:10px 16px}
    .mbar .bn{font:800 22px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--brand)}
  }
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
         background:#0d1117;color:#eaf1f7;padding:10px 18px;border-radius:var(--radius-sm);border:1px solid #05070a;
         box-shadow:var(--shadow-lg);font:600 13px/1 var(--mono);letter-spacing:.02em;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- run flow: config, actuator, windows ---------- */
  .cfggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
  .cfggrid label.fld{margin:0}
  /* ---- control panel (Face 1 = control panel for everything) ---- */
  .cpanel{margin:6px 0 4px}
  .cpbanner{font:700 12px/1.3 var(--mono);letter-spacing:.02em;padding:9px 12px;border-radius:var(--radius-sm);margin-bottom:10px;border:1px solid var(--line);box-shadow:var(--bevel)}
  .cpbanner.local{color:var(--brand-ink);background:var(--accent-soft);border-color:var(--brand)}
  [data-theme=dark] .cpbanner.local{color:var(--brand-2)}
  .cpbanner.gw{color:#7a4e0c;background:var(--gold-soft);border-color:var(--gold)}
  [data-theme=dark] .cpbanner.gw{color:var(--gold)}
  details.cpsect{border:1px solid var(--line);border-radius:var(--radius);margin:8px 0;background:var(--face-2);overflow:hidden;box-shadow:var(--bevel)}
  details.cpsect>summary{cursor:pointer;list-style:none;padding:11px 14px;font:700 12.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em;
    display:flex;align-items:center;gap:9px;user-select:none}
  details.cpsect>summary::-webkit-details-marker{display:none}
  details.cpsect>summary::after{content:"▸";margin-left:auto;color:var(--faint);transition:transform .15s}
  details.cpsect[open]>summary::after{transform:rotate(90deg)}
  details.cpsect>summary:hover{background:var(--panel)}
  details.cpsect .ci{font-size:14px;filter:grayscale(1);opacity:.85}
  details.cpsect .chint{font-weight:500;text-transform:none;letter-spacing:0;color:var(--faint);font-size:11px;margin-left:2px;font-family:system-ui,sans-serif}
  details.cpsect .cfggrid{padding:6px 14px 14px}
  .cpfld>span{display:block;font:600 11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:5px}
  .flg{font-family:var(--mono);font-size:10px;color:var(--faint);text-transform:none;letter-spacing:0;
    background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:0 4px}
  .whystr{color:#9c6410;font-style:normal;font-size:10px} [data-theme=dark] .whystr{color:var(--gold)}
  .fld.off,.cpbool.off{opacity:.5}
  .fld.off input,.fld.off select,.cpbool.off input{cursor:not-allowed}
  label.cpbool{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:0;padding:7px 0}
  label.cpbool input{width:16px;height:16px;accent-color:var(--brand);flex:0 0 auto}
  label.cpbool>span{font-size:12px;color:var(--ink)}
  .cpnote{font-size:11px;color:var(--muted);padding:0 14px 12px}
  .cmdhead{margin-top:12px;font-size:12.5px;color:var(--muted)}
  /* run actuator — industrial key */
  .hugebtn{width:100%;border:1px solid var(--act-b);border-radius:var(--radius);padding:18px 24px;margin:14px 0 4px;
    background:var(--act);color:#fff;font:800 19px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;
    text-shadow:0 1px 2px rgba(0,0,0,.4);cursor:pointer;display:flex;gap:13px;align-items:center;justify-content:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 6px rgba(0,0,0,.25),0 6px 18px rgba(18,50,80,.45)}
  .hugebtn:hover{filter:brightness(1.08)}
  .hugebtn:active{box-shadow:inset 0 3px 8px rgba(0,0,0,.4)}
  .hugebtn .rk{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.18);border-radius:3px;padding:3px 11px;font-size:14px}
  .runactions{display:flex;gap:10px;margin-top:10px}
  .runactions .actbtn{flex:1;justify-content:center}
  .runhint{text-align:center;color:var(--muted);font-size:11.5px;margin-top:8px;font-family:var(--mono);letter-spacing:.02em}
  .oraclenote{margin-top:13px;padding-top:12px;border-top:1px solid var(--line);box-shadow:0 -1px 0 var(--metal-hi);font-size:12px;color:var(--muted);line-height:1.5}
  .oraclenote b{color:var(--ink);font-weight:650}

  /* ---------- modal windows — machined dialogs ---------- */
  .overlay{position:fixed;inset:0;background:rgba(10,14,20,.62);display:grid;place-items:center;z-index:100;padding:20px}
  @supports (backdrop-filter:blur(2px)){ .overlay{backdrop-filter:blur(3px)} }
  .win{background:var(--face);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--bevel),var(--shadow-lg);
    width:min(940px,100%);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;animation:pop .16s ease}
  @keyframes pop{from{transform:translateY(12px) scale(.985)}to{transform:none}}
  @media (prefers-reduced-motion:reduce){ .win{animation:none} }
  .win.sm{width:min(470px,100%)} .win.wide{width:min(1120px,100%)}
  .win-head{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);
    background:var(--face-2);box-shadow:inset 0 1px 0 var(--metal-hi)}
  .win-head h2{font-size:15px;text-transform:uppercase;letter-spacing:.05em;flex:1;display:flex;align-items:center;gap:10px}
  .win-head .x{border:1px solid transparent;background:transparent;font-size:19px;color:var(--muted);cursor:pointer;border-radius:var(--radius-sm);padding:0 8px}
  .win-head .x:hover{background:var(--panel);color:var(--ink);border-color:var(--line)}
  .win-body{padding:18px 20px;overflow:auto}
  .win-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:13px 20px;border-top:1px solid var(--line);background:var(--panel);box-shadow:inset 0 1px 0 var(--metal-hi)}
  .win-foot .spread{margin-right:auto}
  .previewbar{font-size:12px;color:var(--bounded);background:var(--bounded-soft);border:1px solid var(--bounded);
    border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:14px;line-height:1.45}
  .dlg h2{font-size:18px;margin-bottom:9px;line-height:1.3;text-transform:none;letter-spacing:-.01em} .dlg p{color:var(--muted);font-size:13.5px;margin-bottom:2px}

  /* pipeline stages — instrument rows */
  .stage{padding:12px 0;border-top:1px solid var(--line)} .stage:first-child{border-top:0}
  .stage .top{display:flex;gap:12px;align-items:center}
  .stdot{width:24px;height:24px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font:800 12px/1 var(--mono);
    background:var(--well);color:var(--unknown);border:1px solid var(--line);box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
  .stage.run .stdot{background:var(--act);color:#fff;border-color:var(--act-b)} .stage.done .stdot{background:var(--act-ok);color:#fff;border-color:#0e3f36}
  .stage.failed .stdot{background:var(--act-bad);color:#fff;border-color:#6e1a22} .stage.failed .stbar i{background:var(--forbid)}
  .backend{font:600 11px/1 var(--mono);letter-spacing:.04em;border-radius:3px;padding:4px 9px;display:inline-flex;align-items:center;gap:5px;align-self:flex-start;border:1px solid var(--line)}
  .backend.real{background:var(--exact-soft);color:var(--exact);border-color:var(--exact)} .backend.off{background:var(--panel);color:var(--muted)}
  .failbar{background:var(--act-bad);color:#fff;border-radius:var(--radius-sm);padding:9px 12px;margin-bottom:12px;font-weight:600;font-size:13px;border:1px solid #6e1a22;box-shadow:var(--bevel)}
  .stage .nm{flex:1;font-weight:650;font-size:13.5px} .stage .sm{color:var(--muted);font-size:12px;text-align:right;font-family:var(--mono)}
  /* progress gauge */
  .stbar{height:8px;border-radius:3px;background:var(--well);overflow:hidden;margin:8px 0 0 36px;border:1px solid var(--line);box-shadow:inset 0 1px 3px rgba(0,0,0,.28)}
  .stbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2c7aa8,#4fa2d1);box-shadow:0 0 8px rgba(79,162,209,.5);transition:width .18s}
  .stage.done .stbar i{background:linear-gradient(90deg,#1c8a76,#41c6ab)}
  @media (prefers-reduced-motion:reduce){ .stbar i{transition:none} }
  .spin{width:14px;height:14px;border:2.5px solid rgba(122,132,142,.35);border-top-color:currentColor;border-radius:50%;
    display:inline-block;vertical-align:-2px;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}} @media (prefers-reduced-motion:reduce){ .spin{animation:none} }
  pre.log{background:#0b0f14;color:#c6d3df;border-radius:var(--radius);padding:14px 15px;overflow:auto;max-height:60vh;
    font:12px/1.55 var(--mono);border:1px solid #05070a;white-space:pre-wrap;word-break:break-word;box-shadow:inset 0 2px 8px rgba(0,0,0,.55)}
  .log .lc{color:#7f8b99} .log .lok{color:#37b89f} .log .lwarn{color:#d3a144} .log .lerr{color:#ff8a8d}

  /* ---------- face 3 — results ---------- */
  .hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  .hero .big{font:800 40px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--exact)}
  .obar{display:flex;height:28px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line);min-width:240px;flex:1;box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
  .obar span{display:grid;place-items:center;color:#fff;font:700 12px/1 var(--mono);min-width:0;overflow:hidden;text-shadow:0 1px 1px rgba(0,0,0,.3)}
  .obar .pass{background:var(--act-ok)} .obar .fail{background:var(--act-bad)}
  .winners{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:11px}
  .wcard{border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;background:var(--face);box-shadow:var(--bevel)}
  .wcard .g{font:600 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)} .wcard .v{font:800 19px/1.2 var(--mono);color:var(--brand);font-variant-numeric:tabular-nums}
  [data-theme=dark] .wcard .v{color:var(--brand-2)}
  .wcard .c{font-size:11px;color:var(--faint);font-family:var(--mono);margin-top:5px;word-break:break-all}
  .paretobox{border:1px solid var(--line);border-radius:var(--radius);padding:14px;background:var(--panel);box-shadow:inset 0 1px 3px rgba(20,28,38,.1)}
  table.cands{width:100%;border-collapse:collapse;font-size:12.5px}
  table.cands th,table.cands td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)}
  table.cands th{color:var(--muted);font:600 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;background:var(--face-2)}
  table.cands td.mono,table.cands td .mono{font-family:var(--mono);font-size:11.5px}
  .tag{display:inline-flex;align-items:center;gap:5px;border-radius:3px;padding:2px 8px;font:700 11px/1.3 var(--mono);border:1px solid transparent}
  .tag.PASS{background:var(--exact-soft);color:var(--exact);border-color:var(--exact)} .tag.FAIL{background:#f6e0e1;color:var(--forbid);border-color:var(--forbid)}
  [data-theme=dark] .tag.FAIL{background:#331a1c;color:#ff9ea1}
  .sec-h{font:700 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:20px 0 9px}
</style>
</head>

/* ============================================================================
   Shape catalogue — the "shape of freedom" picker. Each shape maps to an fwgen
   authoring alias (no FW_ token) or, for the advanced repetition shapes, a raw
   engine verb. `count(n,k)` mirrors fwgen.verb_output_count exactly (BigInt).
   ============================================================================ */
const SHAPES = {
  one:    {icon:"◦", alias:()=>"choose_one",           needK:false, adv:false,
           count:(n)=>BigInt(Math.max(1,n))},
  k:      {icon:"⋮", alias:(k)=>`choose_k(${k})`,      needK:true,  adv:false,
           count:(n,k)=>nCr(n,k)},
  subset: {icon:"⚟", alias:()=>"feature_subset",       needK:false, adv:false,
           count:(n)=>2n**BigInt(n)},
  order:  {icon:"⇄", alias:()=>"permute",              needK:false, adv:false,
           count:(n)=>bfact(n)},
  orderK: {icon:"⇉", alias:(k)=>`permute(${k})`,       needK:true,  adv:true,
           count:(n,k)=>nPr(n,k)},
  seqR:   {icon:"∞", verb:(k)=>`FW_PermutR(${k})`,     needK:true,  adv:true,
           count:(n,k)=>BigInt(Math.max(0,n))**BigInt(Math.max(0,k))},
  kR:     {icon:"⊕", verb:(k)=>`FW_CombiR(${k})`,      needK:true,  adv:true,
           count:(n,k)=>nCr(n+k-1,k)}
};
const SHAPE_ORDER = ["one","k","subset","order","orderK","seqR","kR"];

/* BigInt combinatorics (exact — match Python's math.comb / perm / factorial) */
function bfact(n){n=Math.max(0,n|0);let r=1n;for(let i=2n;i<=BigInt(n);i++)r*=i;return r;}
function nPr(n,k){if(k<0||k>n)return 0n;let r=1n;for(let i=0;i<k;i++)r*=BigInt(n-i);return r;}
function nCr(n,k){if(k<0||n<0||k>n)return 0n;k=Math.min(k,n-k);let num=1n,den=1n;
  for(let i=0;i<k;i++){num*=BigInt(n-i);den*=BigInt(i+1);}return num/den;}

/* ============================================================================
   Cardinality — mirrors fwgen.spec_cardinality_plan (BigInt, honest tiers)
   ============================================================================ */
function slotCount(d){
  const n = (d.options||[]).length; const sh = SHAPES[d.shape]||SHAPES.one;
  if(n<1) return 1n;
  let k = Math.max(1, Math.min(parseInt(d.k||2,10)||1, sh===SHAPES.seqR? 99 : n));
  if(d.shape==="seqR") k = Math.max(1, parseInt(d.k||2,10)||1);       // n^k allows k free
  if(d.shape==="kR")   k = Math.max(1, parseInt(d.k||2,10)||1);
  try{ return sh.count(n,k); }catch(e){ return 1n; }
}
function plan(){
  const dims = S.dims.filter(d=>(d.options||[]).length>=1);
  let mand = 1n; for(const d of dims) mand *= (slotCount(d)||1n);
  let optM = 1n; for(const o of S.opts.filter(x=>(x.options||[]).length)){ const n=o.options.length; optM *= BigInt(n+1); }
  // no constraints are emitted by Face 1, so post-sieve == mandatory (EXACT), matching `bundle plan`.
  const finalV = mand*optM;
  return {dims:dims.length, mandatory:mand, optMult:optM, final:finalV, mode:"EXACT"};
}
function runClass(v){ // matches bundle/resources.ResourceThresholds defaults
  if(v===null) return "X";
  if(v<=500n) return "S"; if(v<=50000n) return "B"; if(v<=5000000n) return "L"; return "X";
}

/* ---- number formatting: exact grouped digits, plus sci approximation when huge ---- */
function grp(b){const s=b.toString();return s.replace(/\B(?=(\d{3})+(?!\d))/g," ");}
function fmt(b){
  const s=b.toString();
  if(s.length<=15) return grp(b);
  if(s.length>61) return "> 10^60";
  const exp=s.length-1, lead=s[0]+"."+s.slice(1,3);
  return grp(b).length>26 ? `≈ ${lead} × 10^${exp}` : grp(b);
}
function fmtShort(b){const s=b.toString(); if(s.length<=9) return grp(b); const exp=s.length-1; return `≈10^${exp}`;}

function runExample(id){
  if(!REAL) return noBackendGate(false);
  const ex=EXAMPLES.find(e=>e.id===id); if(!ex) return;
  const goals=(ex.analyzer||"").split(",").filter(Boolean).map(s=>{const p=s.split(":");return{metric:p[0],dir:(p[1]||"max")};});
  RUN={real:true, sieve:false, status:"running", logN:[], logD:[], stages:realStageList(false),
       cursor:0, goals, token:undefined, serverResults:null, exit:null, example:ex};
  openProgress();
  nlog(`$ verified example: ${ex.title||ex.id}  (${ex.pass}/${ex.candidates} PASS)`,"lc"); refreshLog();
  fetch("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({example:id})})
    .then(r=>r.json()).then(d=>{
      if(!RUN||RUN.status==="stopped")return;
      if(!d||d.error){ RUN.status="error"; nlog("[run] "+((d&&d.error)||"error"),"lerr"); refreshLog(); paintProgress(); return; }
      RUN.token=d.token; RUN.runId=d.run_id; nlog(`[run] started run_id=${d.run_id} db=${d.db}`,"lc"); refreshLog(); pollReal();
    }).catch(e=>{ if(RUN){ RUN.status="error"; nlog("[run] "+e,"lerr"); refreshLog(); paintProgress(); } });
}
function applyTemplate(id){

  const tp = TEMPLATES.find(x=>x.id===id); if(!tp) return;
  const b = tp.build();
  S.name=b.name; S.note=b.note; S.dims=b.dims; S.opts=b.opts||[]; S.goals=b.goals||[]; S.verdicts=b.verdicts||[];

/* ---- STEP 1: dimensions ---- */
function renderDims(){
  let body;
  if(S.dims.length===0){
    body = `<div class="empty"><div class="big" aria-hidden="true">🧱</div>${t("s1_empty")}</div>`;
  } else {

    `<button class="btn primary" id="adddim" style="margin-top:14px">＋ ${t("s1_add")}</button>` + navRow(true,true);

     const cards=$main.querySelectorAll(".dim"); const last=cards[cards.length-1];
     if(last){last.scrollIntoView({behavior:"smooth",block:"center"}); const nm=last.querySelector("input.dname"); if(nm) nm.focus();}};

function dimCard(d,i,isOpt){
  const n=(d.options||[]).length;
  const total=(isOpt?S.opts:S.dims).length;
  const chips = (d.options||[]).map((v,vi)=>`<span class="chip">${vi===0&&!isOpt?`<span class="base">${t("s1_baseline")}</span>`:""}${esc(v)}
     <button data-del="${vi}" aria-label="remove option ${attr(v)}">×</button></span>`).join("");
  let countPill="";
  if(!isOpt){
    if(n<2){ countPill=`<span class="pill unknown"><span class="ico">·</span>${t("s1_needopts")}</span>`; }
    else { const c=slotCount(d); countPill=`<span class="pill exact"><span class="ico">✓</span>${fmt(c)}</span>`; }
  } else {
    const c=BigInt(Math.max(1,n)+1);
    countPill=`<span class="pill bounded"><span class="ico">×</span>${fmt(c)}</span>`;
  }
  let shapePicker="";
  if(!isOpt){
    const prim = SHAPE_ORDER.filter(s=>!SHAPES[s].adv);
    const adv  = SHAPE_ORDER.filter(s=>SHAPES[s].adv);
    const cell=(s)=>{
      const sh=SHAPES[s]; const on=d.shape===s;
      const cnt = n>=1? fmt(sh.count(n, Math.max(1,Math.min(parseInt(d.k||2,10)||1, s==="seqR"||s==="kR"?99:n)))) : "—";
      const plain=t("plainshapes")[s].replace("{k}", d.k||2);
      return `<button class="shape" data-shape="${s}" aria-pressed="${on}">
        <span class="tick" aria-hidden="true">✓</span>
        <span class="ttl"><span aria-hidden="true">${sh.icon}</span>${plain}</span>
        <span class="frm">→ ${n>=1?cnt:"—"}</span></button>`;
    };
    const needK = SHAPES[d.shape] && SHAPES[d.shape].needK;
    const kbox = needK? `<div class="kbox"><label>${t("s1_kfor")}</label>
        <input type="text" inputmode="numeric" class="dk" value="${attr(d.k||2)}" aria-label="k value"></div>`:"";
    shapePicker = `<div style="margin-top:6px"><span style="font-size:12.5px;font-weight:600;color:var(--muted)">${t("s1_shape")}</span>
      <div class="shapes">${prim.map(cell).join("")}</div>
      <details class="adv"${adv.includes(d.shape)?" open":""}><summary>⋯ more shapes</summary>
        <div class="shapes" style="margin-top:8px">${adv.map(cell).join("")}</div></details>
      ${kbox}</div>`;
  } else {
    shapePicker=`<p class="hint">${t("s2_mult")}</p>`;
  }
  const upL=t("mv_up"), dnL=t("mv_down");
  return `<div class="dim${isOpt?" opt":""}" data-id="${d.id}">
    <div class="dhead">
      <span class="drag" role="button" tabindex="-1" draggable="true" title="${attr(t('mv_drag'))}" aria-label="${attr(t('mv_drag'))}">⠿</span>
      <span class="reord">
        <button data-up aria-label="${attr(upL)}" title="${attr(upL)}" ${i===0?'disabled':''}>▲</button>
        <button data-down aria-label="${attr(dnL)}" title="${attr(dnL)}" ${i===total-1?'disabled':''}>▼</button>
      </span>
      <span class="idx">${i+1}</span>
      <span class="grow"><input type="text" class="dname" value="${attr(d.name)}" placeholder="${attr(isOpt? (S.lang==='ru'?'напр., Повтор':'e.g. Retry') : t('s1_nameph'))}" aria-label="${t('s1_name')}"></span>
      <span class="dcount">${countPill}
        <button class="icon-x" data-delcard aria-label="remove dimension">🗑</button></span>
    </div>
    <div class="dbody">
      <div class="chips">${chips||`<span style="color:var(--faint);font-size:12.5px">${isOpt?'':''}</span>`}</div>
      <div class="addval"><input type="text" class="optin" placeholder="${attr(t('s1_optph'))}" aria-label="${t('s1_addopt')}">
        <button class="btn sm addopt">＋</button></div>
      ${shapePicker}
    </div></div>`;
}

function wireDimCards(isOpt){
  const list = isOpt? S.opts : S.dims;
  $main.querySelectorAll(".dim").forEach(card=>{
    const id=card.dataset.id; const d=list.find(x=>x.id===id); if(!d) return;
    const kind = isOpt?"opt":"dim";
    const rerender = ()=>{isOpt?renderOpts():renderDims();syncMeter();};
    card.querySelector(".dname").oninput = e=>{d.name=e.target.value;save();};
    card.querySelector("[data-delcard]").onclick = ()=>{const ix=list.indexOf(d);list.splice(ix,1);save();rerender();};
    // ---- reorder: accessible up/down buttons ("in any sequence") ----
    const moveBy=(dir)=>{const ix=list.indexOf(d);const j=ix+dir;if(j<0||j>=list.length)return;
      const tmp=list[ix];list[ix]=list[j];list[j]=tmp;save();rerender();
      const moved=$main.querySelector('.dim[data-id="'+id+'"]');
      if(moved){moved.scrollIntoView({block:"nearest"});const b=moved.querySelector(dir<0?'[data-up]':'[data-down]')||moved.querySelector('.drag');if(b&&b.focus)b.focus();}};
    const up=card.querySelector("[data-up]"), dn=card.querySelector("[data-down]");
    if(up)up.onclick=()=>moveBy(-1); if(dn)dn.onclick=()=>moveBy(1);
    // ---- reorder: drag-and-drop via the ⠿ handle ----
    const handle=card.querySelector(".drag");
    if(handle){
      handle.addEventListener("dragstart",e=>{DRAG={list:kind,id};e.dataTransfer.effectAllowed="move";
        try{e.dataTransfer.setData("text/plain",id);}catch(_){}
        setTimeout(()=>card.classList.add("dragging"),0);});
      handle.addEventListener("dragend",()=>{card.classList.remove("dragging");DRAG=null;
        $main.querySelectorAll(".dim.dragover").forEach(x=>x.classList.remove("dragover"));});
    }
    card.addEventListener("dragover",e=>{if(DRAG&&DRAG.list===kind&&DRAG.id!==id){e.preventDefault();e.dataTransfer.dropEffect="move";card.classList.add("dragover");}});
    card.addEventListener("dragleave",()=>card.classList.remove("dragover"));
    card.addEventListener("drop",e=>{if(!DRAG||DRAG.list!==kind||DRAG.id===id)return;e.preventDefault();
      card.classList.remove("dragover");
      const from=list.findIndex(x=>x.id===DRAG.id), to=list.findIndex(x=>x.id===id);
      DRAG=null; if(from<0||to<0)return; const [m]=list.splice(from,1); list.splice(to,0,m); save(); rerender();});
    const addOpt=()=>{const inp=card.querySelector(".optin");const v=inp.value.trim();if(!v)return;
      d.options.push(v);inp.value="";save();isOpt?renderOpts():renderDims();syncMeter();
      const c=$main.querySelector(`.dim[data-id="${id}"] .optin`); if(c)c.focus();};
    card.querySelector(".addopt").onclick=addOpt;
    card.querySelector(".optin").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();addOpt();}};
    card.querySelectorAll(".chip [data-del]").forEach(b=>b.onclick=()=>{d.options.splice(+b.dataset.del,1);save();isOpt?renderOpts():renderDims();syncMeter();});
    card.querySelectorAll(".shape").forEach(b=>b.onclick=()=>{d.shape=b.dataset.shape;
      if(SHAPES[d.shape].needK && !d.k) d.k=2; save();renderDims();syncMeter();});
    const dk=card.querySelector(".dk"); if(dk) dk.oninput=e=>{const v=parseInt(e.target.value,10);d.k=isNaN(v)?"":v;save();
      // light refresh of counts without losing focus:
      renderDims(); const f=$main.querySelector(`.dim[data-id="${id}"] .dk`); if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length);} syncMeter();};
  });
}

const MIN_TOKENS=["cost","price","latency","lat","error","err","loss","size","time","duration","ms","wait","far","frr","cycles","length","p95","p99","memory","ram","bytes","violation"];
const MAX_TOKENS=["throughput","tps","rps","accuracy","acc","f1","score","coverage","recall","precision","map","fps","relevance","bypass","crash","success","quality","reward","settled","kept","status_ok"];
function inferDir(k){k=(k||"").toLowerCase();if(MIN_TOKENS.some(x=>k.includes(x)))return"min";if(MAX_TOKENS.some(x=>k.includes(x)))return"max";return"max";}
function renderSuccess(){
  const goals = S.goals.length? S.goals.map((gl)=>`
    <div class="grow2" data-gid="${gl.id}">

        <button data-d="max" class="${gl.dir==='max'?'on':''}">▲ ${t('s3_max')}</button>
        <button data-d="min" class="${gl.dir==='min'?'on':''}">▼ ${t('s3_min')}</button></div>
      <button class="icon-x" data-delg aria-label="remove goal">🗑</button>
    </div>`).join("") : `<div class="empty" style="padding:18px">${t("s3_goals_empty")}</div>`;
  const verds = S.verdicts.map((v)=>`
    <div class="verdrow" data-vid="${v.code}">
      <input type="text" class="vc" value="${attr(v.code)}" aria-label="${t('s3_code')}" inputmode="numeric">
      <input type="text" class="vm" value="${attr(v.msg)}" placeholder="${attr(t('s3_msg_ph'))}" aria-label="message">
      <button class="icon-x" data-delv aria-label="remove verdict">🗑</button>

function sheetName(name,used,fallback){
  let s=(name||fallback||"DIM").toUpperCase().replace(/[^A-Z0-9_]+/g,"_").replace(/^_+|_+$/g,"");
  if(!s) s=fallback||"DIM";
  if(/^FW_/.test(s)) s="D_"+s;
  if(/^[0-9]/.test(s)) s="D_"+s;
  let b=s,i=2; while(used.has(s)){s=b+"_"+i;i++;} used.add(s); return s;
}
function tomlStr(v){
  v=String(v);
  if(/[\n"\\]/.test(v)) return '"'+v.replace(/\\/g,"\\\\").replace(/"/g,'\\"').replace(/\n/g,"\\n").replace(/\t/g,"\\t")+'"';
  return '"'+v+'"';
}
function tomlArr(vals){return "["+vals.map(tomlStr).join(", ")+"]";}
function buildSpec(){
  const used=new Set(); const lines=[];
  lines.push('spec_version = "1"');
  lines.push(`title = ${tomlStr(S.name||"my task")}`);
  if(S.note) lines.push(`note  = ${tomlStr(S.note)}`);
  const modearg = (S.name||"task").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"")||"task";
  lines.push(`args  = ["mode=${modearg}"]`);
  lines.push("");
  for(const g of S.goals){ if(!g.metric) continue;
    lines.push("[[goals]]"); lines.push(`key = ${tomlStr(g.metric)}`); lines.push(`dir = ${tomlStr(g.dir)}`); lines.push(""); }
  const emitSlot=(d,isOpt,fb)=>{
    const opts=(d.options||[]); if(opts.length<1) return;
    const sh=SHAPES[d.shape]||SHAPES.one;
    const sheet=sheetName(d.name,used,fb);
    lines.push("[[slots]]");
    lines.push(`sheet = ${tomlStr(sheet)}`);
    lines.push(`key   = ${tomlStr(sheet.toLowerCase())}`);
    if(isOpt){
      lines.push(`alias = "optional_action"`);
    } else if(sh.alias){
      const k=Math.max(1,Math.min(parseInt(d.k||2,10)||1, (d.shape==="orderK")?opts.length:opts.length));
      lines.push(`alias = ${tomlStr(sh.alias(k))}`);
    } else {
      const k=Math.max(1,parseInt(d.k||2,10)||1);
      lines.push(`verb  = ${tomlStr(sh.verb(k))}`);
    }
    lines.push(`values = ${tomlArr(opts)}`);
    lines.push("");
  };
  S.dims.forEach((d,i)=>emitSlot(d,false,"DIM"+(i+1)));
  S.opts.forEach((d,i)=>emitSlot(d,true,"OPT"+(i+1)));
  for(const v of S.verdicts){ if(!v.msg&&!v.code) continue;
    lines.push("[[custom_vars]]"); lines.push(`code = ${parseInt(v.code,10)||2}`); lines.push(`msg  = ${tomlStr(v.msg||"failed verdict")}`); lines.push(""); }
  return lines.join("\n").replace(/\n{3,}/g,"\n\n").trim()+"\n";
}

// Image probe: a file:// page can load a cross-origin <img> even when a cross-origin
// fetch() is blocked, so this reliably detects a live engine on 127.0.0.1.
function probeEngine(){
  return new Promise(res=>{
    const im=new Image(); let done=false;
    const fin=v=>{ if(!done){ done=true; res(v); } };
    im.onload=()=>fin(true); im.onerror=()=>fin(false);
    setTimeout(()=>fin(false),1500);
    im.src=ENGINE_URL+"/api/alive.gif?t="+Date.now();

}
function detectBackend(){
  return fetch("/api/ping",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{
    if(d&&d.ok&&d.backend==="real"){
      REAL=true; BACKEND=d;
      const canonical=(d.execution_policy_profiles||[]).map(x=>String((x&&x.profile)||"")).filter(Boolean);
      CH_PROFILE.splice(0,CH_PROFILE.length,"",...canonical);
      if(S.run.profile&&!canonical.includes(S.run.profile)) S.run.profile="";
      // Real/run-capable mode takes language/mode/transport values from the
      // same registry as preflight and the generated capability matrix. The
      // constants above are only an offline, non-runnable rendering fallback.
      const dims=d.capability_dimensions||{};
      const values=id=>((dims[id]&&dims[id].values)||[]).map(String);
      const langs=values("language").map(x=>x==="python"?"py":x);
      const analyzers=values("analyzer").filter(x=>x!=="none");
      if(langs.length) CH_LANG.splice(0,CH_LANG.length,...langs);

/* ---- deterministic synthesis (stable per spec) ---- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296;};}
function hashSpec(){let s=JSON.stringify([S.name,S.dims.map(d=>[d.name,d.shape,d.k,d.options]),S.opts.map(o=>[o.name,o.options]),S.goals,S.verdicts]);
  let h=2166136261>>>0; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);} return h>>>0;}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const _MRANGE={latency:[3,480],lat:[3,480],ms:[3,480],time:[2,300],duration:[2,300],cost:[0.001,0.6],price:[0.5,50],
  memory:[8,512],ram:[8,512],bytes:[64,1e6],params:[80,60000],size:[10,900],cycles:[100,9000],loss:[0.01,2],error:[0,0.4],
  throughput:[80,6000],tps:[80,6000],rps:[80,6000],accuracy:[0.5,0.99],acc:[0.5,0.99],f1:[0.4,0.98],score:[10,100],
  recall:[0.4,0.99],precision:[0.4,0.99],coverage:[0.3,1],fps:[5,240],reward:[0,100],quality:[0.3,1],violations:[0,6],
  settled:[0,1],kept:[0,1],charges:[0,3],rows_kept:[0,1000],status_ok:[0,1],bypass:[0,1]};
function metricRange(k){k=(k||"").toLowerCase();for(const t in _MRANGE)if(k.includes(t))return _MRANGE[t];return[1,100];}
function synthMetric(k,r){const[a,b]=metricRange(k);const v=a+(b-a)*r();return b<=1.5?Math.round(v*1000)/1000:(b<=100?Math.round(v*100)/100:Math.round(v));}
function dominates(b,a,goals){let ge=true,gt=false;for(const g of goals){const av=+a.m[g.metric],bv=+b.m[g.metric];
  const better=g.dir==="min"?bv<=av:bv>=av,strict=g.dir==="min"?bv<av:bv>av; if(!better){ge=false;break;} if(strict)gt=true;} return ge&&gt;}
function paretoFront(items,goals){return items.filter(a=>!items.some(b=>b!==a&&dominates(b,a,goals)));}
function shapeVerb(d){const sh=SHAPES[d.shape]||SHAPES.one;const k=Math.max(1,parseInt(d.k||2,10)||1);return sh.alias?sh.alias(k):sh.verb(k);}

function buildRunPlan(sieve){
  const p=plan(), mand=p.mandatory, optM=p.optMult, seed=hashSpec(), r=mulberry32(seed);
  let pruned=0n, post=mand;
  if(sieve && mand>1n){ let pct=BigInt(15+Math.floor(r()*21)); pruned=(mand*pct)/100n; if(pruned>=mand)pruned=mand-1n; post=mand-pruned; }
  const final=post*optM;
  const goals=S.goals.filter(g=>g.metric), hasV=S.verdicts.length>0;
  const passPct=hasV?(45+Math.floor(r()*36)):100;
  const pass=(final*BigInt(passPct))/100n, fail=final-pass;
  const dims=S.dims.filter(d=>d.options.length>=1);
  const nFinalNum=final<=100000n?Number(final):100000, nShow=Math.min(nFinalNum,240), optN=optM>1n?Number(optM):1;
  const cands=[];
  for(let i=0;i<nShow;i++){
    const rr=mulberry32((seed+i*2654435761)>>>0);
    const picks=dims.map(d=>{const o=d.options;if(!o.length)return{n:d.name,v:"—"};
      if(d.shape==="order")return{n:d.name,v:shuffle(o.slice(),rr).join("›")};
      if(d.shape==="orderK")return{n:d.name,v:shuffle(o.slice(),rr).slice(0,Math.max(1,+d.k||2)).join("›")};
      if(d.shape==="subset"){const s=o.filter(()=>rr()<0.5);return{n:d.name,v:"{"+(s.join(",")||"∅")+"}"};}
      if(d.shape==="k"||d.shape==="kR"){return{n:d.name,v:shuffle(o.slice(),rr).slice(0,Math.max(1,+d.k||2)).join("+")};}
      return{n:d.name,v:o[Math.floor(rr()*o.length)]};});
    const outcome=(i<Math.round(nShow*passPct/100))?"PASS":"FAIL";
    const m={}; goals.forEach(g=>m[g.metric]=synthMetric(g.metric,rr));
    const code=(outcome==="FAIL"&&S.verdicts.length)?(+S.verdicts[i%S.verdicts.length].code||2):0;
    cands.push({id:`${Math.floor(i/optN)+1}_${i%optN}_${i%4}`,picks,outcome,m,code});
  }
  const passCands=cands.filter(c=>c.outcome==="PASS");
  const front=goals.length?paretoFront(passCands,goals):[];
  const fset=new Set(front); cands.forEach(c=>c.front=fset.has(c));
  const winners=goals.map(g=>{let best=null;for(const c of passCands){if(!best||(g.dir==="min"?+c.m[g.metric]<+best.m[g.metric]:+c.m[g.metric]>+best.m[g.metric]))best=c;}return{g,best};});
  return {mand,pruned,post,optM,final,pass,fail,passPct,sieve,goals,cands,front,winners,seed};
}

function fmtLog(txt,cls){return cls?`<span class="${cls}">${esc(txt)}</span>`:esc(txt);}
function pushN(t2,c){RUN.logN.push(fmtLog(t2,c));RUN.logD.push(fmtLog(t2,c));}

function seedLogHeader(R){ const c=cliCmds();

  pushD(`# spec sha(illustrative)=${("0000000"+R.seed.toString(16)).slice(-8)}  slots=${S.dims.length+S.opts.length}  goals=${R.goals.length}  verdicts=${S.verdicts.length}`);
}
function logStageStart(st){const i=RUN.stages.indexOf(st)+1,n=RUN.stages.length; pushN(`[${i}/${n}] ${stripTags(st.name)} …`);}
function logStageEnd(st){const i=RUN.stages.indexOf(st)+1,n=RUN.stages.length;
  pushN(`[${i}/${n}] ${stripTags(st.name)} — ${st.sum()}`,"lok");
  if(st.id==="gen"){ S.dims.forEach(d=>pushD(`  sheet ${sheetName(d.name,new Set(),"D")} verb=${shapeVerb(d)} n=${d.options.length}`));
                     S.opts.forEach(d=>pushD(`  sheet ${sheetName(d.name,new Set(),"OPT")} verb=optional_action n=${d.options.length}`)); }
  if(st.id==="core") pushD(`  INSERT fw_final … ${fmt(RUN.mand)} rows materialized`,"lc");
  if(st.id==="sieve") pushD(`  sieve: removed ${fmt(RUN.pruned)} rows (illustrative), ${fmt(RUN.post)} kept`,"lwarn");
  if(st.id==="reader") pushD(`  Reader: emitted ${fmt(RUN.final)} candidate artifacts (handoff v2)`,"lc");
  if(st.id==="exec"){ const mode=slug(S.name), sample=RUN.cands.slice(0,40);
    sample.forEach(c=>{const kv=c.picks.map(p=>`${slug(p.n)}=${p.v}`).join(" "),mm=RUN.goals.map(g=>`${g.metric}=${c.m[g.metric]}`).join(" ");
      pushD(`  app=${mode} ${kv} ${mm} FW_VAR=${c.code}`.replace(/\s+/g," "),c.outcome==="FAIL"?"lerr":null);});
    if(RUN.cands.length>40)pushD(`  … (${fmt(RUN.final)} candidates total; first 40 shown)`,"lc");
    pushD(`  invariant processed_eq_sum: ${fmt(RUN.final)} == ${fmt(RUN.pass)} PASS + ${fmt(RUN.fail)} DOMAIN_FAIL ✓`,"lok"); }
  if(st.id==="analyzer") pushD(`  Analyzer: Pareto front ${RUN.front.length} over ${RUN.goals.map(g=>g.metric+":"+g.dir).join(", ")}`,"lc");
  refreshLog();
}

function renderPareto(R){

    const sorted=pts.slice().sort((a,b)=>gg.dir==="min"?a.m[gg.metric]-b.m[gg.metric]:b.m[gg.metric]-a.m[gg.metric]).slice(0,10);

        <span class="mono" style="width:130px;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc((c.picks[0]&&c.picks[0].v)||c.id)}</span>
        <span style="flex:1;background:var(--paper);border-radius:5px;overflow:hidden;border:1px solid var(--line)"><i style="display:block;height:12px;width:${w}%;background:linear-gradient(90deg,var(--brand),var(--brand-2))"></i></span>
        <span class="mono" style="width:66px;text-align:right">${c.m[gg.metric]}</span></div>`;}).join("")+`</div>`;
  }
  const gx=g[0],gy=g[1],xs=pts.map(c=>+c.m[gx.metric]),ys=pts.map(c=>+c.m[gy.metric]);
  const xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys),W=560,H=300,pad=46;
  const sx=v=>pad+(xmax===xmin?0.5:(v-xmin)/(xmax-xmin))*(W-2*pad), sy=v=>H-pad-(ymax===ymin?0.5:(v-ymin)/(ymax-ymin))*(H-2*pad);
  const dots=pts.map(c=>{const on=c.front;return `<circle cx="${sx(+c.m[gx.metric]).toFixed(1)}" cy="${sy(+c.m[gy.metric]).toFixed(1)}" r="${on?5:3.2}" fill="${on?CB:CF}" ${on?'stroke="#fff" stroke-width="1.4"':'opacity="0.7"'}><title>${esc(c.id)}: ${esc(gx.metric)}=${c.m[gx.metric]}, ${esc(gy.metric)}=${c.m[gy.metric]}</title></circle>`;}).join("");
  const fr=R.front.slice().sort((a,b)=>+a.m[gx.metric]-+b.m[gx.metric]);
  const poly=fr.map(c=>`${sx(+c.m[gx.metric]).toFixed(1)},${sy(+c.m[gy.metric]).toFixed(1)}`).join(" ");
  return `<div class="paretobox"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-height:320px" role="img" aria-label="Pareto scatter of ${esc(gx.metric)} vs ${esc(gy.metric)}">

    <text x="${W/2}" y="${H-10}" text-anchor="middle" font-size="12" fill="${CM}">${esc(gx.metric)} (${gx.dir==='min'?t("f3_min"):t("f3_max")})</text>
    <text x="16" y="${H/2}" text-anchor="middle" font-size="12" fill="${CM}" transform="rotate(-90 16 ${H/2})">${esc(gy.metric)} (${gy.dir==='min'?t("f3_min"):t("f3_max")})</text>
    ${fr.length>1?`<polyline points="${poly}" fill="none" stroke="${CB}" stroke-width="2" stroke-dasharray="4 3" opacity=".7"/>`:""}${dots}</svg></div>`;
}

/* ============================================================================
   REAL run path — fires bundle_run.py via serve_face1.py and traces the real
   run-directory journal (state.json + stages/*.json) + streams real stdout.
   ============================================================================ */
function nlog(txt,cls){ if(RUN) RUN.logN.push(fmtLog(txt,cls)); }
function logClass(l){ const s=(l||"").toLowerCase();
  if(/\berror\b|traceback|✗|fatal|exception|failed/.test(s)) return "lerr";
  if(/\bwarn/.test(s)) return "lwarn";
  if(/✓|\bok\b|succeeded|\bdone\b|\bpass\b/.test(s)) return "lok";
  if(l && (l[0]==="$" || l.startsWith("[serve]"))) return "lc";
  return null; }
function realStageList(sieve){
  const defs=[["gen",t("st_gen")],["core",t("st_core")]];
  if(sieve) defs.push(["sieve",t("st_sieve")]);
  defs.push(["reader",t("st_reader")],["executor",t("st_exec")]);
  if(hasGoals()) defs.push(["analyzer",t("st_analyzer")]);
  return defs.map(([id,name])=>({id,name,status:"queued",pct:0,summary:"",_srv:null}));
}
function startRunReal(sieve){
  const toml=buildSpec(), c=cliCmds();
  const goalsStr=S.goals.filter(g=>g.metric).map(g=>`${g.metric}:${g.dir}`).join(",");
  // Send the WHOLE control-panel state as config (camelCase keys match the server
  // registry) + the derived analyzer/mode/db/backend. Nothing is dropped.
  const config=Object.assign({}, S.run, {
    backend:(REAL?(S.run.backend||"local"):"local"),
    db:slug(S.run.db||c.dir), runId:S.run.runId||"r1",
    analyzer:goalsStr, mode:effMode()||"", sieve:!!sieve});
  RUN={real:true, sieve:!!sieve, status:"running", logN:[], logD:[], stages:realStageList(sieve),
       cursor:0, goals:S.goals.filter(g=>g.metric), token:undefined, serverResults:null, exit:null};
  openProgress();
  nlog(`$ ${c.run.replace(/\\\n  /g,' ')}`,"lc"); refreshLog();
  fetch("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({toml,config})})
    .then(r=>r.json()).then(d=>{
      if(!RUN||RUN.status==="stopped")return;
      if(!d||d.error){ RUN.status="error"; nlog("[run] "+((d&&d.error)||"error"),"lerr"); refreshLog(); paintProgress(); return; }
      RUN.token=d.token; RUN.runId=d.run_id; nlog(`[run] started run_id=${d.run_id} db=${d.db}`,"lc"); refreshLog(); pollReal();
    }).catch(e=>{ if(RUN){ RUN.status="error"; nlog("[run] "+e,"lerr"); refreshLog(); paintProgress(); } });
}
function pollReal(){
  if(!RUN||RUN.token===undefined||RUN.status==="stopped")return;
  fetch(`/api/poll?token=${encodeURIComponent(RUN.token)}&log=${RUN.cursor}`,{cache:"no-store"})
    .then(r=>r.json()).then(d=>{
      if(!RUN||RUN.status==="stopped")return;
      if(d.error){ RUN.status="error"; nlog("[poll] "+d.error,"lerr"); refreshLog(); paintProgress(); return; }
      (d.log||[]).forEach(l=>RUN.logD.push(fmtLog(l,logClass(l))));
      if(typeof d.log_cursor==="number") RUN.cursor=d.log_cursor;
      applyServerStages(d.stages||{}); refreshLog();
      if(d.done){ RUN.exit=d.exit; RUN.serverResults=d.results||null;
        RUN.status=(d.ok && d.run_status==="SUCCEEDED")?"done":"failed"; paintProgress(); return; }
      paintProgress(); RUN.ptimer=setTimeout(pollReal,700);
    }).catch(e=>{ if(RUN){ RUN.status="error"; nlog("[poll] "+e,"lerr"); refreshLog(); paintProgress(); } });
}
function applyServerStages(srv){
  RUN.stages.forEach(st=>{
    const s=srv[st.id]; if(!s)return; const cnt=s.counts||{};
    if(st.id==="gen") st.summary="workbook built";
    else if(st.id==="core") st.summary=`fw_final ${cnt.fw_final??"…"} rows`;
    else if(st.id==="sieve") st.summary=`post-sieve ${cnt.post_sieve??"…"} rows`;
    else if(st.id==="reader") st.summary=`${cnt.candidates??"…"} candidates`;
    else if(st.id==="executor") st.summary=`${cnt.pass??"…"} PASS / ${cnt.fail??"…"} DOMAIN_FAIL`;
    else if(st.id==="analyzer") st.summary=`metrics ${cnt.metrics_lines??"…"}`;
    const ss=s.status;
    if(st._srv!==ss){ st._srv=ss;
      if(ss==="RUNNING") nlog(`[${st.id}] running…`);
      else if(ss==="SUCCEEDED") nlog(`[${st.id}] ✓ ${st.summary}`,"lok");
      else if(ss==="FAILED"||ss==="INTERRUPTED"){ nlog(`[${st.id}] ✗ FAILED`,"lerr"); (cnt._errors||[]).forEach(e=>nlog("   "+e,"lerr"));
        // executor BROKEN on a Face-1 spec == structural spec with no oracle to run
        if(st.id==="executor" && /broken/i.test((cnt._errors||[]).join(" "))) RUN.structural=true; } }
    st.status = ss==="SUCCEEDED"?"done":ss==="RUNNING"?"run":(ss==="FAILED"||ss==="INTERRUPTED")?"failed":"queued";
    st.pct = st.status==="done"?100:st.status==="run"?55:st.status==="failed"?100:0;
  });
}
function openResultsReal(){
  const R=RUN.serverResults||{}, goals=R.goals||[], out=R.outcomes||{}, c=R.counts||{};
  const pass=+(R.pass!=null?R.pass:(out.PASS||0)), fail=+(R.fail!=null?R.fail:(out.DOMAIN_FAIL||0));
  const processed=+(R.processed!=null?R.processed:(pass+fail));
  const passW=processed?Math.round(pass/processed*100):0, failW=100-passW;
  const front=R.front||[], points=R.points||[];
  const otherOutcomes=Object.keys(out).filter(k=>k!=="PASS"&&k!=="DOMAIN_FAIL"&&+out[k]>0).map(k=>`${out[k]} ${k}`).join(" · ");
  const provTxt=(c.mandatory!=null&&c.post_sieve!=null&&c.post_sieve!==c.mandatory)
    ? `The sieve pruned <b>${c.mandatory-c.post_sieve}</b> of ${c.mandatory} combinations (${c.post_sieve} kept); Reader emitted ${c.candidates!=null?c.candidates:processed} candidates.`
    : `Core materialized <b>${c.mandatory!=null?c.mandatory:"?"}</b> combinations; Reader emitted ${c.candidates!=null?c.candidates:processed} candidates.`;
  const winners=goals.map(g=>{let best=null;for(const f of front){const v=f.objectives?f.objectives[g.metric]:undefined;if(v==null)continue;
    if(!best||(g.dir==="min"?v<best.v:v>best.v))best={v,f};}return {g,best};});
  const cols=goals.slice(0,3);
  const rows=front.slice(0,120).map(f=>`<tr><td class="mono">${esc(f.id||"")}</td><td class="mono">${esc(f.source_ref||"")}</td>
    ${cols.map(g=>`<td class="mono">${f.objectives&&f.objectives[g.metric]!=null?f.objectives[g.metric]:"—"}</td>`).join("")}
    <td><span class="tag ${(f.outcome||'').toLowerCase()==='pass'?'PASS':'FAIL'}">${(f.outcome||'—').toUpperCase()}</span></td></tr>`).join("");
  const noOracle = processed>0 && pass===0 && !goals.length;
  const h=modal(`<div class="win-head"><h2>📊 ${t("f3_title")} <span style="font-size:12px;color:var(--muted);font-weight:500">· ${t("f3_kick")}</span> <span class="tag PASS">★ ${t("f3_real_badge")}</span></h2><button class="x" id="r_x">×</button></div>
    <div class="win-body">
      <div class="previewbar" style="color:var(--exact);background:var(--exact-soft);border-color:var(--exact)">${t("f3_preview_real")}</div>
      <div class="hero"><div><div class="big">${pass}</div><div class="metersub">${t("f3_passed")} · ${t("f3_of")} ${processed} ${t("f3_cands")}</div></div>
        <div class="obar"><span class="pass" style="flex:${passW||0}">${passW}% ✓</span>${failW>0?`<span class="fail" style="flex:${failW}">${failW>7?failW+"% ✕":""}</span>`:""}</div></div>
      ${otherOutcomes?`<div class="hint" style="margin-top:6px">outcomes: ${esc(otherOutcomes)}</div>`:""}
      ${noOracle?`<div class="wall" style="border-left-color:var(--gold)">This spec is structural — its candidates aren't runnable programs, so the real pipeline ran them but there's no oracle/metrics. Wire a HEAD/TAIL frame (see intake/README.md) or fire a runnable spec to get PASS + goals.</div>`:""}
      ${goals.length?`<div class="sec-h">${t("f3_winners")}</div><div class="winners">${winners.map(w=>w.best?`<div class="wcard"><div class="g">${w.g.dir==='min'?'▼':'▲'} ${esc(w.g.metric)}</div><div class="v">${w.best.v}</div><div class="c">${esc(w.best.f.id||"")}</div></div>`:"").join("")}</div>`:""}
      <div class="sec-h">${goals.length?t("f3_pareto"):t("f3_pareto_none")}</div>${renderParetoReal(goals,points,front)}
      <div class="sec-h">${t("f3_prov")}</div><div class="summary-line" style="font-size:14px">${provTxt}</div>
      ${front.length?`<div class="sec-h">${t("f3_front_of").replace("{n}",front.length).replace("{p}",processed)}</div>
      <div style="max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:12px">
        <table class="cands"><thead><tr><th>${t("f3_col_id")}</th><th>source</th>${cols.map(g=>`<th>${esc(g.metric)}</th>`).join("")}<th>${t("f3_col_out")}</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`:""}
    </div>
    <div class="win-foot"><button class="btn sm spread" id="r_log">🧾 ${t("pw_showdetail")}</button>
      <button class="btn" id="r_again">✎ ${t("f3_again")}</button>
      <button class="btn primary" id="r_close">${t("f3_close")}</button></div>`,{cls:"wide"});
  h.el.querySelector("#r_x").onclick=()=>h.close();
  h.el.querySelector("#r_close").onclick=()=>h.close();
  h.el.querySelector("#r_again").onclick=()=>{h.close();go(4);};
  h.el.querySelector("#r_log").onclick=()=>openLog(true);
}
function renderParetoReal(goals,points,front){
  if(!goals.length)return "";
  const cs=getComputedStyle(document.documentElement);
  const CB=cs.getPropertyValue('--brand').trim()||'#6c4cf1',CF=cs.getPropertyValue('--faint').trim()||'#888',
        CL=cs.getPropertyValue('--line').trim()||'#ddd',CM=cs.getPropertyValue('--muted').trim()||'#666';
  const fobj=front.map(f=>f.objectives||{}), allp=(points&&points.length?points.map(p=>p.objectives||{}):fobj);
  if(goals.length===1){ const g=goals[0];
    const arr=fobj.filter(o=>o[g.metric]!=null).sort((a,b)=>g.dir==="min"?a[g.metric]-b[g.metric]:b[g.metric]-a[g.metric]).slice(0,10);
    if(!arr.length)return `<div class="paretobox">—</div>`;
    const max=Math.max(...arr.map(o=>+o[g.metric]))||1;
    return `<div class="paretobox"><div class="metersub" style="margin-bottom:8px">${t("f3_pareto_one").replace("{g}",esc(g.metric)).replace("{d}",g.dir==="min"?t("f3_min"):t("f3_max"))}</div>`+
      arr.map(o=>{const w=Math.max(4,Math.round(+o[g.metric]/max*100));return `<div style="display:flex;gap:8px;align-items:center;margin:3px 0"><span style="flex:1;background:var(--paper);border:1px solid var(--line);border-radius:5px;overflow:hidden"><i style="display:block;height:12px;width:${w}%;background:linear-gradient(90deg,var(--brand),var(--brand-2))"></i></span><span class="mono" style="width:82px;text-align:right">${o[g.metric]}</span></div>`;}).join("")+`</div>`;
  }
  const gx=goals[0],gy=goals[1];
  const base=allp.filter(o=>o[gx.metric]!=null&&o[gy.metric]!=null);
  const fp=fobj.filter(o=>o[gx.metric]!=null&&o[gy.metric]!=null);
  if(!base.length&&!fp.length)return `<div class="paretobox">—</div>`;
  const U=base.concat(fp), xs=U.map(o=>+o[gx.metric]),ys=U.map(o=>+o[gy.metric]);
  const xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys),W=560,H=300,pad=46;
  const sx=v=>pad+(xmax===xmin?0.5:(v-xmin)/(xmax-xmin))*(W-2*pad),sy=v=>H-pad-(ymax===ymin?0.5:(v-ymin)/(ymax-ymin))*(H-2*pad);
  const gray=base.map(o=>`<circle cx="${sx(+o[gx.metric]).toFixed(1)}" cy="${sy(+o[gy.metric]).toFixed(1)}" r="3.2" fill="${CF}" opacity="0.7"/>`).join("");
  const hot=fp.map(o=>`<circle cx="${sx(+o[gx.metric]).toFixed(1)}" cy="${sy(+o[gy.metric]).toFixed(1)}" r="5" fill="${CB}" stroke="#fff" stroke-width="1.4"/>`).join("");
  const frs=fp.slice().sort((a,b)=>+a[gx.metric]-+b[gx.metric]).map(o=>`${sx(+o[gx.metric]).toFixed(1)},${sy(+o[gy.metric]).toFixed(1)}`).join(" ");
  return `<div class="paretobox"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-height:320px" role="img" aria-label="Pareto ${esc(gx.metric)} vs ${esc(gy.metric)}">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="${CL}"/><line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="${CL}"/>
    <text x="${W/2}" y="${H-10}" text-anchor="middle" font-size="12" fill="${CM}">${esc(gx.metric)} (${gx.dir==='min'?t("f3_min"):t("f3_max")})</text>
    <text x="16" y="${H/2}" text-anchor="middle" font-size="12" fill="${CM}" transform="rotate(-90 16 ${H/2})">${esc(gy.metric)} (${gy.dir==='min'?t("f3_min"):t("f3_max")})</text>
    ${fp.length>1?`<polyline points="${frs}" fill="none" stroke="${CB}" stroke-width="2" stroke-dasharray="4 3" opacity=".7"/>`:""}${gray}${hot}</svg></div>`;
}

/* ---- keyboard: Alt+Arrow to move steps ---- */
document.addEventListener("keydown",e=>{
  if(e.altKey&&e.key==="ArrowRight"){go(S.step+1);e.preventDefault();}
  if(e.altKey&&e.key==="ArrowLeft"){go(S.step-1);e.preventDefault();}
});

renderAll();
detectBackend();
</script>
