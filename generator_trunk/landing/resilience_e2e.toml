# ============================================================================
# RESILIENCE stress-test — combinatorial concurrency fuzzer.
# A program with an artificial delay WINDOW + a parallel INTERFERER thread that,
# during the window, tries to break it. The combinatorics places the interference
# "in different spots" (FW_Permut moves the window/capture) and toggles it on/off
# (FW_Subsets). The program's defense (a defensive COPY of CONFIG) is DELIBERATELY
# INCOMPLETE — it shields CONFIG-poisoning only, not interruption or a hijack flag —
# so the run reveals exactly which (interference-kind × timing) defeats it.
#
# Rules: KIND FW_Combi(1)[8] × INTERFERE FW_Subsets[present/absent] × REGIONS FW_Permut[5!=120]
#        → 8·2·120 = 1920 programs.  Verdict: 0 robust · 7 crashed · 9 silently-wrong.
# Interferences (the adversary's repertoire, by KIND):
#   0 benign · 1 CONFIG=0 (→crash) · 2 CONFIG=84 · 3 CONFIG=-7 · 4 CONFIG=MIN (→silent wrong)
#   5 interrupt main (→crash) · 6 set HIJACK flag (→silent) · 7 CONFIG=0 + HIJACK (→crash/silent)
# raw=true; Reader concatenator=''. NAP=30ms gives the interferer a deterministic window.
# ============================================================================
title = "resilience stress-test (8 interferences × 120 timings × present/absent = 1920)"
note  = "Artificial-delay window + parallel interferer; FW_Permut puts the interference in different places; defensive copy is intentionally partial."
goals = ["vulnerabilities_found"]
args  = ["mode=resilience"]

[[slots]]   # invariant frame: shared state + the interferer thread + main opener
sheet  = "HEAD"
key    = "head"
verb   = "FW_Combi(1)"
raw    = true
values = ['''public class Candidate {
    public static int FW_VAR = 0;
    static volatile int CONFIG = 7;
    static volatile boolean WINDOW_OPEN = false;
    static volatile boolean HIJACK = false;
    static int captured = 7;
    static int score = 0;
    static Thread MAIN;
    static void noise1(){ score += 1; }
    static void noise2(){ score += 3; }
    static void noise3(){ score += 5; }
    static void launchInterferer(int kind){
        Thread t = new Thread(() -> {
            long spins = 0;
            while (!WINDOW_OPEN && spins++ < 2000000000L) Thread.onSpinWait();
            switch (kind) {
                case 1: CONFIG = 0; break;                  // poison -> division by zero (crash)
                case 2: CONFIG = 84; break;                 // poison -> 84/84=1 (silent wrong)
                case 3: CONFIG = -7; break;                 // poison -> -12 (silent wrong)
                case 4: CONFIG = Integer.MIN_VALUE; break;  // poison -> overflow (silent wrong)
                case 5: MAIN.interrupt(); break;            // INTERRUPT the main thread (crash)
                case 6: HIJACK = true; break;               // flip a control flag (silent wrong)
                case 7: CONFIG = 0; HIJACK = true; break;   // combined attack
                default: break;                             // 0 = benign adversary (control)
            }
        });
        t.setDaemon(true);
        t.start();
    }
    public static void main(String[] args){
        MAIN = Thread.currentThread();
        try {
''']

[[slots]]   # interference KIND (config; cartesian leaf)
sheet  = "KIND"
key    = "kind"
verb   = "FW_Combi(1)"
raw    = true
values = ["            int KIND = 0;\n", "            int KIND = 1;\n", "            int KIND = 2;\n",
          "            int KIND = 3;\n", "            int KIND = 4;\n", "            int KIND = 5;\n",
          "            int KIND = 6;\n", "            int KIND = 7;\n"]

[[slots]]   # launch the interferer — PRESENT or ABSENT (FW_Subsets of 1 element)
sheet  = "INTERFERE"
key    = "intf"
verb   = "FW_Subsets"
raw    = true
values = ["            launchInterferer(KIND);\n"]

[[slots]]   # the code regions — FW_Permut puts the WINDOW & the defensive CAPTURE in every order
sheet  = "REGIONS"
key    = "reg"
verb   = "FW_Permut"
raw    = true
values = ["            WINDOW_OPEN = true; Thread.sleep(30);\n",   # the artificial delay window
          "            captured = CONFIG;\n",                       # defensive copy (its timing is the crux)
          "            noise1();\n",
          "            noise2();\n",
          "            noise3();\n"]

[[slots]]   # invariant frame: compute from the captured copy, apply hijack, verdict, close
sheet  = "TAIL"
key    = "tail"
verb   = "FW_Combi(1)"
raw    = true
values = ['''            int result = 84 / captured;
            if (HIJACK) result = -1;
            FW_VAR = (result == 12) ? 0 : 2;
        } catch (Throwable ex) {
            FW_VAR = 1;
        }
    }
}
''']

# Verdict codes are kept SMALL on purpose: the Executor encodes a non-zero FW_VAR
# POSITIONALLY across the per-sheet combos columns (here 5), so the code must be ≤ that
# count or the INSERT overflows the row. 0 = robust · 1 = crashed · 2 = silently wrong.
[[custom_vars]]
code = 1
msg  = "crashed under interference (ArithmeticException / InterruptedException)"
[[custom_vars]]
code = 2
msg  = "silently wrong under interference (defensive copy did not cover it)"
