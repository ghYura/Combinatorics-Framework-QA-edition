spec_version = "1"
title = "Automation Studio full-battery Cartesian parameter refinement"
note = "FW_Cartes crosses tuning mutations with plant/profile baselines; bounded stage subsets and topology axes verify finalists under four excitations."
args = ["sut=automation_scheme_studio", "tier=verify", "verb=FW_Cartes"]

[[goals]]
key = "control_score"
dir = "max"
[[goals]]
key = "robustness_score"
dir = "max"
[[goals]]
key = "stability_score"
dir = "max"
[[goals]]
key = "settling_time_s"
dir = "min"
[[goals]]
key = "worst_error"
dir = "min"
[[goals]]
key = "overshoot_pct"
dir = "min"
[[goals]]
key = "control_effort"
dir = "min"

[[slots]]
sheet = "HEAD"
key = "head"
verb = "FW_Combi(1)"
raw = true
values = [
'''from generator_trunk.scenarios.automation_scheme_studio.bootstrap import initialize_candidate
PLAN, INITIAL_COMPONENT_PARAMETERS, MEASUREMENT_TERMINALS = initialize_candidate(
    family="05_cartesian_refinement", battery="full", duration=3.0, dt=0.04
)
'''
]

[[slots]]
sheet = "TUNING_MUTATION"
key = "tuning_mutation"
verb = "FW_Cartes(PLANT_PROFILE)"
raw = true
values = [
'''PLAN.tuning.update(kp=1.8, ki=0.55, kd=0.08)
''',
'''PLAN.tuning.update(kp=3.2, ki=1.25, kd=0.32)
''',
'''PLAN.tuning.update(filter_tau=0.08, limit=6.0, stage_gain=0.9)
''',
'''PLAN.tuning.update(filter_tau=0.2, limit=10.0, stage_gain=1.2)
'''
]

[[slots]]
sheet = "PLANT_PROFILE"
key = "plant_profile"
verb = "FW_Combi(1)"
raw = true
flags = ["FW_Exclude"]
values = [
'''PLAN.plant = "first_order"
PLAN.apply_profile("conservative")
''',
'''PLAN.plant = "first_order"
PLAN.apply_profile("balanced")
''',
'''PLAN.plant = "second_order"
PLAN.apply_profile("balanced")
''',
'''PLAN.plant = "second_order"
PLAN.apply_profile("aggressive")
'''
]

[[slots]]
sheet = "ARCH"
key = "architecture"
verb = "FW_Combi(1)"
raw = true
values = [
'''PLAN.architecture = "serial"
''',
'''PLAN.architecture = "parallel_sum"
PLAN.branches = ["p", "pid"]
PLAN.add_loop("pi_filter")
''',
'''PLAN.architecture = "cascade_velocity"
PLAN.branches = ["pi", "pid"]
PLAN.add_loop("pid_delay")
'''
]

[[slots]]
sheet = "CONTROLLER"
key = "controller"
verb = "FW_Combi(1)"
raw = true
values = [
'''PLAN.controller = "p"
''',
'''PLAN.controller = "pi"
''',
'''PLAN.controller = "pid"
''',
'''PLAN.controller = "relay"
'''
]

[[slots]]
sheet = "STAGE_SET"
key = "stage_set"
verb = "FW_Subsets_RANGE(1,2)"
raw = true
values = [
'''PLAN.add_stage("gain")
''',
'''PLAN.add_stage("low_pass")
''',
'''PLAN.add_stage("limiter")
''',
'''PLAN.add_stage("unit_delay")
'''
]

[[slots]]
sheet = "OPTIONS"
key = "options"
verb = "FW_Combi(1)"
raw = true
values = [
'''pass
''',
'''PLAN.enable("prefilter")
''',
'''PLAN.enable("sensor_filter")
PLAN.enable("actuator_limit")
''',
'''PLAN.enable("prefilter")
PLAN.enable("sensor_filter")
PLAN.enable("actuator_limit")
PLAN.enable("transport_delay")
'''
]

[[slots]]
sheet = "TAIL"
key = "tail"
verb = "FW_Combi(1)"
raw = true
values = [
'''from generator_trunk.scenarios.automation_scheme_studio.bootstrap import finish_candidate
_RESULT = finish_candidate(PLAN, MEASUREMENT_TERMINALS)
FW_VAR = _RESULT.code
FW_CUSTOM_VAR = FW_VAR
print(_RESULT.metrics_line(
    initial_parameters=INITIAL_COMPONENT_PARAMETERS,
    include_terminals=True,
    include_parameters=True,
))
'''
]


[[custom_vars]]
code = 2
msg = "circuit validation/build/compile failure"
[[custom_vars]]
code = 3
msg = "simulation runtime or non-finite signal failure"
[[custom_vars]]
code = 4
msg = "unstable excitation response or internal tester terminal"
[[custom_vars]]
code = 5
msg = "tracking/convergence acceptance limit exceeded"
