spec_version = "1"
title = "Automation Studio smoke — real circuits, terminals, nested-loop optionality"
note = "48 full-battery candidates validate the SUT adapter and Oracle before exhaustive runs."
args = ["sut=automation_scheme_studio", "tier=smoke"]

[[goals]]
key = "control_score"
dir = "max"
[[goals]]
key = "robustness_score"
dir = "max"
[[goals]]
key = "stability_score"
dir = "max"
[[goals]]
key = "settling_time_s"
dir = "min"
[[goals]]
key = "worst_error"
dir = "min"
[[goals]]
key = "overshoot_pct"
dir = "min"
[[goals]]
key = "control_effort"
dir = "min"

[[slots]]
sheet = "HEAD"
key = "head"
verb = "FW_Combi(1)"
raw = true
values = [
'''from generator_trunk.scenarios.automation_scheme_studio.bootstrap import initialize_candidate
PLAN, INITIAL_COMPONENT_PARAMETERS, MEASUREMENT_TERMINALS = initialize_candidate(
    family="00_smoke", battery="full", duration=1.2, dt=0.06
)
'''
]

[[slots]]
sheet = "ARCH"
key = "architecture"
verb = "FW_Combi(1)"
raw = true
values = [
'''PLAN.architecture = "serial"
''',
'''PLAN.architecture = "cascade_velocity"
PLAN.branches = ["pi", "pid"]
'''
]

[[slots]]
sheet = "CONTROLLER"
key = "controller"
verb = "FW_Combi(1)"
raw = true
values = [
'''PLAN.controller = "p"
''',
'''PLAN.controller = "pid"
'''
]

[[slots]]
sheet = "INNER_LOOP"
key = "inner_loop"
verb = "FW_Combi(1)"
raw = true
flags = ["FW_Optional"]
values = [
'''PLAN.add_loop("p_delay")
'''
]

[[slots]]
sheet = "STAGE"
key = "stage"
verb = "FW_Combi(1)"
raw = true
values = [
'''PLAN.add_stage("gain")
''',
'''PLAN.add_stage("low_pass")
''',
'''PLAN.add_stage("limiter")
'''
]

[[slots]]
sheet = "PROFILE"
key = "profile"
verb = "FW_Combi(1)"
raw = true
values = [
'''PLAN.apply_profile("conservative")
''',
'''PLAN.apply_profile("balanced")
'''
]

[[slots]]
sheet = "TAIL"
key = "tail"
verb = "FW_Combi(1)"
raw = true
values = [
'''from generator_trunk.scenarios.automation_scheme_studio.bootstrap import finish_candidate
_RESULT = finish_candidate(PLAN, MEASUREMENT_TERMINALS)
FW_VAR = _RESULT.code
FW_CUSTOM_VAR = FW_VAR
print(_RESULT.metrics_line(
    initial_parameters=INITIAL_COMPONENT_PARAMETERS,
    include_terminals=True,
    include_parameters=True,
))
'''
]


[[custom_vars]]
code = 2
msg = "circuit validation/build/compile failure"
[[custom_vars]]
code = 3
msg = "simulation runtime or non-finite signal failure"
[[custom_vars]]
code = 4
msg = "unstable excitation response or internal tester terminal"
[[custom_vars]]
code = 5
msg = "tracking/convergence acceptance limit exceeded"
