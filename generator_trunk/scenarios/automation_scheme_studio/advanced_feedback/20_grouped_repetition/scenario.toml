spec_version = "1"
title = "Fourth-order regrouped and repeated feedback topology search"
note = "FW_Group recombines subset-produced loop modules; FW_PermutR repeats motifs; a brace joins those result tables and a nested brace encloses the result in another dynamic feedback loop."
args = ["sut=automation_scheme_studio", "suite=advanced_feedback", "order=4"]

seq_extra = [
  ["PARALLEL_RESULT", "FW_Reuse", "FW_(PARALLEL_OPEN,,REGROUPED_MODULES,,REPEATED_MOTIFS,,PARALLEL_CLOSE,,M:N)"],
  ["OUTER_RESULT", "FW_Reuse", "FW_(OUTER_OPEN,,FW_(),,OUTER_CONDITIONER,,OUTER_CLOSE,,M:N)"],
]

[[goals]]
key = "control_score"
dir = "max"
[[goals]]
key = "robustness_score"
dir = "max"
[[goals]]
key = "stability_score"
dir = "max"
[[goals]]
key = "settling_time_s"
dir = "min"
[[goals]]
key = "worst_error"
dir = "min"
[[goals]]
key = "overshoot_pct"
dir = "min"
[[goals]]
key = "control_effort"
dir = "min"

[[slots]]
sheet = "HEAD"
key = "head"
verb = "FW_Combi(1)"
raw = true
values = ['''
from generator_trunk.scenarios.automation_scheme_studio.bootstrap import initialize_candidate
PLAN, INITIAL_COMPONENT_PARAMETERS, MEASUREMENT_TERMINALS = initialize_candidate(
    family="advanced_feedback_grouped", battery="screen", duration=2.1, dt=0.06
)
from generator_trunk.scenarios.automation_scheme_studio.advanced_topology import (
    annotate_result, attach_topology, emit_atom, emit_close, emit_node, emit_open, template
)
TOPOLOGY_STREAM = []
''']

[[slots]]
sheet = "REGROUPED_MODULES"
key = "regrouped_modules"
verb = "FW_Subsets_RANGE(1,2)"
flags = ["FW_Exclude"]
group_replace = [["47", "47"]]
raw = true
values = [
'''emit_node(TOPOLOGY_STREAM, template("inverter_modulator_loop"))
''',
'''emit_node(TOPOLOGY_STREAM, template("parallel_conditioners"))
''',
'''emit_node(TOPOLOGY_STREAM, template("repeated_relay_loop"))
''',
'''emit_node(TOPOLOGY_STREAM, template("nested_selector_loop"))
'''
]

[[slots]]
sheet = "REPEATED_MOTIFS"
key = "repeated_motifs"
verb = "FW_PermutR(2)"
flags = ["FW_Exclude"]
raw = true
values = [
'''emit_atom(TOPOLOGY_STREAM, "inverter")
''',
'''emit_atom(TOPOLOGY_STREAM, "modulator")
''',
'''emit_node(TOPOLOGY_STREAM, template("parallel_pid_loops"))
'''
]

[[slots]]
sheet = "OUTER_CONDITIONER"
key = "outer_conditioner"
verb = "FW_Combi(1)"
flags = ["FW_Exclude"]
raw = true
values = [
'''emit_atom(TOPOLOGY_STREAM, "low_pass")
''',
'''emit_atom(TOPOLOGY_STREAM, "integrator")
'''
]

[[slots]]
sheet = "PARALLEL_RESULT"
key = "parallel_result"
verb = "FW_Combi(1)"
flags = ["FW_Exclude"]
raw = true
values = ["pass\n"]

[[slots]]
sheet = "OUTER_RESULT"
key = "outer_result"
verb = "FW_Combi(1)"
raw = true
values = ["pass\n"]

[[slots]]
sheet = "PARALLEL_OPEN"
key = "parallel_open"
verb = "FW_Combi(1)"
raw = true
values = ['''emit_open(TOPOLOGY_STREAM, 3, "parallel", reducer="signed")
''']

[[slots]]
sheet = "PARALLEL_CLOSE"
key = "parallel_close"
verb = "FW_Combi(1)"
raw = true
values = ['''emit_close(TOPOLOGY_STREAM, 3)
''']

[[slots]]
sheet = "OUTER_OPEN"
key = "outer_open"
verb = "FW_Combi(1)"
raw = true
values = ['''emit_open(
    TOPOLOGY_STREAM, 4, "feedback", controller="relay",
    boundary="integrator", placement="feedback_only"
)
''']

[[slots]]
sheet = "OUTER_CLOSE"
key = "outer_close"
verb = "FW_Combi(1)"
raw = true
values = ['''emit_close(TOPOLOGY_STREAM, 4)
''']

[[slots]]
sheet = "POLICY"
key = "policy"
verb = "FW_Combi(1)"
raw = true
values = [
'''
PLAN.architecture = "serial"
PLAN.controller = "pi"
PLAN.plant = "first_order"
PLAN.apply_profile("conservative")
''',
'''
PLAN.architecture = "cascade_velocity"
PLAN.controller = "pid"
PLAN.inner_controller = "p"
PLAN.branches = ["p", "pi", "pid"]
PLAN.plant = "second_order"
PLAN.apply_profile("balanced")
PLAN.enable("actuator_limit")
''',
'''
PLAN.architecture = "relay_switch"
PLAN.controller = "relay"
PLAN.inner_controller = "pid"
PLAN.branches = ["relay", "pid", "pi"]
PLAN.plant = "second_order"
PLAN.apply_profile("aggressive")
PLAN.enable("sensor_filter")
PLAN.enable("transport_delay")
'''
]

[[slots]]
sheet = "TAIL"
key = "tail"
verb = "FW_Combi(1)"
raw = true
values = ['''
TOPOLOGY = attach_topology(PLAN, TOPOLOGY_STREAM)
from generator_trunk.scenarios.automation_scheme_studio.bootstrap import finish_candidate
_RESULT = finish_candidate(PLAN, MEASUREMENT_TERMINALS)
annotate_result(_RESULT, TOPOLOGY)
FW_VAR = _RESULT.code
FW_CUSTOM_VAR = FW_VAR
print(_RESULT.metrics_line(
    initial_parameters=INITIAL_COMPONENT_PARAMETERS,
    include_terminals=True,
    include_parameters=True,
))
''']

[[custom_vars]]
code = 2
msg = "circuit validation/build/compile failure"
[[custom_vars]]
code = 3
msg = "simulation runtime or non-finite signal failure"
[[custom_vars]]
code = 4
msg = "unstable excitation response or internal tester terminal"
[[custom_vars]]
code = 5
msg = "tracking/convergence acceptance limit exceeded"
