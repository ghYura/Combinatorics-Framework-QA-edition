spec_version = "1"
title = "Automation Studio deep nested feedback — subsets x FW_PermutR(3)"
note = "Three ordered loop slots (identity or a real dynamic local-feedback SCC) explore effective depths zero through three inside parallel/cascade/switched architectures."
args = ["sut=automation_scheme_studio", "tier=screen", "depth=3"]

[[goals]]
key = "control_score"
dir = "max"
[[goals]]
key = "robustness_score"
dir = "max"
[[goals]]
key = "stability_score"
dir = "max"
[[goals]]
key = "settling_time_s"
dir = "min"
[[goals]]
key = "worst_error"
dir = "min"
[[goals]]
key = "overshoot_pct"
dir = "min"
[[goals]]
key = "control_effort"
dir = "min"

[[slots]]
sheet = "HEAD"
key = "head"
verb = "FW_Combi(1)"
raw = true
values = [
'''from generator_trunk.scenarios.automation_scheme_studio.bootstrap import initialize_candidate
PLAN, INITIAL_COMPONENT_PARAMETERS, MEASUREMENT_TERMINALS = initialize_candidate(
    family="02_deep_nested", battery="screen", duration=1.8, dt=0.06
)
'''
]

[[slots]]
sheet = "ARCH"
key = "architecture"
verb = "FW_Combi(1)"
raw = true
values = [
'''PLAN.architecture = "parallel_sum"
''',
'''PLAN.architecture = "cascade_velocity"
''',
'''PLAN.architecture = "relay_switch"
'''
]

[[slots]]
sheet = "BRANCH_SET"
key = "branch_set"
verb = "FW_Subsets_RANGE(1,2)"
raw = true
values = [
'''PLAN.add_branch("p")
''',
'''PLAN.add_branch("pi")
''',
'''PLAN.add_branch("pid")
''',
'''PLAN.add_branch("relay")
'''
]

[[slots]]
sheet = "NESTED_LOOPS"
key = "nested_loops"
verb = "FW_PermutR(3)"
raw = true
values = [
'''PLAN.add_loop("identity")
''',
'''PLAN.add_loop("p_delay")
''',
'''PLAN.add_loop("pi_filter")
''',
'''PLAN.add_loop("pid_delay")
''',
'''PLAN.add_loop("pid_integrator")
'''
]

[[slots]]
sheet = "PLANT"
key = "plant"
verb = "FW_Combi(1)"
raw = true
values = [
'''PLAN.plant = "first_order"
''',
'''PLAN.plant = "second_order"
'''
]

[[slots]]
sheet = "PROFILE"
key = "profile"
verb = "FW_Combi(1)"
raw = true
values = [
'''PLAN.apply_profile("conservative")
''',
'''PLAN.apply_profile("balanced")
''',
'''PLAN.apply_profile("aggressive")
'''
]

[[slots]]
sheet = "OPTIONS"
key = "options"
verb = "FW_Combi(1)"
raw = true
values = [
'''pass
''',
'''PLAN.enable("prefilter")
''',
'''PLAN.enable("sensor_filter")
PLAN.enable("actuator_limit")
''',
'''PLAN.enable("sensor_filter")
PLAN.enable("actuator_limit")
PLAN.enable("transport_delay")
'''
]

[[slots]]
sheet = "TAIL"
key = "tail"
verb = "FW_Combi(1)"
raw = true
values = [
'''from generator_trunk.scenarios.automation_scheme_studio.bootstrap import finish_candidate
_RESULT = finish_candidate(PLAN, MEASUREMENT_TERMINALS)
FW_VAR = _RESULT.code
FW_CUSTOM_VAR = FW_VAR
print(_RESULT.metrics_line(
    initial_parameters=INITIAL_COMPONENT_PARAMETERS,
    include_terminals=True,
    include_parameters=True,
))
'''
]


[[custom_vars]]
code = 2
msg = "circuit validation/build/compile failure"
[[custom_vars]]
code = 3
msg = "simulation runtime or non-finite signal failure"
[[custom_vars]]
code = 4
msg = "unstable excitation response or internal tester terminal"
[[custom_vars]]
code = 5
msg = "tracking/convergence acceptance limit exceeded"
