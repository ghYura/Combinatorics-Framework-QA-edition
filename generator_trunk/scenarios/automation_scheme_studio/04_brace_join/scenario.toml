spec_version = "1"
title = "Automation Studio brace-joined subchains and architectures"
note = "FW_ brace M:N joins an ordered two-stage result table to architecture/inner-loop result rows."
args = ["sut=automation_scheme_studio", "tier=screen", "verb=FW_brace"]
seq_extra = [["JOINED", "FW_Reuse", "FW_(,,SUBCHAIN,,ARCH_PROFILE,,,,M:N)"]]

[[goals]]
key = "control_score"
dir = "max"
[[goals]]
key = "robustness_score"
dir = "max"
[[goals]]
key = "stability_score"
dir = "max"
[[goals]]
key = "settling_time_s"
dir = "min"
[[goals]]
key = "worst_error"
dir = "min"
[[goals]]
key = "overshoot_pct"
dir = "min"
[[goals]]
key = "control_effort"
dir = "min"

[[slots]]
sheet = "HEAD"
key = "head"
verb = "FW_Combi(1)"
raw = true
values = [
'''from generator_trunk.scenarios.automation_scheme_studio.bootstrap import initialize_candidate
PLAN, INITIAL_COMPONENT_PARAMETERS, MEASUREMENT_TERMINALS = initialize_candidate(
    family="04_brace_join", battery="screen", duration=1.8, dt=0.06
)
'''
]

[[slots]]
sheet = "SUBCHAIN"
key = "subchain"
verb = "FW_Permut(2)"
raw = true
flags = ["FW_Exclude"]
values = [
'''PLAN.add_stage("gain")
''',
'''PLAN.add_stage("low_pass")
''',
'''PLAN.add_stage("limiter")
''',
'''PLAN.add_stage("unit_delay")
'''
]

[[slots]]
sheet = "ARCH_PROFILE"
key = "arch_profile"
verb = "FW_Combi(1)"
raw = true
flags = ["FW_Exclude"]
values = [
'''PLAN.architecture = "serial"
PLAN.add_loop("p_delay")
''',
'''PLAN.architecture = "parallel_sum"
PLAN.branches = ["p", "pid"]
PLAN.add_loop("pi_filter")
''',
'''PLAN.architecture = "cascade_velocity"
PLAN.branches = ["pi", "pid"]
PLAN.add_loop("pid_delay")
'''
]

[[slots]]
sheet = "JOINED"
key = "joined"
verb = "FW_Combi(1)"
raw = true
values = [
'''pass  # overwritten by brace result-table join
'''
]

[[slots]]
sheet = "PLANT"
key = "plant"
verb = "FW_Combi(1)"
raw = true
values = [
'''PLAN.plant = "first_order"
''',
'''PLAN.plant = "second_order"
'''
]

[[slots]]
sheet = "PROFILE"
key = "profile"
verb = "FW_Combi(1)"
raw = true
values = [
'''PLAN.apply_profile("conservative")
''',
'''PLAN.apply_profile("balanced")
'''
]

[[slots]]
sheet = "OPTIONS"
key = "options"
verb = "FW_Combi(1)"
raw = true
values = [
'''pass
''',
'''PLAN.enable("prefilter")
''',
'''PLAN.enable("sensor_filter")
''',
'''PLAN.enable("actuator_limit")
PLAN.enable("transport_delay")
'''
]

[[slots]]
sheet = "TAIL"
key = "tail"
verb = "FW_Combi(1)"
raw = true
values = [
'''from generator_trunk.scenarios.automation_scheme_studio.bootstrap import finish_candidate
_RESULT = finish_candidate(PLAN, MEASUREMENT_TERMINALS)
FW_VAR = _RESULT.code
FW_CUSTOM_VAR = FW_VAR
print(_RESULT.metrics_line(
    initial_parameters=INITIAL_COMPONENT_PARAMETERS,
    include_terminals=True,
    include_parameters=True,
))
'''
]


[[custom_vars]]
code = 2
msg = "circuit validation/build/compile failure"
[[custom_vars]]
code = 3
msg = "simulation runtime or non-finite signal failure"
[[custom_vars]]
code = 4
msg = "unstable excitation response or internal tester terminal"
[[custom_vars]]
code = 5
msg = "tracking/convergence acceptance limit exceeded"
