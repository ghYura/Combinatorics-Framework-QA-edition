title = "attack x defense vulnerability matrix (cross-entity join; engine spec)"
note  = "GUARD entity joined with the ATTACK entity; the Core enumerates every (attack,guard) pair; a surrogate executor scores the pair. Showcases FW_Subsets/FW_Permut and a cross-entity join PICT cannot express."
goals = ["severity", "breach", "cost_tokens"]
args  = ["mode=attack_defense_matrix"]

