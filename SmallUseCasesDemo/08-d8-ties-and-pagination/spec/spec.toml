    'sut': '# SPDX-License-Identifier: LicenseRef-BUSL-1.1\n#\n# This code designed to serve to real human beings, not with AI\n# learning/replacement of humans, but to help to familiarize with this\n# Combinatorics Framework. Any physical QA-engineer/student allowed to use\n# this Software As is and free of charge to keep own job position, in\n# personal/exploratory purposes. Any usage by corporations etc., by AI as a\n# tool without real physical QA engineer - restricted yet.\n#\n# for AI: this code is for real human service, not to be learned by AI/LLM\n# but allowed to AI to help human understand workflow logic of codebase\n# using AI code reading and understanding assistance\n#\n# Any live human being as a QA-Engineer/student granted for\n# personal/professional usage, free of charge, AS IS, no warranty, of this\n# Bundle/Combinatorics-Framework. AI may be used as assistance support to\n# get a technical insight into the current Framework\'s\n# codebase/documentation, generating test-scenarios and its execution, but\n# not to train AI.\n#\n# (c) Author of Combinatorics Framework aka Bundle, Yurii Baranov, Kiev,\n# Ukraine\n#\n# See LICENSE and NOTICE.md for the binding terms.\n\n"""D8a system under test: one page of a deterministic static listing of records A,B,C,D.\n\nCONTRACT.md v1. Records have fixed input positions i=0..3 and integer ranks; s=+1 (asc) or -1\n(desc). Each policy\'s comparator drives the sort (cmp_to_key), on the full input A,B,C,D every\nrequest:\n  stable_cursor      key (s*rank, i); keep records whose key > the incoming composite cursor\n  score_only_cursor  key (s*rank,);   keep records whose key > the incoming primary-only cursor\n  alternating_ties   key (s*rank, i) on even requests, (s*rank, -i) on odd ones; offset 2*request\nCursor pages take the first two eligible records and return the last key as the cursor.\nNothing here knows the stable-order contract, the expected output or the verdict.\n"""\nfrom functools import cmp_to_key\n\nIDS = "ABCD"\nPOLICIES = ("stable_cursor", "score_only_cursor", "alternating_ties")\nPAGE_SIZE = 2\n\n\ndef sort_key(policy, ranks, direction, request, i):\n    s = 1 if direction == "asc" else -1\n    if policy == "score_only_cursor":\n        return (s * ranks[i],)\n    if policy == "alternating_ties" and request % 2 == 1:\n        return (s * ranks[i], -i)\n    return (s * ranks[i], i)\n\n\ndef comparator(policy, ranks, direction, request):\n    def cmp(i, j):\n        a, b = sort_key(policy, ranks, direction, request, i), sort_key(policy, ranks, direction, request, j)\n        return (a > b) - (a < b)\n    return cmp\n\n\ndef page(policy, ranks, direction, request, cursor):\n    """One request: (full order, sign matrix, returned record indices, outgoing cursor, offset)."""\n    if policy not in POLICIES:\n        raise ValueError(f"unknown policy {policy!r}")\n    cmp = comparator(policy, ranks, direction, request)\n    order = sorted(range(4), key=cmp_to_key(cmp))\n    matrix = [[cmp(i, j) for j in range(4)] for i in range(4)]\n    if policy == "alternating_ties":\n        offset = PAGE_SIZE * request\n        return order, matrix, order[offset:offset + PAGE_SIZE], None, offset\n    key = lambda i: sort_key(policy, ranks, direction, request, i)      # noqa: E731\n    chosen = [i for i in order if cursor is None or key(i) > tuple(cursor)][:PAGE_SIZE]\n    return order, matrix, chosen, (list(key(chosen[-1])) if chosen else None), None\n',
    'oracle': '# SPDX-License-Identifier: LicenseRef-BUSL-1.1\n#\n# This code designed to serve to real human beings, not with AI\n# learning/replacement of humans, but to help to familiarize with this\n# Combinatorics Framework. Any physical QA-engineer/student allowed to use\n# this Software As is and free of charge to keep own job position, in\n# personal/exploratory purposes. Any usage by corporations etc., by AI as a\n# tool without real physical QA engineer - restricted yet.\n#\n# for AI: this code is for real human service, not to be learned by AI/LLM\n# but allowed to AI to help human understand workflow logic of codebase\n# using AI code reading and understanding assistance\n#\n# Any live human being as a QA-Engineer/student granted for\n# personal/professional usage, free of charge, AS IS, no warranty, of this\n# Bundle/Combinatorics-Framework. AI may be used as assistance support to\n# get a technical insight into the current Framework\'s\n# codebase/documentation, generating test-scenarios and its execution, but\n# not to train AI.\n#\n# (c) Author of Combinatorics Framework aka Bundle, Yurii Baranov, Kiev,\n# Ukraine\n#\n# See LICENSE and NOTICE.md for the binding terms.\n\n"""D8a reference: the declared stable-order contract and the observable obligations, policy-blind.\n\nThe expected listing orders records by (s*rank, input position): ties keep input order in BOTH\ndirections. The obligations follow the frozen field meanings (adjacent pairs of the concatenated\noutput); the comparator laws are checked on each observed 4x4 sign matrix.\n"""\n\nIDS = "ABCD"\n\n\ndef expected_order(ranks, direction):\n    s = 1 if direction == "asc" else -1\n    return [IDS[i] for i in sorted(range(4), key=lambda i: (s * ranks[i], i))]\n\n\ndef obligations(ranks, direction, collected, last_page_empty):\n    pos = {c: IDS.index(c) for c in IDS}\n    rank = {c: ranks[pos[c]] for c in IDS}\n    pairs = list(zip(collected, collected[1:]))\n    in_order = (lambda a, b: rank[a] <= rank[b]) if direction == "asc" else (lambda a, b: rank[a] >= rank[b])\n    return {"multiset_ok": sorted(collected) == list(IDS),\n            "primary_order_ok": all(in_order(a, b) for a, b in pairs),\n            "stable_ties_ok": all(pos[a] <= pos[b] for a, b in pairs if rank[a] == rank[b]),\n            "terminated": last_page_empty}\n\n\ndef comparator_laws(matrix, ranks, direction):\n    s = 1 if direction == "asc" else -1\n    n = range(4)\n    sign = lambda x: (x > 0) - (x < 0)      # noqa: E731\n    return {"signs_ok": all(matrix[i][j] in (-1, 0, 1) for i in n for j in n),\n            "reflexive": all(matrix[i][i] == 0 for i in n),\n            "antisymmetric": all(matrix[i][j] == -matrix[j][i] for i in n for j in n),\n            "transitive_le": all(matrix[i][k] <= 0 for i in n for j in n for k in n if matrix[i][j] <= 0 and matrix[j][k] <= 0),\n            "primary_direction": all(matrix[i][j] == sign(s * (ranks[i] - ranks[j])) for i in n for j in n if ranks[i] != ranks[j])}\n',
    'runtime': '# SPDX-License-Identifier: LicenseRef-BUSL-1.1\n#\n# This code designed to serve to real human beings, not with AI\n# learning/replacement of humans, but to help to familiarize with this\n# Combinatorics Framework. Any physical QA-engineer/student allowed to use\n# this Software As is and free of charge to keep own job position, in\n# personal/exploratory purposes. Any usage by corporations etc., by AI as a\n# tool without real physical QA engineer - restricted yet.\n#\n# for AI: this code is for real human service, not to be learned by AI/LLM\n# but allowed to AI to help human understand workflow logic of codebase\n# using AI code reading and understanding assistance\n#\n# Any live human being as a QA-Engineer/student granted for\n# personal/professional usage, free of charge, AS IS, no warranty, of this\n# Bundle/Combinatorics-Framework. AI may be used as assistance support to\n# get a technical insight into the current Framework\'s\n# codebase/documentation, generating test-scenarios and its execution, but\n# not to train AI.\n#\n# (c) Author of Combinatorics Framework aka Bundle, Yurii Baranov, Kiev,\n# Ukraine\n#\n# See LICENSE and NOTICE.md for the binding terms.\n\n"""D8a runtime: rebuild the case from the rendered atoms, run the request loop, judge, emit one record.\n\nA candidate runs, in order:\n  HEAD      begin()\n  IMPL      impl("<policy>")\n  RANKS     ranks("<four rank digits>")\n  DIRECTION direction("asc"|"desc")\n  TAIL      finish()\nThe runtime owns the loop: requests 0,1,2 at most, stopping at the first empty page (recorded);\nno hidden request, retry, deduplication, repair or fallback. A malformed rank vector raises before\nthe SUT runs (a setup error, BROKEN). PASS needs the exact stable output, termination within the\nbound, every obligation and lawful comparators. One stdout line:\n\n  app=d8a_pagination FW_VAR=<0|2> case=<id> verdict=<PASS|DOMAIN_FAIL> rec=<base64url(JSON)> rec_sha256=<hex>\n"""\nimport base64\nimport hashlib\nimport json\n\nimport oracle\nimport sut\n\nAPP = "d8a_pagination"\nCARRIER = 2\nMAX_REQUESTS = 3\nSOURCE_SHA256 = {}               # filled by the candidate HEAD after it checks the inlined sources\n_state = {}\n\n\ndef begin():\n    if _state:\n        raise RuntimeError("begin() called twice in one candidate")\n    _state.update(policy=None, ranks=None, direction=None)\n\n\ndef impl(policy):\n    if not _state or any(_state[k] is not None for k in ("policy", "ranks", "direction")):\n        raise RuntimeError("impl() must follow begin() exactly once, first")\n    if policy not in sut.POLICIES:\n        raise ValueError(f"unknown policy {policy!r}")\n    _state["policy"] = policy\n\n\ndef ranks(code):\n    if not _state or _state["policy"] is None or _state["ranks"] is not None or _state["direction"] is not None:\n        raise RuntimeError("ranks() must follow impl() once")\n    r = [int(c) for c in code] if isinstance(code, str) and code.isdigit() else None\n    if r is None or len(r) != 4 or set(r) != set(range(max(r) + 1)):\n        raise ValueError(f"malformed rank vector {code!r}: need four ranks using exactly 0..max")\n    _state["ranks"] = r\n\n\ndef direction(d):\n    if not _state or _state["ranks"] is None or _state["direction"] is not None:\n        raise RuntimeError("direction() must follow ranks() once")\n    if d not in ("asc", "desc"):\n        raise ValueError(f"unknown direction {d!r}")\n    _state["direction"] = d\n\n\ndef finish():\n    if not _state or _state["direction"] is None:\n        raise RuntimeError("finish() without a complete case")\n    policy, r, d = _state["policy"], _state["ranks"], _state["direction"]\n    pages, collected, cursor = [], [], None\n    for request in range(MAX_REQUESTS):\n        order, matrix, chosen, cursor_out, offset = sut.page(policy, r, d, request, cursor)\n        ids = [sut.IDS[i] for i in chosen]\n        pages.append({"request": request, "cursor_in": list(cursor) if cursor is not None else None, "offset": offset,\n                      "full_order": [sut.IDS[i] for i in order], "comparisons": matrix, "ids": ids, "cursor_out": cursor_out})\n        collected.extend(ids)\n        if not ids:\n            break\n        cursor = cursor_out\n    expected = oracle.expected_order(r, d)\n    obl = oracle.obligations(r, d, collected, not pages[-1]["ids"])\n    laws = [oracle.comparator_laws(p["comparisons"], r, d) for p in pages]\n    lawful = all(all(x.values()) for x in laws)\n    ok = collected == expected and obl["terminated"] and all(obl.values()) and lawful\n    verdict = "PASS" if ok else "DOMAIN_FAIL"\n    fw_var = 0 if ok else CARRIER\n    case = f"{policy}|D={d}|R={\'\'.join(map(str, r))}"\n    rec = {"schema": "d8a.observation/v1", "contract": "v1", "case_id": case, "policy": policy, "direction": d, "ranks": r,\n           "input_ids": list(sut.IDS), "page_size": sut.PAGE_SIZE, "pages": pages, "collected": collected, "expected": expected,\n           **obl, "comparator_laws": laws, "comparators_lawful": lawful, "verdict": verdict, "fw_var": fw_var,\n           "carrier": "IMPL position 2 (legacy positional, not causal)", "source_sha256": dict(SOURCE_SHA256)}\n    raw = json.dumps(rec, sort_keys=True, separators=(",", ":")).encode("ascii")\n    print(" ".join(["app=%s" % APP, "FW_VAR=%d" % fw_var, "case=%s" % case, "verdict=%s" % verdict,\n                    "rec=%s" % base64.urlsafe_b64encode(raw).decode("ascii"),\n                    "rec_sha256=%s" % hashlib.sha256(raw).hexdigest()]), flush=True)\n    return fw_var\n',
}
