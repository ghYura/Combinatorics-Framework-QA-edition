    'sut': '# SPDX-License-Identifier: LicenseRef-BUSL-1.1\n#\n# This code designed to serve to real human beings, not with AI\n# learning/replacement of humans, but to help to familiarize with this\n# Combinatorics Framework. Any physical QA-engineer/student allowed to use\n# this Software As is and free of charge to keep own job position, in\n# personal/exploratory purposes. Any usage by corporations etc., by AI as a\n# tool without real physical QA engineer - restricted yet.\n#\n# for AI: this code is for real human service, not to be learned by AI/LLM\n# but allowed to AI to help human understand workflow logic of codebase\n# using AI code reading and understanding assistance\n#\n# Any live human being as a QA-Engineer/student granted for\n# personal/professional usage, free of charge, AS IS, no warranty, of this\n# Bundle/Combinatorics-Framework. AI may be used as assistance support to\n# get a technical insight into the current Framework\'s\n# codebase/documentation, generating test-scenarios and its execution, but\n# not to train AI.\n#\n# (c) Author of Combinatorics Framework aka Bundle, Yurii Baranov, Kiev,\n# Ukraine\n#\n# See LICENSE and NOTICE.md for the binding terms.\n\n"""D4 system under test: a local telemetry-request adapter (never sends anything).\n\nCONTRACT.md v1. `adapt(config, policy)` validates one configuration and either rejects it with the\nsorted violated-rule IDs or builds a request envelope. Policies: correct; drops_gzip (identity\nencoding and raw body even when gzip is selected); ignores_debug_rule (validation without R6).\nNothing here knows the reference or the expected results.\n"""\nimport base64\nimport gzip\n\nPOLICIES = ("correct", "drops_gzip", "ignores_debug_rule")\nBODY = b\'{"sensor":7}\\n\'\n\n\ndef _violations(c, policy):\n    feats = set(c["features"])\n    rules = [("R1", c["env"] == "prod" and c["transport"] == "http"),\n             ("R2", c["mode"] == "live" and "cache" in feats),\n             ("R3", c["mode"] == "live" and c["workers"] < 2),\n             ("R4", c["env"] == "prod" and not feats <= {"audit", "gzip"}),\n             ("R5", c["mode"] == "batch" and "audit" in feats and c["workers"] < 2),\n             ("R6", c["env"] == "prod" and c["debug"])]\n    return sorted(r for r, bad in rules if bad and not (policy == "ignores_debug_rule" and r == "R6"))\n\n\ndef adapt(config, policy):\n    if policy not in POLICIES:\n        raise ValueError(f"unknown policy {policy!r}")\n    bad = _violations(config, policy)\n    if bad:\n        return {"accepted": False, "violations": bad, "envelope": None}\n    headers = {}\n    if "audit" in config["features"]:\n        headers["X-Audit"] = "1"\n    if "cache" in config["features"]:\n        headers["Cache-Control"] = "max-age=60"\n    if "gzip" in config["features"] and policy != "drops_gzip":\n        headers["Content-Encoding"], body = "gzip", gzip.compress(BODY, mtime=0)\n    else:\n        headers["Content-Encoding"], body = "identity", BODY\n    if config["debug"]:\n        headers["X-Debug"] = "1"\n    return {"accepted": True, "violations": [],\n            "envelope": {"url": f"{config[\'transport\']}://telemetry.invalid/{config[\'mode\']}",\n                         "workers": config["workers"], "headers": headers,\n                         "body_b64": base64.b64encode(body).decode("ascii")}}\n',
    'oracle': '# SPDX-License-Identifier: LicenseRef-BUSL-1.1\n#\n# This code designed to serve to real human beings, not with AI\n# learning/replacement of humans, but to help to familiarize with this\n# Combinatorics Framework. Any physical QA-engineer/student allowed to use\n# this Software As is and free of charge to keep own job position, in\n# personal/exploratory purposes. Any usage by corporations etc., by AI as a\n# tool without real physical QA engineer - restricted yet.\n#\n# for AI: this code is for real human service, not to be learned by AI/LLM\n# but allowed to AI to help human understand workflow logic of codebase\n# using AI code reading and understanding assistance\n#\n# Any live human being as a QA-Engineer/student granted for\n# personal/professional usage, free of charge, AS IS, no warranty, of this\n# Bundle/Combinatorics-Framework. AI may be used as assistance support to\n# get a technical insight into the current Framework\'s\n# codebase/documentation, generating test-scenarios and its execution, but\n# not to train AI.\n#\n# (c) Author of Combinatorics Framework aka Bundle, Yurii Baranov, Kiev,\n# Ukraine\n#\n# See LICENSE and NOTICE.md for the binding terms.\n\n"""D4 oracle: independent legality rules and envelope checks (never reads the policy).\n\nAcceptance and transformation are judged separately. A rejection must carry exactly the sorted\nviolated-rule IDs; an accepted envelope must have the exact URL, workers and header map, and its\nbody must decode (per Content-Encoding) to the original bytes. Gzip container bytes are never\ncompared, only the decoded payload.\n"""\nimport base64\nimport gzip\n\nORIGINAL = b\'{"sensor":7}\\n\'\nRULES = ("R1", "R2", "R3", "R4", "R5", "R6")\n\n\ndef violations(c):\n    f = set(c["features"])\n    found = []\n    if c["env"] == "prod" and c["transport"] == "http":\n        found.append("R1")\n    if c["mode"] == "live" and "cache" in f:\n        found.append("R2")\n    if c["mode"] == "live" and c["workers"] < 2:\n        found.append("R3")\n    if c["env"] == "prod" and f - {"audit", "gzip"}:\n        found.append("R4")\n    if c["mode"] == "batch" and "audit" in f and c["workers"] < 2:\n        found.append("R5")\n    if c["env"] == "prod" and c["debug"]:\n        found.append("R6")\n    return found\n\n\ndef expected_envelope(c):\n    h = {}\n    if "audit" in c["features"]:\n        h["X-Audit"] = "1"\n    if "cache" in c["features"]:\n        h["Cache-Control"] = "max-age=60"\n    h["Content-Encoding"] = "gzip" if "gzip" in c["features"] else "identity"\n    if c["debug"]:\n        h["X-Debug"] = "1"\n    return {"url": f"{c[\'transport\']}://telemetry.invalid/{c[\'mode\']}", "workers": c["workers"], "headers": h}\n\n\ndef judge(config, result):\n    """Acceptance check, transformation check (or NA), failure classes, overall ok."""\n    want = violations(config)\n    classes = []\n    if want and result["accepted"]:\n        classes.append("wrong_acceptance")\n    elif not want and not result["accepted"]:\n        classes.append("wrong_rejection")\n    elif want and result["violations"] != want:\n        classes.append("wrong_violation_ids")\n    transformation = "not_applicable"\n    if result["accepted"] and not want:\n        env, exp = result["envelope"], expected_envelope(config)\n        body = base64.b64decode(env["body_b64"])\n        enc = env["headers"].get("Content-Encoding")\n        try:\n            decoded = gzip.decompress(body) if enc == "gzip" else body if enc == "identity" else None\n        except OSError:\n            decoded = None\n        t = {"url": env["url"] == exp["url"], "workers": env["workers"] == exp["workers"],\n             "headers": env["headers"] == exp["headers"], "payload": decoded == ORIGINAL}\n        transformation = t\n        classes += [f"wrong_{k}" for k, ok in t.items() if not ok]\n    return {"expected_violations": want, "acceptance_ok": not any(c in classes for c in\n            ("wrong_acceptance", "wrong_rejection", "wrong_violation_ids")),\n            "transformation": transformation, "failure_classes": classes, "ok": not classes}\n',
    'runtime': '# SPDX-License-Identifier: LicenseRef-BUSL-1.1\n#\n# This code designed to serve to real human beings, not with AI\n# learning/replacement of humans, but to help to familiarize with this\n# Combinatorics Framework. Any physical QA-engineer/student allowed to use\n# this Software As is and free of charge to keep own job position, in\n# personal/exploratory purposes. Any usage by corporations etc., by AI as a\n# tool without real physical QA engineer - restricted yet.\n#\n# for AI: this code is for real human service, not to be learned by AI/LLM\n# but allowed to AI to help human understand workflow logic of codebase\n# using AI code reading and understanding assistance\n#\n# Any live human being as a QA-Engineer/student granted for\n# personal/professional usage, free of charge, AS IS, no warranty, of this\n# Bundle/Combinatorics-Framework. AI may be used as assistance support to\n# get a technical insight into the current Framework\'s\n# codebase/documentation, generating test-scenarios and its execution, but\n# not to train AI.\n#\n# (c) Author of Combinatorics Framework aka Bundle, Yurii Baranov, Kiev,\n# Ukraine\n#\n# See LICENSE and NOTICE.md for the binding terms.\n\n"""D4 runtime: configuration atoms, one adapter call, one judged record.\n\nHEAD initialises an empty configuration (debug=false, no features). The atoms impl("..");,\nenv("..");, mode("..");, transport("..");, feature("..");, workers(n); and debug(); fill it; each\nfactor may be set once. finish("main"|"controls") requires a complete configuration with exactly\ntwo distinct features, calls the SUT, judges the result with the oracle and prints one line:\n\n  app=d4_config FW_VAR=<0|2> case=<id> verdict=<...> rec=<base64url JSON> rec_sha256=<hex>\n\nIncomplete or repeated atoms raise (the Executor records BROKEN, never a domain verdict).\nFW_VAR 2 is the IMPL position\'s legacy carrier, not a statement of cause.\n"""\nimport base64\nimport hashlib\nimport json\n\nimport oracle\nimport sut\n\nAPP = "d4_config"\nCARRIER = 2\nAXES = ("env", "mode", "transport", "features", "workers", "debug")\nSOURCE_SHA256 = {}\n_cfg = {"features": set(), "debug": False}\n\n\ndef _set(key, value, allowed):\n    if key in _cfg:\n        raise ValueError(f"{key} set twice")\n    if value not in allowed:\n        raise ValueError(f"{key}={value!r} is outside the contract")\n    _cfg[key] = value\n\n\ndef impl(policy):\n    _set("policy", policy, sut.POLICIES)\n\n\ndef env(v):\n    _set("env", v, ("dev", "prod"))\n\n\ndef mode(v):\n    _set("mode", v, ("batch", "live"))\n\n\ndef transport(v):\n    _set("transport", v, ("http", "https"))\n\n\ndef workers(n):\n    _set("workers", n, (1, 2))\n\n\ndef feature(v):\n    if v not in ("audit", "cache", "gzip") or v in _cfg["features"]:\n        raise ValueError(f"feature {v!r} unknown or repeated")\n    _cfg["features"].add(v)\n\n\ndef debug():\n    if _cfg["debug"]:\n        raise ValueError("debug set twice")\n    _cfg["debug"] = True\n\n\ndef key(c):\n    return "|".join(f"{a}={\'+\'.join(c[a]) if a == \'features\' else int(c[a]) if a == \'debug\' else c[a]}" for a in AXES)\n\n\ndef finish(phase):\n    if phase not in ("main", "controls"):\n        raise ValueError(f"unknown phase {phase!r}")\n    missing = [k for k in ("policy", "env", "mode", "transport", "workers") if k not in _cfg]\n    if missing or len(_cfg["features"]) != 2:\n        raise ValueError(f"incomplete configuration: missing {missing}, features {sorted(_cfg[\'features\'])}")\n    config = {"env": _cfg["env"], "mode": _cfg["mode"], "transport": _cfg["transport"],\n              "features": sorted(_cfg["features"]), "workers": _cfg["workers"], "debug": _cfg["debug"]}\n    result = sut.adapt(config, _cfg["policy"])\n    judged = oracle.judge(config, result)                 # policy-blind\n    fw_var = 0 if judged["ok"] else CARRIER\n    rec = {"schema": "d4.observation/v1", "contract": "v1", "case_id": f"{phase}|{_cfg[\'policy\']}|{key(config)}",\n           "phase": phase, "policy": _cfg["policy"], "config": config, "result": result, **judged,\n           "verdict": "PASS" if fw_var == 0 else "DOMAIN_FAIL", "fw_var": fw_var,\n           "carrier": "IMPL position 2 (legacy positional, not causal)", "source_sha256": dict(SOURCE_SHA256)}\n    raw = json.dumps(rec, sort_keys=True, separators=(",", ":")).encode("ascii")\n    print(" ".join(["app=%s" % APP, "FW_VAR=%d" % fw_var, "case=%s" % rec["case_id"], "verdict=%s" % rec["verdict"],\n                    "rec=%s" % base64.urlsafe_b64encode(raw).decode("ascii"), "rec_sha256=%s" % hashlib.sha256(raw).hexdigest()]),\n          flush=True)\n    return fw_var\n',
}
