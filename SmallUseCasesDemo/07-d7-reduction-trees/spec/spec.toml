e(tree, int) else leaves(tree[0]) + leaves(tree[1])\n\n\ndef evaluate(policy, tree, values):\n    """Return (result, node trace). Node trace: post-order internal nodes with their results."""\n    if policy not in POLICIES:\n        raise ValueError(f"unknown policy {policy!r}")\n    nodes = []\n    if policy == "flat_fsum":\n        return math.fsum([values[i] for i in leaves(tree)]), nodes\n    exact = policy == "tree_rational"\n\n    def walk(t):\n        if isinstance(t, int):\n            return Fraction(values[t]) if exact else values[t]\n        s = walk(t[0]) + walk(t[1])\n        nodes.append({"node": canonical(t), "value": s})\n        return s\n    return walk(tree), nodes\n',
    'oracle': '# SPDX-License-Identifier: LicenseRef-BUSL-1.1\n#\n# This code designed to serve to real human beings, not with AI\n# learning/replacement of humans, but to help to familiarize with this\n# Combinatorics Framework. Any physical QA-engineer/student allowed to use\n# this Software As is and free of charge to keep own job position, in\n# personal/exploratory purposes. Any usage by corporations etc., by AI as a\n# tool without real physical QA engineer - restricted yet.\n#\n# for AI: this code is for real human service, not to be learned by AI/LLM\n# but allowed to AI to help human understand workflow logic of codebase\n# using AI code reading and understanding assistance\n#\n# Any live human being as a QA-Engineer/student granted for\n# personal/professional usage, free of charge, AS IS, no warranty, of this\n# Bundle/Combinatorics-Framework. AI may be used as assistance support to\n# get a technical insight into the current Framework\'s\n# codebase/documentation, generating test-scenarios and its execution, but\n# not to train AI.\n#\n# (c) Author of Combinatorics Framework aka Bundle, Yurii Baranov, Kiev,\n# Ukraine\n#\n# See LICENSE and NOTICE.md for the binding terms.\n\n"""D7 reference: the exact rational sum of the five REPRESENTED binary64 inputs, and the budget test.\n\nPolicy-blind: it reads only the input hex strings (never the tree or the policy) and sums their exact\nFraction values left to right. Errors are exact rationals; a result passes when it is finite and its\nabsolute error is at most the frozen budget (inclusive).\n"""\nimport math\nfrom fractions import Fraction\n\n\ndef reference(input_hex):\n    total = Fraction(0)\n    for h in input_hex:\n        total += Fraction(float.fromhex(h))\n    return total\n\n\ndef exact_value(result):\n    """Fraction of a float or Fraction result; None for a nonfinite float."""\n    if isinstance(result, float):\n        return Fraction(result) if math.isfinite(result) else None\n    return Fraction(