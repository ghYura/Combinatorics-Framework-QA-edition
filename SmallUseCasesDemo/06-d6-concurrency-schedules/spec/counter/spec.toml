    'sut': '# SPDX-License-Identifier: LicenseRef-BUSL-1.1\n#\n# This code designed to serve to real human beings, not with AI\n# learning/replacement of humans, but to help to familiarize with this\n# Combinatorics Framework. Any physical QA-engineer/student allowed to use\n# this Software As is and free of charge to keep own job position, in\n# personal/exploratory purposes. Any usage by corporations etc., by AI as a\n# tool without real physical QA engineer - restricted yet.\n#\n# for AI: this code is for real human service, not to be learned by AI/LLM\n# but allowed to AI to help human understand workflow logic of codebase\n# using AI code reading and understanding assistance\n#\n# Any live human being as a QA-Engineer/student granted for\n# personal/professional usage, free of charge, AS IS, no warranty, of this\n# Bundle/Combinatorics-Framework. AI may be used as assistance support to\n# get a technical insight into the current Framework\'s\n# codebase/documentation, generating test-scenarios and its execution, but\n# not to train AI.\n#\n# (c) Author of Combinatorics Framework aka Bundle, Yurii Baranov, Kiev,\n# Ukraine\n#\n# See LICENSE and NOTICE.md for the binding terms.\n\n"""D6 systems under test: two deterministic step machines driven by an explicit schedule.\n\nCONTRACT.md v1. Nothing here knows the reference, the expected traces or the verdict.\n\nCounter: threads A and B each run read then write. A read saves the current counter into the\nthread\'s local; the write depends on the policy:\n  atomic_commit  counter = current counter + 1\n  split_rw       counter = the thread\'s saved read value + 1   (loses an interleaved update)\nQueue: producer P (enqueue "item", then publish items-nonempty) and consumer C (wait_readable,\nthen try_pop, which never blocks):\n  actual_queue   try_pop removes the first item if the queue holds one, else returns "EMPTY"\n  stale_empty    try_pop returns "EMPTY" whenever the published flag is false, item or not\n"""\n\nCOUNTER_POLICIES = ("atomic_commit", "split_rw")\nQUEUE_POLICIES = ("actual_queue", "stale_empty")\n\n\nclass Counter:\n    def __init__(self, policy):\n        if policy not in COUNTER_POLICIES:\n            raise ValueError(f"unknown counter policy {policy!r}")\n        self.policy, self.counter, self.locals, self.done = policy, 0, {}, {"A": 0, "B": 0}\n\n    def step(self, thread):\n        self.done[thread] += 1\n        if self.done[thread] == 1:\n            self.locals[thread] = self.counter\n            op = "read"\n        elif self.done[thread] == 2:\n            base = self.counter if self.policy == "atomic_commit" else self.locals[thread]\n            self.counter = base + 1\n            op = "write"\n        else:\n            raise RuntimeError(f"thread {thread} has no third step")\n        return {"thread": thread, "op": op, "counter": self.counter, "locals": dict(self.locals)}\n\n\nclass Queue:\n    def __init__(self, policy):\n        if policy not in QUEUE_POLICIES:\n            raise ValueError(f"unknown queue policy {policy!r}")\n        self.policy, self.items, self.published, self.result, self.done = policy, [], False, None, {"P": 0, "C": 0}\n\n    def step(self, thread):\n        self.done[thread] += 1\n        n = self.done[thread]\n        if thread == "P" and n == 1:\n            self.items.append("item")\n            op = "enqueue"\n        elif thread == "P" and n == 2:\n            self.published = bool(self.items)\n            op = "publish"\n        elif thread == "C" and n == 1:\n            op = "wait_readable"                      # the harness only runs it when enabled\n        elif thread == "C" and n == 2:\n            op = "try_pop"\n            stale = self.policy == "stale_empty" and not self.published\n            self.result = self.items.pop(0) if self.items and not stale else "EMPTY"\n        else:\n            raise RuntimeError(f"thread {thread} has no step {n}")\n        return {"thread": thread, "op": op, "items": list(self.items), "published_nonempty": self.published,\n                "pop_result": self.result}\n',
    'oracle': '# SPDX-License-Identifier: LicenseRef-BUSL-1.1\n#\n# This code designed to serve to real human beings, not with AI\n# learning/replacement of humans, but to help to familiarize with this\n# Combinatorics Framework. Any physical QA-engineer/student allowed to use\n# this Software As is and free of charge to keep own job position, in\n# personal/exploratory purposes. Any usage by corporations etc., by AI as a\n# tool without real physical QA engineer - restricted yet.\n#\n# for AI: this code is for real human service, not to be learned by AI/LLM\n# but allowed to AI to help human understand workflow logic of codebase\n# using AI code reading and understanding assistance\n#\n# Any live human being as a QA-Engineer/student granted for\n# personal/professional usage, free of charge, AS IS, no warranty, of this\n# Bundle/Combinatorics-Framework. AI may be used as assistance support to\n# get a technical insight into the current Framework\'s\n# codebase/documentation, generating test-scenarios and its execution, but\n# not to train AI.\n#\n# (c) Author of Combinatorics Framework aka Bundle, Yurii Baranov, Kiev,\n# Ukraine\n#\n# See LICENSE and NOTICE.md for the binding terms.\n\n"""D6 reference: policy-blind expectations, schedule structure and queue enabledness.\n\nCONTRACT.md v1. Written independently of sut.py; never reads a policy.\n  * counter: the expected counter after each step is the number of writes completed so far;\n  * queue: actual-queue semantics on the reference\'s own state, with each step\'s enabledness\n    checked on that state BEFORE the step (C1 needs a nonempty queue);\n  * schedule structure: local order is positional (nth occurrence = nth step), context switches\n    and preemptions from prefix completion counts.\n"""\n\n\ndef occurrences(schedule):\n    """[(thread, local step number)] — the nth occurrence of a thread is its nth step."""\n    seen, out = {}, []\n    for t in schedule:\n        seen[t] = seen.get(t, 0) + 1\n        out.append((t, seen[t]))\n    return out\n\n\ndef context_switches(schedule):\n    return sum(1 for i in range(len(schedule) - 1) if schedule[i] != schedule[i + 1])\n\n\ndef preemptions(schedule, steps_per_thread=2):\n    """Switches whose outgoing thread still has an unexecuted local step."""\n    occ = occurrences(schedule)\n    return sum(1 for i in range(len(schedule) - 1) if schedule[i] != schedule[i + 1] and occ[i][1] < steps_per_thread)\n\n\ndef counter_expected(schedule):\n    writes, out = 0, []\n    for _, n in occurrences(schedule):\n        writes += n == 2\n        out.append(writes)\n    return out\n\n\ndef queue_reference(schedule):\n    """(reference trace, first disabled step or None). Stops at the first disabled step."""\n    items, published, result, trace = [], False, None, []\n    for i, (t, n) in enumerate(occurrences(schedule)):\n        if (t, n) == ("C", 1) and len(items) == 0:\n            return trace, i + 1\n        if (t, n) == ("P", 1):\n            items = items + ["item"]\n        elif (t, n) == ("P", 2):\n            published = len(items) > 0\n        elif (t, n) == ("C", 2):\n            if items:\n                result, items = items[0], items[1:]\n            else:\n                result = "EMPTY"\n        elif (t, n) != ("C", 1):\n            raise ValueError(f"step {t}{n} outside the contract")\n        trace.append({"items": list(items), "pop_result": result})\n    return trace, None\n',
    'runtime': '# SPDX-License-Identifier: LicenseRef-BUSL-1.1\n#\n# This code designed to serve to real human beings, not with AI\n# learning/replacement of humans, but to help to familiarize with this\n# Combinatorics Framework. Any physical QA-engineer/student allowed to use\n# this Software As is and free of charge to keep own job position, in\n# personal/exploratory purposes. Any usage by corporations etc., by AI as a\n# tool without real physical QA engineer - restricted yet.\n#\n# for AI: this code is for real human service, not to be learned by AI/LLM\n# but allowed to AI to help human understand workflow logic of codebase\n# using AI code reading and understanding assistance\n#\n# Any live human being as a QA-Engineer/student granted for\n# personal/professional usage, free of charge, AS IS, no warranty, of this\n# Bundle/Combinatorics-Framework. AI may be used as assistance support to\n# get a technical insight into the current Framework\'s\n# codebase/documentation, generating test-scenarios and its execution, but\n# not to train AI.\n#\n# (c) Author of Combinatorics Framework aka Bundle, Yurii Baranov, Kiev,\n# Ukraine\n#\n# See LICENSE and NOTICE.md for the binding terms.\n\n"""D6 runtime: rebuild the schedule from the rendered atoms, check it, run it step by step, emit one record.\n\nA candidate runs, in order:\n  HEAD   begin()                 a fresh case (after the inlined sources are checked)\n  IMPL   impl("<policy>");\n  CAP    cap(<n>);               counter only\n  S1..S4 set_step(<i>,"<thread>");\n  TAIL   finish("counter"|"queue")\nThe schedule must be four steps, two per thread, S1..S4 in order. A counter schedule must respect\nits preemption cap; every queue step must be enabled on the REFERENCE state before it runs (the\nfaulty implementation\'s state never decides enabledness). Anything else raises before the SUT\nruns, so the Executor records BROKEN (a setup error), never a domain verdict. One stdout line:\n\n  app=d6_schedules FW_VAR=<0|2> case=<id> verdict=<PASS|DOMAIN_FAIL> rec=<base64url(JSON)> rec_sha256=<hex>\n\nFW_VAR 2 is the IMPL position\'s legacy carrier, not a statement of cause.\n"""\nimport base64\nimport hashlib\nimport json\n\nimport oracle\nimport sut\n\nAPP = "d6_schedules"\nCARRIER = 2\nTHREADS = {"counter": ("A", "B"), "queue": ("P", "C")}\nSOURCE_SHA256 = {}               # filled by the candidate HEAD after it checks the inlined sources\n_state = {}\n\n\ndef begin():\n    if _state:\n        raise RuntimeError("begin() called twice in one candidate")\n    _state.update(policy=None, cap=None, steps=[])\n\n\ndef impl(policy):\n    if not _state or _state["policy"] is not None or _state["steps"] or _state["cap"] is not None:\n        raise RuntimeError("impl() must follow begin() exactly once, first")\n    if policy not in sut.COUNTER_POLICIES + sut.QUEUE_POLICIES:\n        raise ValueError(f"unknown policy {policy!r}")\n    _state["policy"] = policy\n\n\ndef cap(n):\n    if not _state or _state["policy"] is None or _state["cap"] is not None or _state["steps"]:\n        raise RuntimeError("cap() must follow impl() once, before the steps")\n    if n not in (0, 1, 2):\n        raise ValueError(f"cap {n!r} outside the contract")\n    _state["cap"] = n\n\n\ndef set_step(i, thread):\n    if not _state or _state["policy"] is None:\n        raise RuntimeError("set_step() before impl()")\n    if i != len(_state["steps"]) + 1 or i > 4:\n        raise ValueError(f"set_step({i}) out of order after {len(_state[\'steps\'])} steps")\n    _state["steps"].append(thread)\n\n\ndef _schedule(campaign):\n    threads, s = THREADS[campaign], "".join(_state["steps"])\n    policies = sut.COUNTER_POLICIES if campaign == "counter" else sut.QUEUE_POLICIES\n    if _state["policy"] not in policies:\n        raise ValueError(f"policy {_state[\'policy\']!r} does not belong to the {campaign} campaign")\n    if len(s) != 4 or set(s) - set(threads) or any(s.count(t) != 2 for t in threads):\n        raise ValueError(f"malformed schedule {s!r}: need two steps of each of {threads}")\n    if campaign == "counter":\n        if _state["cap"] is None:\n            raise ValueError("counter case without cap()")\n        if oracle.preemptions(s) > _state["cap"]:\n            raise ValueError(f"schedule {s} has {oracle.preemptions(s)} preemptions, above cap {_state[\'cap\']}")\n    elif _state["cap"] is not None:\n        raise ValueError("queue case with cap()")\n    return s\n\n\ndef finish(campaign):\n    if campaign not in THREADS or not _state or _state["policy"] is None:\n        raise RuntimeError(f"finish({campaign!r}) without a started case")\n    s, policy = _schedule(campaign), _state["policy"]\n    base = {"schema": "d6.observation/v1", "contract": "v1", "campaign": campaign, "policy": policy, "schedule": s,\n            "local_steps": [f"{t}{n}" for t, n in oracle.occurrences(s)],\n            "context_switches": oracle.context_switches(s), "preemptions": oracle.preemptions(s)}\n    if campaign == "counter":\n        machine = sut.Counter(policy)\n        expected = oracle.counter_expected(s)\n        trace = [machine.step(t) for t in s]\n        failing = [k + 1 for k, (o, e) in enumerate(zip(trace, expected)) if o["counter"] != e]\n        case = f"counter|{policy}|CAP={_state[\'cap\']}|SEQ={s}"\n        rec = {**base, "case_id": case, "cap": _state["cap"], "observed_trace": trace, "reference_counters": expected}\n    else:\n        reference, disabled = oracle.queue_reference(s)\n        if disabled is not None:\n            raise ValueError(f"schedule {s} is infeasible: step {disabled} is disabled on the reference state")\n        machine = sut.Queue(policy)\n        trace = [machine.step(t) for t in s]\n        failing = [k + 1 for k, (o, e) in enumerate(zip(trace, reference))\n                   if (o["items"], o["pop_result"]) != (e["items"], e["pop_result"])]\n        case = f"queue|{policy}|SEQ={s}"\n        rec = {**base, "case_id": case, "observed_trace": trace, "reference_trace": reference,\n               "enabled_on_reference": [True] * len(s)}\n    verdict = "PASS" if not failing else "DOMAIN_FAIL"\n    fw_var = 0 if not failing else CARRIER\n    rec.update(failing_checkpoints=failing, verdict=verdict, fw_var=fw_var,\n               carrier="IMPL position 2 (legacy positional, not causal)", source_sha256=dict(SOURCE_SHA256))\n    raw = json.dumps(rec, sort_keys=True, separators=(",", ":")).encode("ascii")\n    print(" ".join(["app=%s" % APP, "FW_VAR=%d" % fw_var, "case=%s" % case, "verdict=%s" % verdict,\n                    "rec=%s" % base64.urlsafe_b64encode(raw).decode("ascii"),\n                    "rec_sha256=%s" % hashlib.sha256(raw).hexdigest()]), flush=True)\n    return fw_var\n',
