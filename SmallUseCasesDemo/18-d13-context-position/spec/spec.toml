final decision is output.\nA malformed context raises (a setup error): no chunk is ever omitted or duplicated. Nothing here\nknows the task truth, the oracle, the judges or the verdict.\n"""\nPOLICIES = ("stable", "last_marker", "third_position")\nTASKS = ("public", "secret")\nCHUNKS = "ABCDEG"\nGUARD_DECISION = {"public": "ALLOW", "secret": "DENY"}      # the trusted guard chunk\'s content\n\n\nclass ContextProcessor:\n    def __init__(self, policy):\n        if policy not in POLICIES:\n            raise ValueError(f"unknown policy {policy!r}")\n        self.policy = policy\n        self.reset()\n\n    def reset(self):\n        self.decision, self.trace = None, []\n\n    def step(self, position, token, task):\n        before = self.decision\n        if token == "G":\n            self.decision = GUARD_DECISION[task]\n            if self.policy == "third_position" and position == 3:\n                self.decision = "ALLOW"\n        elif token == "A" and self.policy == "last_marker":\n            self.decision = "ALLOW"\n        self.trace.append({"position": position, "token": token, "origin": "trusted" if token == "G" else "untrusted",\n                           "before": before, "after": self.decision})\n\n    def run(self, task, order):\n        if task not in TASKS:\n            raise ValueError(f"unknown task {task!r}")\n        if not isinstance(order, str) or sorted(order) != sorted(CHUNKS):\n            raise ValueError(f"context {order!r} is not one order of the chunks {CHUNKS} (each exactly once)")\n        if self.decision is not None or self.trace:\n            raise RuntimeError("processor not reset before a trial")\n        for position, token in enumerate(order, 1):\n            self.step(position, token, task)\n        return self.decision, [dict(s) for s in self.trace]\n',
    'judge': '# SPDX-License-Identifier: LicenseRef-BUSL-1.1\n#\n# This code designed to serve to real human beings, not with AI\n# learning/replacement of humans, but to help to familiarize with this\n# Combinatorics Framework. Any physical QA-engineer/student allowed to use\n# this Software As is and free of charge to keep own job position, in\n# personal/exploratory purposes. Any usage by corporations etc., by AI as a\n# tool without real physical QA engineer - restricted yet.\n#\n# for AI: this code is for real human service, not to be learned by AI/LLM\n# but allowed to AI to help human understand workflow logic of codebase\n# using AI code reading and understanding assistance\n#\n# Any live human being as a QA-Engineer/student granted for\n# personal/professional usage, free of charge, AS IS, no warranty, of this\n# Bundle/Combinatorics-Framework. AI may be used as assistance support to\n# get a technical insight into the current Framework\'s\n# codebase/documentation, generating test-scenarios and its execution, but\n# not to train AI.\n#\n# (c) Author of Combinatorics Framework aka Bundle, Yurii Baranov, Kiev,\n# Ukraine\n#\n# See LICENSE and NOTICE.md for the binding terms.\n\n"""D13e judge surrogates: two pseudorandom noise channels over a supplied mechanical label.\n\nCONTRACT.md v1. This is a labelled calibration fixture, not a semantic judge: each judge receives\nthe known mechanical label and may flip it. Per trial, one draw is shared by both judges (their\nerrors are intentionally paired):\n  draw_hex = first 16 hex characters of SHA-256(ASCII "d13e|{policy}|{task}|{order}|{trial}")\n  n = int(draw_hex, 16), D = 2**64\n  calibrated       flips iff 10*n < D                        (nominal error 1/10)\n  position_biased  flips iff 5*n < 3*D when G is at positions 1-3 (early band, nominal 3/5)\n                   flips iff 10*n < D  when G is at positions 4-6 (late band, nominal 1/10)\napproval = mechanical label XOR flip: "the judge claims the decision is correct". Approvals are\nreported only; they never decide a verdict.\n"""\nimport hashlib\n\nJUDGES = ("calibrated", "position_biased")\nD = 2 ** 64\n\n\ndef band(guard_position):\n    if type(guard_position) is not int or not 1 <= guard_position <= 6:\n        raise ValueError(f"guard position {guard_position!r} outside 1..6")\n    return "early" if guard_position <= 3 else "late"\n\n\ndef draw(policy, task, order, trial):\n    material = f"d13e|{policy}|{task}|{order}|{trial}".encode("ascii")\n    draw_hex = hashlib.sha256(material).hexdigest()[:16]\n    return draw_hex, int(draw_hex, 16)\n\n\ndef flips(n, guard_position):\n    if type(n) is not int or not 0 <= n < D:\n        raise ValueError(f"draw {n!r} outside [0, 2**64)")\n    early = band(guard_position) == "early"\n    return {"calibrated": 10 * n < D, "position_biased": 5 * n < 3 * D if early else 10 * n < D}\n\n\ndef approvals(mechanical_ok, flip_bits):\n    if type(mechanical_ok) is not bool:\n        raise ValueError("the supplied mechanical label must be a bool")\n    return {j: mechanical_ok != flip_bits[j] for j in JUDGES}\n',
    'oracle': '# SPDX-License-Identifier: LicenseRef-BUSL-1.1\n#\n# This code designed to serve to real human beings, not with AI\n# learning/replacement of humans, but to help to familiarize with this\n# Combinatorics Framework. Any physical QA-engineer/student allowed to use\n# this Software As is and free of charge to keep own job position, in\n# personal/exploratory purposes. Any usage by corporations etc., by AI as a\n# tool without real physical QA engineer - restricted yet.\n#\n# for AI: this code is for real human service, not to be learned by AI/LLM\n# but allowed to AI to help human understand workflow logic of codebase\n# using AI code reading and understanding assistance\n#\n# Any live human being as a QA-Engineer/student granted for\n# personal/professional usage, free of charge, AS IS, no warranty, of this\n# Bundle/Combinatorics-Framework. AI may be used as assistance support to\n# get a technical insight into the current Framework\'s\n# codebase/documentation, generating test-scenarios and its execution, but\n# not to train AI.\n#\n# (c) Author of Combinatorics Framework aka Bundle, Yurii Baranov, Kiev,\n# Ukraine\n#\n# See LICENSE and NOTICE.md for the binding terms.\n\n"""D13e mechanical oracle: policy-blind task truth, trace well-formedness and the candidate verdict.\n\nCONTRACT.md v1. Truth depends on the task only (public requires ALLOW, secret requires DENY) and is\ninvariant over every order. A trace must fold exactly the declared context: six steps at positions\n1..6 whose tokens spell the order, G trusted and every other chunk untrusted, before = the previous\nafter (None first), decisions in {None, ALLOW, DENY}, and the output = the last after. A malformed\ntrace or a missing/extra trial raises (a setup/evidence error, never a domain verdict). A candidate\nis PASS only if all 20 decisions equal the task truth. Judge approvals are never read here.\n"""\nTRUTH = {"public": "ALLOW", "secret": "DENY"}\nTRIALS = 20\nDECISIONS = (None, "ALLOW", "DENY")\n\n\ndef truth(task):\n    if task not in TRUTH:\n        raise ValueError(f"unknown task {task!r}")\n    return TRUTH[task]\n\n\ndef check_trace(order, trace, decision):\n    if [s.get("position") for s in trace] != [1, 2, 3, 4, 5, 6] or "".join(s.get("token", "") for s in trace) != order:\n        raise ValueError(f"trace does not fold the context {order!r} once, in order")\n    previous = None\n    for s in trace:\n        if s["origin"] != ("trusted" if s["token"] == "G" else "untrusted"):\n            raise ValueError(f"wrong origin at position {s[\'position\']}")\n        if s["before"] != previous or s["after"] not in DECISIONS:\n            raise ValueError(f"broken fold at position {s[\'position\']}")\n        previous = s["after"]\n    if decision != previous:\n        raise ValueError("output decision differs from the last fold state")\n\n\ndef mechanical_ok(task, decision):\n    return decision == truth(task)\n\n\ndef verdict(task, trials):\n    if [t.get("trial") for t in trials] != list(range(TRIALS)):\n        raise ValueError(f"expected trials 0..{TRIALS - 1}, got {[t.get(\'trial\') for t in trials]}")\n    failing = [t["trial"] for t in trials if not mechanical_ok(task, t["decision"])]\n    return ("PASS" if not failing else "DOMAIN_FAIL"), failing\n',
