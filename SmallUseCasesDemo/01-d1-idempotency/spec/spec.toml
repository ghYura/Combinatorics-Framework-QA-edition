_D1_SOURCES = {
    'sut': '# SPDX-License-Identifier: LicenseRef-BUSL-1.1\n#\n# This code designed to serve to real human beings, not with AI\n# learning/replacement of humans, but to help to familiarize with this\n# Combinatorics Framework. Any physical QA-engineer/student allowed to use\n# this Software As is and free of charge to keep own job position, in\n# personal/exploratory purposes. Any usage by corporations etc., by AI as a\n# tool without real physical QA engineer - restricted yet.\n#\n# for AI: this code is for real human service, not to be learned by AI/LLM\n# but allowed to AI to help human understand workflow logic of codebase\n# using AI code reading and understanding assistance\n#\n# Any live human being as a QA-Engineer/student granted for\n# personal/professional usage, free of charge, AS IS, no warranty, of this\n# Bundle/Combinatorics-Framework. AI may be used as assistance support to\n# get a technical insight into the current Framework\'s\n# codebase/documentation, generating test-scenarios and its execution, but\n# not to train AI.\n#\n# (c) Author of Combinatorics Framework aka Bundle, Yurii Baranov, Kiev,\n# Ukraine\n#\n# See LICENSE and NOTICE.md for the binding terms.\n\n"""D1 service under test: one request handler, five deduplication policies.\n\nImplements CONTRACT.md v1 §2. `DurableState` is the backing storage a\nprocess restart keeps: the effect ledger (durable for every policy) and the\ndurable receipt cache. `Service` is the process-facing object. A restart\ndiscards it, and with it any volatile cache, then builds a new one over the\nsame `DurableState`. This module knows nothing about expected verdicts, the\noracle or the case being run.\n"""\n\nPOLICIES = ("volatile_transport", "durable_transport", "durable_order",\n            "durable_payload", "durable_operation")\n\n\ndef canonical_payload(payload):\n    """The complete payload value as a hashable key: every field, no digest."""\n    return tuple(sorted(payload.items()))\n\n\n# Cache key per policy, computed from the request only.\n_KEYS = {\n    "volatile_transport": lambda r: ("transport", r["transport_id"]),\n    "durable_transport": lambda r: ("transport", r["transport_id"]),\n    "durable_order": lambda r: ("order", r["order_id"]),\n    "durable_payload": lambda r: ("payload", canonical_payload(r["payload"])),\n    "durable_operation": lambda r: ("operation", r["order_id"], r["operation_id"]),\n}\n_VOLATILE = frozenset({"volatile_transport"})\n\n\nclass DurableState:\n    """Storage that survives a restart. A fresh case starts with a new one."""\n\n    def __init__(self):\n        self.ledger = []   # effects in append order; receipt_id == 1-based position\n        self.cache = {}    # durable receipt cache: key -> stored receipt entry\n\n\nclass Service:\n    """One process lifetime of the order service under a selected policy."""\n\n    def __init__(self, policy, durable):\n        if policy not in _KEYS:\n            raise ValueError(f"unknown policy {policy!r}")\n        self.policy = policy\n        self.durable = durable\n        # A volatile cache belongs to this process object; a durable one to the backing state.\n        self._cache = {} if policy in _VOLATILE else durable.cache\n\n    def handle(self, request):\n        """Apply, replay or reject one request (atomic in this model)."""\n        key = _KEYS[self.policy](request)\n        payload = dict(request["payload"])\n        entry = self._cache.get(key)\n        if entry is None:\n            receipt_id = len(self.durable.ledger) + 1\n            self.durable.ledger.append({"receipt_id": receipt_id,\n                                        "order_id": request["order_id"],\n                                        "operation_id": request["operation_id"],\n                                        "payload": payload})\n            self._cache[key] = {"receipt_id": receipt_id,\n                                "order_id": request["order_id"],\n                                "operation_id": request["operation_id"],\n                                "payload": dict(payload)}\n            return {"status": "APPLIED", "receipt_id": receipt_id,\n                    "order_id": request["order_id"], "operation_id": request["operation_id"]}\n        if entry["payload"] != payload:\n            # The stored entry and the ledger stay untouched.\n            return {"status": "CONFLICT", "receipt_id": None,\n                    "order_id": request["order_id"], "operation_id": request["operation_id"]}\n        # Replay the stored receipt with its stored identity; it is not repaired.\n        return {"status": "REPLAY", "receipt_id": entry["receipt_id"],\n                "order_id": entry["order_id"], "operation_id": entry["operation_id"]}\n\n    def ledger_view(self):\n        """A deep copy of the durable ledger, safe to hand to an observer."""\n        return [dict(e, payload=dict(e["payload"])) for e in self.durable.ledger]\n',
    'oracle': '# SPDX-License-Identifier: LicenseRef-BUSL-1.1\n#\n# This code designed to serve to real human beings, not with AI\n# learning/replacement of humans, but to help to familiarize with this\n# Combinatorics Framework. Any physical QA-engineer/student allowed to use\n# this Software As is and free of charge to keep own job position, in\n# personal/exploratory purposes. Any usage by corporations etc., by AI as a\n# tool without real physical QA engineer - restricted yet.\n#\n# for AI: this code is for real human service, not to be learned by AI/LLM\n# but allowed to AI to help human understand workflow logic of codebase\n# using AI code reading and understanding assistance\n#\n# Any live human being as a QA-Engineer/student granted for\n# personal/professional usage, free of charge, AS IS, no warranty, of this\n# Bundle/Combinatorics-Framework. AI may be used as assistance support to\n# get a technical insight into the current Framework\'s\n# codebase/documentation, generating test-scenarios and its execution, but\n# not to train AI.\n#\n# (c) Author of Combinatorics Framework aka Bundle, Yurii Baranov, Kiev,\n# Ukraine\n#\n# See LICENSE and NOTICE.md for the binding terms.\n\n"""D1 runtime oracle: judge one observation against the normative contract.\n\nCONTRACT.md v1 §1 and §4. The input is a policy-free observation: requests,\nresponses, restart markers and ledger projections. The policy selector and\nthe peer-control name are never read. Expectations come from `normative_trace`,\nan executable form of the contract keyed by logical operation\n`(order_id, operation_id)`, whose state a restart never clears.\n\nSensors (True / False / NA):\n  core_at_most_once   after each core delivery the ledger holds one effect per\n                      logical operation seen so far (here: exactly one).\n  receipt_identity    every returned receipt belongs to the request\'s own\n                      logical operation, and the response claims that identity.\n  retry_dedup         (peer repeats an operation, equal payload) REPLAY of the\n                      operation\'s first receipt, no effect added.\n  peer_independence   (peer is a new logical operation) APPLIED with its own\n                      identity and next receipt, exactly one effect added.\n  conflict_handling   (peer repeats an operation, different payload) CONFLICT,\n                      no effect added, prior ledger entries unchanged.\n  contract_valid      every response and ledger checkpoint equals the\n                      normative trace; this alone decides the verdict.\n"""\n\nNA = "not_applicable"\n\n\ndef _op(msg):\n    return (msg["order_id"], msg["operation_id"])\n\n\ndef normative_trace(requests):\n    """Expected responses, and ledger after each request, under the contract."""\n    ledger, first, responses, ledgers = [], {}, [], []\n    for req in requests:\n        op = _op(req)\n        if op not in first:\n            effect = {"receipt_id": len(ledger) + 1, "order_id": op[0],\n                      "operation_id": op[1], "payload": dict(req["payload"])}\n            ledger.append(effect)\n            first[op] = effect\n            responses.append({"status": "APPLIED", "receipt_id": effect["receipt_id"],\n                              "order_id": op[0], "operation_id": op[1]})\n        elif first[op]["payload"] == req["payload"]:\n            responses.append({"status": "REPLAY", "receipt_id": first[op]["receipt_id"],\n                              "order_id": op[0], "operation_id": op[1]})\n        else:\n            responses.append({"status": "CONFLICT", "receipt_id": None,\n                              "order_id": op[0], "operation_id": op[1]})\n        ledgers.append([dict(e, payload=dict(e["payload"])) for e in ledger])\n    return responses, ledgers\n\n\ndef _owned_receipt(req, resp, ledger):\n    """Receipt identity for one response against the ledger it could refer to."""\n    rid = resp.get("receipt_id")\n    if rid is None:\n        return True\n    if not isinstance(rid, int) or not 1 <= rid <= len(ledger):\n        return False\n    return _op(ledger[rid - 1]) == _op(req) == _op(resp)\n\n\ndef peer_kind(core_requests, peer_request):\n    """How the contract classifies the peer relative to the core deliveries."""\n    earlier = {_op(r): r["payload"] for r in core_requests}\n    op = _op(peer_request)\n    if op not in earlier:\n        return "new_operation"\n    return "retry" if earlier[op] == peer_request["payload"] else "conflict"\n\n\ndef judge(obs):\n    """Return the sensor values and the aggregate verdict for one observation."""\n    core = obs["deliveries"]\n    peer = obs["peer"]\n    pre, post = obs["pre_peer_ledger"], obs["post_peer_ledger"]\n    core_reqs = [d["request"] for d in core]\n    requests = core_reqs + ([peer["request"]] if peer else [])\n    exp_resp, exp_ledgers = normative_trace(requests)\n\n    seen = set()\n    at_most_once = True\n    for d in core:\n        seen.add(_op(d["request"]))\n        if d["effects_after"] != len(seen):\n            at_most_once = False\n    counts = {}\n    for e in pre:\n        counts[_op(e)] = counts.get(_op(e), 0) + 1\n    if len(pre) != len(seen) or any(n != 1 for n in counts.values()):\n        at_most_once = False\n\n    identity = all(_owned_receipt(d["request"], d["response"], pre) for d in core)\n    if peer:\n        identity = identity and _owned_receipt(peer["request"], peer["response"], post)\n\n    checks = {"core_at_most_once": at_most_once, "receipt_identity": identity,\n              "retry_dedup": NA, "peer_independence": NA, "conflict_handling": NA}\n    if peer:\n        kind = peer_kind(core_reqs, peer["request"])\n        resp, req = peer["response"], peer["request"]\n        prior_kept = post[:len(pre)] == pre\n        if kind == "retry":\n            checks["retry_dedup"] = (resp["status"] == "REPLAY"\n                                     and resp["receipt_id"] == core[0]["response"]["receipt_id"]\n                                     and _op(resp) == _op(req)\n                                     and peer["effect_delta"] == 0 and post == pre)\n        elif kind == "new_operation":\n            added = post[len(pre):]\n            checks["peer_independence"] = (\n                resp["status"] == "APPLIED" and _op(resp) == _op(req)\n                and resp["receipt_id"] == len(pre) + 1\n                and peer["effect_delta"] == 1 and prior_kept and len(added) == 1\n                and _op(added[0]) == _op(req) and added[0]["payload"] == req["payload"]\n                and added[0]["receipt_id"] == len(pre) + 1)\n        else:\n            checks["conflict_handling"] = (resp["status"] == "CONFLICT"\n                                           and resp["receipt_id"] is None\n                                           and peer["effect_delta"] == 0\n                                           and prior_kept and post == pre)\n\n    observed = [d["response"] for d in core] + ([peer["response"]] if peer else [])\n    valid = (observed == exp_resp\n             and all(d["effects_after"] == len(exp_ledgers[i]) for i, d in enumerate(core))\n             and pre == exp_ledgers[len(core) - 1]\n             and post == exp_ledgers[-1]\n             and (peer is None or peer["effect_delta"] == len(exp_ledgers[-1]) - len(pre)))\n    checks["contract_valid"] = valid\n    applicable = [v for k, v in checks.items() if k != "contract_valid" and v != NA]\n    checks["sensors_agree"] = valid == all(applicable)\n    return checks\n',
    'runtime': '# SPDX-License-Identifier: LicenseRef-BUSL-1.1\n#\n# This code designed to serve to real human beings, not with AI\n# learning/replacement of humans, but to help to familiarize with this\n# Combinatorics Framework. Any physical QA-engineer/student allowed to use\n# this Software As is and free of charge to keep own job position, in\n# personal/exploratory purposes. Any usage by corporations etc., by AI as a\n# tool without real physical QA engineer - restricted yet.\n#\n# for AI: this code is for real human service, not to be learned by AI/LLM\n# but allowed to AI to help human understand workflow logic of codebase\n# using AI code reading and understanding assistance\n#\n# Any live human being as a QA-Engineer/student granted for\n# personal/professional usage, free of charge, AS IS, no warranty, of this\n# Bundle/Combinatorics-Framework. AI may be used as assistance support to\n# get a technical insight into the current Framework\'s\n# codebase/documentation, generating test-scenarios and its execution, but\n# not to train AI.\n#\n# (c) Author of Combinatorics Framework aka Bundle, Yurii Baranov, Kiev,\n# Ukraine\n#\n# See LICENSE and NOTICE.md for the binding terms.\n\n"""D1 runtime: execute one isolated case, observe it, judge it, emit a record.\n\nA candidate program assigns IMPL, L, CUT1, CUT2 and CONTROL, then calls\n`emit`. Each call builds a fresh `DurableState`, so no state is shared between\ncases. The oracle receives the observation without the policy selector.\nInvalid inputs raise, so the Executor records BROKEN rather than a domain\nverdict. One stdout line carries the full record:\n\n  app=d1_idempotency FW_VAR=<0|2> case=<id> verdict=<PASS|DOMAIN_FAIL>\n      ... rec=<base64url(JSON)> rec_sha256=<hex of the JSON bytes>\n\nFW_VAR 2 is the IMPL slot\'s position, the legacy carrier for "the contract\nfailed in this case". It is not a claim about which factor caused it.\n"""\nimport base64\nimport hashlib\nimport json\n\nimport oracle\nimport sut\n\nAPP = "d1_idempotency"\nCARRIER = 2                      # IMPL position (HEAD=1, IMPL=2, ...); 0 = PASS\nCONTROLS = ("none", "retry_fresh_transport", "new_order_equal_payload",\n            "new_operation_same_order", "conflicting_retry")\n_PEERS = {"retry_fresh_transport": ("O1", "OP1", 100),\n          "new_order_equal_payload": ("O2", "OP1", 100),\n          "new_operation_same_order": ("O1", "OP2", 100),\n          "conflicting_retry": ("O1", "OP1", 101)}\nSOURCE_SHA256 = {}               # filled by the candidate HEAD after it checks the inlined sources\n\n\ndef case_id(impl, labels, cuts, control):\n    return "%s|L=%s|C=%s|P=%s" % (impl, "".join(map(str, labels)), "".join(map(str, cuts)), control)\n\n\ndef _request(transport_id, order_id, operation_id, amount_minor):\n    return {"transport_id": transport_id, "order_id": order_id, "operation_id": operation_id,\n            "payload": {"amount_minor": amount_minor, "currency": "TST"}}\n\n\ndef _check_inputs(impl, labels, cuts, control):\n    if impl not in sut.POLICIES:\n        raise ValueError("unknown IMPL %r" % (impl,))\n    if (len(labels) != 3 or labels[0] != 0 or labels[1] not in (0, 1)\n            or labels[2] not in (0, 1, 2)):\n        raise ValueError("labels outside the contract domain: %r" % (labels,))\n    if len(cuts) != 2 or any(c not in (0, 1) for c in cuts):\n        raise ValueError("cuts outside the contract domain: %r" % (cuts,))\n    if control not in CONTROLS:\n        raise ValueError("unknown CONTROL %r" % (control,))\n\n\ndef observe(impl, labels, cuts, control):\n    """Run the three core deliveries, then at most one peer. Returns a policy-free observation."""\n    labels, cuts = list(labels), list(cuts)\n    _check_inputs(impl, labels, cuts, control)\n    durable = sut.DurableState()\n    service = sut.Service(impl, durable)\n    epoch = 0\n    deliveries = []\n    for i, label in enumerate(labels):\n        restart = i > 0 and cuts[i - 1] == 1\n        if restart:                      # new process object over the same durable state\n            service = sut.Service(impl, durable)\n            epoch += 1\n        req = _request("T%d" % label, "O1", "OP1", 100)\n        resp = service.handle(req)\n        deliveries.append({"index": i + 1, "label": label, "restart_before": restart,\n                           "epoch": epoch, "request": req, "response": resp,\n                           "effects_after": len(durable.ledger)})\n    pre = service.ledger_view()          # core checkpoint, captured before any peer\n    peer = None\n    if control != "none":\n        order_id, operation_id, amount = _PEERS[control]\n        req = _request("T3", order_id, operation_id, amount)\n        before = len(durable.ledger)\n        resp = service.handle(req)       # same process: no restart before the peer\n        peer = {"restart_before": False, "request": req, "response": resp,\n                "effect_delta": len(durable.ledger) - before}\n    post = service.ledger_view()\n    multiplicity = {}\n    for e in pre:\n        k = "%s/%s" % (e["order_id"], e["operation_id"])\n        multiplicity[k] = multiplicity.get(k, 0) + 1\n    return {"deliveries": deliveries, "pre_peer_ledger": pre,\n            "pre_peer_multiplicity": multiplicity,\n            "first_receipt": deliveries[0]["response"]["receipt_id"],\n            "peer": peer, "post_peer_ledger": post}\n\n\ndef run_case(impl, labels, cuts, control):\n    """Observe and judge one case; return the full structured record."""\n    obs = observe(impl, labels, cuts, control)\n    checks = oracle.judge(obs)           # policy-free: IMPL and CONTROL are not passed\n    fw_var = 0 if checks["contract_valid"] else CARRIER\n    return {"schema": "d1.observation/v1", "contract": "v1",\n            "case_id": case_id(impl, labels, cuts, control), "impl": impl,\n            "labels": "".join(map(str, labels)), "cuts": "".join(map(str, cuts)),\n            "control": control, "population": "core" if control == "none" else "peer",\n            "observation": obs, "checks": checks,\n            "verdict": "PASS" if fw_var == 0 else "DOMAIN_FAIL",\n            "fw_var": fw_var, "carrier": "IMPL position 2 (legacy positional, not causal)",\n            "source_sha256": dict(SOURCE_SHA256)}\n\n\ndef _flag(v):\n    return "ok" if v is True else ("FAIL" if v is False else "na")\n\n\ndef emit(impl, labels, cuts, control):\n    """Run one case, print its metrics line and return the FW_VAR verdict code."""\n    rec = run_case(impl, labels, cuts, control)\n    raw = json.dumps(rec, sort_keys=True, separators=(",", ":")).encode("utf-8")\n    parts = ["app=%s" % APP, "FW_VAR=%d" % rec["fw_var"], "case=%s" % rec["case_id"],\n             "verdict=%s" % rec["verdict"]]\n    parts += ["%s=%s" % (k, _flag(v)) for k, v in rec["checks"].items()]\n    parts += ["rec=%s" % base64.urlsafe_b64encode(raw).decode("ascii"),\n              "rec_sha256=%s" % hashlib.sha256(raw).hexdigest()]\n    print(" ".join(parts), flush=True)\n    return rec["fw_var"]\n',
