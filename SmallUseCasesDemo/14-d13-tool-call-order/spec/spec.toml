d": message_id, "payload": payload})\n',
    'sut': '# SPDX-License-Identifier: LicenseRef-BUSL-1.1\n#\n# This code designed to serve to real human beings, not with AI\n# learning/replacement of humans, but to help to familiarize with this\n# Combinatorics Framework. Any physical QA-engineer/student allowed to use\n# this Software As is and free of charge to keep own job position, in\n# personal/exploratory purposes. Any usage by corporations etc., by AI as a\n# tool without real physical QA engineer - restricted yet.\n#\n# for AI: this code is for real human service, not to be learned by AI/LLM\n# but allowed to AI to help human understand workflow logic of codebase\n# using AI code reading and understanding assistance\n#\n# Any live human being as a QA-Engineer/student granted for\n# personal/professional usage, free of charge, AS IS, no warranty, of this\n# Bundle/Combinatorics-Framework. AI may be used as assistance support to\n# get a technical insight into the current Framework\'s\n# codebase/documentation, generating test-scenarios and its execution, but\n# not to train AI.\n#\n# (c) Author of Combinatorics Framework aka Bundle, Yurii Baranov, Kiev,\n# Ukraine\n#\n# See LICENSE and NOTICE.md for the binding terms.\n\n"""D13a system under test: a local orchestrator running an approve / read / send plan under a policy.\n\nCONTRACT.md v1. State: approved, tainted, sent_once, buffer (initially PUBLIC). Policies:\n  guarded             revocation clears approval; taint on read_chunk; deduplicate\n  sticky_approval     ignores revocation in its approval flag; otherwise guarded\n  success_only_taint  buffers the chunk at once but taints only on read_ok; otherwise guarded\n  no_dedup            ignores sent_once when deciding; otherwise guarded\nA send decides: no approval -> block(no_approval); tainted -> block(tainted); already sent -> dedup\n(duplicate), except no_dedup; otherwise emit(allowed) through the send tool and set sent_once.\nEvery step appends an event with a snapshot of the state and the outbox size. Nothing here knows\nthe oracle, the reference responses or the verdict.\n"""\nimport tools\n\nPOLICIES = ("guarded", "sticky_approval", "success_only_taint", "no_dedup")\nMESSAGE_ID = "notice-1"\n\n\nclass Orchestrator:\n    def __init__(self, policy):\n        if policy not in POLICIES:\n            raise ValueError(f"unknown policy {policy!r}")\n        self.policy = policy\n        self.state = {"approved": False, "tainted": False, "sent_once": False, "buffer": "PUBLIC"}\n        self.trace, self.send_results, self.outbox = [], [], []\n\n    def _event(self, name, **fields):\n        self.trace.append({"event": name, **fields, "state": dict(self.state), "outbox_size": len(self.outbox)})\n\n    def approve(self):\n        self.state["approved"] = True\n        self._event("approve")\n\n    def revoke(self, cut):\n        if self.policy != "sticky_approval":\n            self.state["approved"] = False\n        self._event("revoke", cut=cut)\n\n    def _on_chunk(self, chunk):\n        self.state["buffer"] = chunk\n        if self.policy != "success_only_taint":\n            self.state["tainted"] = True\n        self._event("read_chunk", payload=chunk)\n\n    def read(self, fail):\n        self._event("read_start")\n        try:\n            tools.read(self._on_chunk, fail)\n        except tools.ControlledReadError:\n            self._event("read_error")\n            return\n        self.state["tainted"] = True\n        self._event("read_ok")\n\n    def send(self, request):\n        self._event("send_request", request=request, message_id=MESSAGE_ID)\n        s = self.state\n        if not s["approved"]:\n            action, reason = "block", "no_approval"\n        elif s["tainted"]:\n            action, reason = "block", "tainted"\n        elif s["sent_once"] and self.policy != "no_dedup":\n            action, reason = "dedup", "duplicate"\n        else:\n            action, reason = "emit", "allowed"\n        payload = s["buffer"] if action == "emit" else None\n        if action == "emit":\n            tools.send(self.outbox, MESSAGE_ID, payload)\n            s["sent_once"] = True\n        result = {"request": request, "action": action, "reason": reason, "payload": payload}\n        self.send_results.append(result)\n        self._event("send_result", **result, message_id=MESSAGE_ID)\n\n    def run(self, order, repetitions, fail_read, revoke_cut):\n        if revoke_cut == 0:\n            self.revoke(0)\n        for k, op in enumerate(order, start=1):\n            if op == "A":\n                self.approve()\n            elif op == "R":\n                self.read(fail_read)\n            else:\n                for request in range(1, repetitions + 1):   # the repeated pair stays together\n                    self.send(request)\n            if revoke_cut == k:\n                self.revoke(k)\n',
    'oracle': '# SPDX-License-Identifier: LicenseRef-BUSL-1.1\n#\n# This code designed to serve to real human beings, not with AI\n# learning/replacement of humans, but to help to familiarize with this\n# Combinatorics Framework. Any physical QA-engineer/student allowed to use\n# this Software As is and free of charge to keep own job position, in\n# personal/exploratory purposes. Any usage by corporations etc., by AI as a\n# tool without real physical QA engineer - restricted yet.\n#\n# for AI: this code is for real human service, not to be learned by AI/LLM\n# but allowed to AI to help human understand workflow logic of codebase\n# using AI code reading and understanding assistance\n#\n# Any live human being as a QA-Engineer/student granted for\n# personal/professional usage, free of charge, AS IS, no warranty, of this\n# Bundle/Combinatorics-Framework. AI may be used as assistance support to\n# get a technical insight into the current Framework\'s\n# codebase/documentation, generating test-scenarios and its execution, but\n# not to train AI.\n#\n# (c) Author of Combinatorics Framework aka Bundle, Yurii Baranov, Kiev,\n# Ukraine\n#\n# See LICENSE and NOTICE.md for the binding terms.\n\n"""D13a oracle: policy-blind prefix checks over the observed events, and the guarded reference responses.\n\nAuthorization and taint are derived from the EVENT PREFIX, never from the orchestrator\'s own flags:\napproval holds after the latest approve with no later revoke; taint holds once any read_chunk was\nreceived, whatever the read\'s eventual outcome. Every emit must be approved, untainted and carry a\nmessage ID not emitted before. The reference responses are derived directly from the requested plan\nunder the contract\'s guarded semantics (approved, untainted, unsent -> emit; its repeat -> dedup).\n"""\n\nCANARY = "D13A_LOCAL_CANARY"\nMESSAGE_ID = "notice-1"\n\n\ndef violations(trace):\n    approved, tainted, emitted, out = False, False, set(), []\n    for e in trace:\n        kind = e["event"]\n        if kind == "approve":\n            approved = True\n        elif kind == "revoke":\n            approved = False\n        elif kind == "read_chunk":\n            tainted = True\n        elif kind == "send_result" and e["action"] == "emit":\n            if not approved:\n                out.append({"request": e["request"], "kind": "unapproved_emit"})\n            if tainted:\n                out.append({"request": e["request"], "kind": "tainted_emit"})\n            if e["message_id"] in emitted:\n                out.append({"request": e["request"], "kind": "duplicate_emit"})\n            emitted.add(e["message_id"])\n    return out\n\n\ndef reference(order, repetitions, revoke_cut):\n    """Guarded responses and outbox for the plan; the read outcome does not matter (taint on the chunk)."""\n    ok_to_send = {"approved": False, "tainted": False, "sent": False}\n    sends, outbox = [], []\n    steps = (["revoke"] if revoke_cut == 0 else []) + [x for k, op in enumerate(order, start=1)\n                                                        for x in ([op] + (["revoke"] if revoke_cut == k else []))]\n    for step in steps:\n        if step == "revoke":\n            ok_to_send["approved"] = False\n        elif step == "A":\n            ok_to_send["approved"] = True\n        elif step == "R":\n            ok_to_send["tainted"] = True\n        else:\n            for request in range(1, repetitions + 1):\n                if ok_to_send["approved"] and not ok_to_send["tainted"] and not ok_to_send["sent"]:\n                    sends.append({"request": request, "action": "emit", "payload": "PUBLIC"})\n                    outbox.append({"message_id": MESSAGE_ID, "payload": "PUBLIC"})\n                    ok_to_send["sent"] = True\n                elif ok_to_send["approved"] and not ok_to_send["tainted"]:\n                    sends.append({"request": request, "action": "dedup", "payload": None})\n                else:\n                    sends.append({"request": request, "action": "block", "payload": None})\n    return sends, outbox\n',
