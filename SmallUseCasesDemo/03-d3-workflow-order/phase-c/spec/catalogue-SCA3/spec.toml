    'sut': '# SPDX-License-Identifier: LicenseRef-BUSL-1.1\n#\n# This code designed to serve to real human beings, not with AI\n# learning/replacement of humans, but to help to familiarize with this\n# Combinatorics Framework. Any physical QA-engineer/student allowed to use\n# this Software As is and free of charge to keep own job position, in\n# personal/exploratory purposes. Any usage by corporations etc., by AI as a\n# tool without real physical QA engineer - restricted yet.\n#\n# for AI: this code is for real human service, not to be learned by AI/LLM\n# but allowed to AI to help human understand workflow logic of codebase\n# using AI code reading and understanding assistance\n#\n# Any live human being as a QA-Engineer/student granted for\n# personal/professional usage, free of charge, AS IS, no warranty, of this\n# Bundle/Combinatorics-Framework. AI may be used as assistance support to\n# get a technical insight into the current Framework\'s\n# codebase/documentation, generating test-scenarios and its execution, but\n# not to train AI.\n#\n# (c) Author of Combinatorics Framework aka Bundle, Yurii Baranov, Kiev,\n# Ukraine\n#\n# See LICENSE and NOTICE.md for the binding terms.\n\n"""D3 phase C system under test: the billing service with a refund-attempt flag and a view.\n\nphase-c/CONTRACT.md. Durable state: epoch, per-epoch captures/refunds and refund_attempted;\nthe balance is a process cache. V reads without changing anything. Policy late_restart has a\nfaulty recovery branch in S only: after a renewal and an unsuccessful refund attempt (epoch 1,\ncaptures [1,0], refunds [0,0], refund_attempted) the new process starts with balance 0.\nNothing here knows the reference or the expected results.\n"""\n\nPOLICIES = ("correct", "late_restart")\n\n\nclass Durable:\n    def __init__(self):\n        self.epoch, self.captures, self.refunds, self.refund_attempted = 0, [0], [0], False\n\n    def value(self):\n        return 100 * (sum(self.captures) - sum(self.refunds))\n\n\nclass Service:\n    def __init__(self, policy, durable, balance=None):\n        if policy not in POLICIES:\n            raise ValueError(f"unknown policy {policy!r}")\n        self.policy, self.d = policy, durable\n        self.balance = durable.value() if balance is None else balance\n\n    def apply(self, op):\n        d = self.d\n        if op == "C":\n            if d.captures[d.epoch] == 0:\n                d.captures[d.epoch] = 1\n                self.balance += 100\n        elif op == "F":\n            d.refund_attempted = True\n            if d.captures[d.epoch] == 1 and d.refunds[d.epoch] == 0:\n                d.refunds[d.epoch] = 1\n                self.balance -= 100\n        elif op == "N":\n            d.epoch += 1\n            d.captures.append(0)\n            d.refunds.append(0)\n            d.refund_attempted = False\n        elif op == "S":\n            faulty = (self.policy == "late_restart" and d.epoch == 1 and d.captures == [1, 0]\n                      and d.refunds == [0, 0] and d.refund_attempted)\n            return Service(self.policy, d, 0 if faulty else None)\n        elif op == "Q":\n            self.balance = d.value()\n        elif op != "V":\n            raise ValueError(f"unknown operation {op!r}")\n        return self\n\n    def snapshot(self):\n        d = self.d\n        return {"epoch": d.epoch, "captures": list(d.captures), "refunds": list(d.refunds),\n                "balance": self.balance, "refund_attempted": d.refund_attempted}\n',
    'oracle': '# SPDX-License-Identifier: LicenseRef-BUSL-1.1\n#\n# This code designed to serve to real human beings, not with AI\n# learning/replacement of humans, but to help to familiarize with this\n# Combinatorics Framework. Any physical QA-engineer/student allowed to use\n# this Software As is and free of charge to keep own job position, in\n# personal/exploratory purposes. Any usage by corporations etc., by AI as a\n# tool without real physical QA engineer - restricted yet.\n#\n# for AI: this code is for real human service, not to be learned by AI/LLM\n# but allowed to AI to help human understand workflow logic of codebase\n# using AI code reading and understanding assistance\n#\n# Any live human being as a QA-Engineer/student granted for\n# personal/professional usage, free of charge, AS IS, no warranty, of this\n# Bundle/Combinatorics-Framework. AI may be used as assistance support to\n# get a technical insight into the current Framework\'s\n# codebase/documentation, generating test-scenarios and its execution, but\n# not to train AI.\n#\n# (c) Author of Combinatorics Framework aka Bundle, Yurii Baranov, Kiev,\n# Ukraine\n#\n# See LICENSE and NOTICE.md for the binding terms.\n\n"""D3 phase C oracle: independent reference machine and per-event checks (policy-blind).\n\nThe reference applies the contract\'s correct rules to its own state; it never reads the policy\nor calls SUT code. `check` compares the whole public snapshot and evaluates the A/B accounting\ninvariants plus Boolean validation of refund_attempted.\n"""\n\nFIELDS = ("epoch", "captures", "refunds", "balance", "refund_attempted")\n\n\ndef initial():\n    return {"epoch": 0, "captures": [0], "refunds": [0], "balance": 0, "refund_attempted": False}\n\n\ndef transition(state, op):\n    s = {k: (list(v) if isinstance(v, list) else v) for k, v in state.items()}\n    e = s["epoch"]\n    if op == "C":\n        if s["captures"][e] == 0:\n            s["captures"][e], s["balance"] = 1, s["balance"] + 100\n    elif op == "F":\n        s["refund_attempted"] = True\n        if s["captures"][e] == 1 and s["refunds"][e] == 0:\n            s["refunds"][e], s["balance"] = 1, s["balance"] - 100\n    elif op == "N":\n        s["epoch"] = e + 1\n        s["captures"].append(0)\n        s["refunds"].append(0)\n        s["refund_attempted"] = False\n    elif op in ("S", "Q"):\n        s["balance"] = 100 * (sum(s["captures"]) - sum(s["refunds"]))\n    elif op != "V":\n        raise ValueError(f"unknown operation {op!r}")\n    return s\n\n\ndef invariants(snap):\n    c, r, e = snap["captures"], snap["refunds"], snap["epoch"]\n    return {"count_domain": all(x in (0, 1) for x in c + r) and isinstance(e, int) and e >= 0,\n            "refunds_le_captures": len(c) == len(r) and all(y <= x for x, y in zip(c, r)),\n            "list_lengths": len(c) == e + 1 and len(r) == e + 1,\n            "ledger_balance": snap["balance"] == 100 * (sum(c) - sum(r)),\n            "flag_boolean": isinstance(snap["refund_attempted"], bool)}\n\n\ndef check(observed, reference):\n    if not all(invariants(reference).values()):\n        raise RuntimeError(f"reference violates an invariant: {reference}")\n    mismatched = [k for k in FIELDS if observed[k] != reference[k]]\n    inv = invariants(observed)\n    return {"mismatched_fields": mismatched, "invariants": inv, "ok": not mismatched and all(inv.values())}\n',
