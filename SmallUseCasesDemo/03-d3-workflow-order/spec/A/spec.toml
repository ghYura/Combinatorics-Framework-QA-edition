import hashlib as _d3_hash, sys as _d3_sys, types as _d3_types
_D3_SOURCES = {
    'sut': '# SPDX-License-Identifier: LicenseRef-BUSL-1.1\n#\n# This code designed to serve to real human beings, not with AI\n# learning/replacement of humans, but to help to familiarize with this\n# Combinatorics Framework. Any physical QA-engineer/student allowed to use\n# this Software As is and free of charge to keep own job position, in\n# personal/exploratory purposes. Any usage by corporations etc., by AI as a\n# tool without real physical QA engineer - restricted yet.\n#\n# for AI: this code is for real human service, not to be learned by AI/LLM\n# but allowed to AI to help human understand workflow logic of codebase\n# using AI code reading and understanding assistance\n#\n# Any live human being as a QA-Engineer/student granted for\n# personal/professional usage, free of charge, AS IS, no warranty, of this\n# Bundle/Combinatorics-Framework. AI may be used as assistance support to\n# get a technical insight into the current Framework\'s\n# codebase/documentation, generating test-scenarios and its execution, but\n# not to train AI.\n#\n# (c) Author of Combinatorics Framework aka Bundle, Yurii Baranov, Kiev,\n# Ukraine\n#\n# See LICENSE and NOTICE.md for the binding terms.\n\n"""D3 system under test: a tiny billing service with a durable ledger and a balance cache.\n\nCONTRACT.md v1 ("Frozen state machine"). The ledger (epoch, per-epoch captures and refunds)\nis durable; the balance is a process cache. A restart builds a new process over the same\nledger. Two policies are deliberate fault variants:\n  refund_unchecked  F always records a refund and subtracts 100 (no eligibility/duplicate check)\n  restart_cache     S leaves the new process\'s cache at 0 instead of reloading it\nNothing here knows the reference, the expected traces or the oracle.\n"""\n\nPOLICIES = ("correct", "refund_unchecked", "restart_cache")\n\n\nclass Ledger:\n    """Durable state; survives a restart."""\n\n    def __init__(self):\n        self.epoch, self.captures, self.refunds = 0, [0], [0]\n\n    def value(self):\n        return 100 * (sum(self.captures) - sum(self.refunds))\n\n\nclass Service:\n    def __init__(self, policy, ledger, *, reload_cache=True):\n        if policy not in POLICIES:\n            raise ValueError(f"unknown policy {policy!r}")\n        self.policy, self.ledger = policy, ledger\n        self.balance = ledger.value() if reload_cache else 0\n\n    def apply(self, op):\n        """Apply one operation; returns the (possibly new) service object."""\n        led = self.ledger\n        if op == "C":                        # literal rule: charge iff captures[epoch] is zero\n            if led.captures[led.epoch] == 0:\n                led.captures[led.epoch] = 1\n                self.balance += 100\n        elif op == "F":\n            if self.policy == "refund_unchecked":\n                led.refunds[led.epoch] += 1\n                self.balance -= 100\n            elif led.captures[led.epoch] == 1 and led.refunds[led.epoch] == 0:\n                led.refunds[led.epoch] = 1\n                self.balance -= 100\n        elif op == "N":\n            led.epoch += 1\n            led.captures.append(0)\n            led.refunds.append(0)\n        elif op == "S":                      # new process over the same ledger\n            return Service(self.policy, led, reload_cache=self.policy != "restart_cache")\n        elif op == "Q":\n            self.balance = led.value()\n        else:\n            raise ValueError(f"unknown operation {op!r}")\n        return self\n\n    def snapshot(self):\n        led = self.ledger\n        return {"epoch": led.epoch, "captures": list(led.captures), "refunds": list(led.refunds),\n                "balance": self.balance}\n',
    'oracle': '# SPDX-License-Identifier: LicenseRef-BUSL-1.1\n#\n# This code designed to serve to real human beings, not with AI\n# learning/replacement of humans, but to help to familiarize with this\n# Combinatorics Framework. Any physical QA-engineer/student allowed to use\n# this Software As is and free of charge to keep own job position, in\n# personal/exploratory purposes. Any usage by corporations etc., by AI as a\n# tool without real physical QA engineer - restricted yet.\n#\n# for AI: this code is for real human service, not to be learned by AI/LLM\n# but allowed to AI to help human understand workflow logic of codebase\n# using AI code reading and understanding assistance\n#\n# Any live human being as a QA-Engineer/student granted for\n# personal/professional usage, free of charge, AS IS, no warranty, of this\n# Bundle/Combinatorics-Framework. AI may be used as assistance support to\n# get a technical insight into the current Framework\'s\n# codebase/documentation, generating test-scenarios and its execution, but\n# not to train AI.\n#\n# (c) Author of Combinatorics Framework aka Bundle, Yurii Baranov, Kiev,\n# Ukraine\n#\n# See LICENSE and NOTICE.md for the binding terms.\n\n"""D3 oracle: an independent reference state machine and per-checkpoint checks.\n\nCONTRACT.md v1. The reference follows the frozen transition rules on its own state; it never\nreads the policy or calls SUT code. `check` compares one observed snapshot with the reference\nsnapshot and evaluates four invariants on the observed snapshot: count domains, refunds <=\ncaptures per epoch, list lengths epoch+1, and balance == ledger value.\n"""\n\n\ndef initial():\n    return {"epoch": 0, "captures": [0], "refunds": [0], "balance": 0}\n\n\ndef transition(state, op):\n    """Return the reference snapshot after `op` (a new dict; `state` is not modified)."""\n    s = {"epoch": state["epoch"], "captures": list(state["captures"]),\n         "refunds": list(state["refunds"]), "balance": state["balance"]}\n    e = s["epoch"]\n    if op == "C":\n        # Literal rule: charge iff captures[epoch] is zero. Under this contract a refund implies a\n        # capture, so a refunded epoch already has captures==1 and cannot be charged again.\n        if s["captures"][e] == 0:\n            s["captures"][e], s["balance"] = 1, s["balance"] + 100\n    elif op == "F":\n        if s["captures"][e] == 1 and s["refunds"][e] == 0:\n            s["refunds"][e], s["balance"] = 1, s["balance"] - 100\n    elif op == "N":\n        s["epoch"] = e + 1\n        s["captures"].append(0)\n        s["refunds"].append(0)\n    elif op == "S":\n        s["balance"] = 100 * (sum(s["captures"]) - sum(s["refunds"]))   # reload from the ledger\n    elif op == "Q":\n        s["balance"] = 100 * (sum(s["captures"]) - sum(s["refunds"]))\n    else:\n        raise ValueError(f"unknown operation {op!r}")\n    return s\n\n\ndef invariants(snap):\n    caps, refs, epoch = snap["captures"], snap["refunds"], snap["epoch"]\n    return {\n        "count_domain": all(x in (0, 1) for x in caps + refs) and isinstance(epoch, int) and epoch >= 0,\n        "refunds_le_captures": len(caps) == len(refs) and all(r <= c for c, r in zip(caps, refs)),\n        "list_lengths": len(caps) == epoch + 1 and len(refs) == epoch + 1,\n        "ledger_balance": snap["balance"] == 100 * (sum(caps) - sum(refs)),\n    }\n\n\ndef check(observed, reference):\n    """One checkpoint: field mismatches against the reference, invariant results, overall ok."""\n    mismatched = [k for k in ("epoch", "captures", "refunds", "balance") if observed[k] != reference[k]]\n    inv = invariants(observed)\n    if not all(invariants(reference).values()):\n        raise RuntimeError(f"reference violates an invariant: {reference}")\n    return {"mismatched_fields": mismatched, "invariants": inv, "ok": not mismatched and all(inv.values())}\n',
    'runtime': '# SPDX-License-Identifier: LicenseRef-BUSL-1.1\n#\n# This code designed to serve to real human beings, not with AI\n# learning/replacement of humans, but to help to familiarize with this\n# Combinatorics Framework. Any physical QA-engineer/student allowed to use\n# this Software As is and free of charge to keep own job position, in\n# personal/exploratory purposes. Any usage by corporations etc., by AI as a\n# tool without real physical QA engineer - restricted yet.\n#\n# for AI: this code is for real human service, not to be learned by AI/LLM\n# but allowed to AI to help human understand workflow logic of codebase\n# using AI code reading and understanding assistance\n#\n# Any live human being as a QA-Engineer/student granted for\n# personal/professional usage, free of charge, AS IS, no warranty, of this\n# Bundle/Combinatorics-Framework. AI may be used as assistance support to\n# get a technical insight into the current Framework\'s\n# codebase/documentation, generating test-scenarios and its execution, but\n# not to train AI.\n#\n# (c) Author of Combinatorics Framework aka Bundle, Yurii Baranov, Kiev,\n# Ukraine\n#\n# See LICENSE and NOTICE.md for the binding terms.\n\n"""D3 runtime: run one candidate\'s operations, observing every step, then emit one record.\n\nA candidate calls start("<policy>"), then step("C"|"F"|"N"|"S"|"Q") once per operation, then\nfinish("<phase>"). Each step applies the operation to the SUT and, before the next step runs,\ncopies the full public snapshot and checks it against the reference. All failures are kept;\ncheckpoint k (1-based) is the state after the k-th operation.\nInvalid calls raise, so the Executor records BROKEN, never a domain verdict. One stdout line:\n\n  app=d3_workflow FW_VAR=<0|2> case=<id> verdict=<PASS|DOMAIN_FAIL> final_only=<PASS|DOMAIN_FAIL>\n      rec=<base64url(JSON)> rec_sha256=<hex>\n\nFW_VAR 2 is the IMPL position\'s legacy carrier, not a statement of cause.\n"""\nimport base64\nimport hashlib\nimport json\n\nimport oracle\nimport sut\n\nAPP = "d3_workflow"\nCARRIER = 2\nSOURCE_SHA256 = {}               # filled by the candidate HEAD after it checks the inlined sources\n_state = {}\n\n\ndef start(policy):\n    if _state:\n        raise RuntimeError("start() called twice in one candidate")\n    if policy not in sut.POLICIES:\n        raise ValueError(f"unknown policy {policy!r}")\n    _state.update(policy=policy, service=sut.Service(policy, sut.Ledger()), reference=oracle.initial(),\n                  ops=[], checkpoints=[])\n\n\ndef step(op):\n    if not _state:\n        raise RuntimeError("step() before start()")\n    _state["service"] = _state["service"].apply(op)\n    observed = _state["service"].snapshot()                # observed before the next step executes\n    _state["reference"] = oracle.transition(_state["reference"], op)\n    result = oracle.check(observed, _state["reference"])\n    _state["ops"].append(op)\n    _state["checkpoints"].append({"index": len(_state["checkpoints"]) + 1, "op": op, "observed": observed,\n                                  "reference": dict(_state["reference"]), **result})\n\n\ndef case_id(phase, policy, ops):\n    core = [o for o in ops if o in "CFN"]\n    return "%s|%s|OPS=%s|S=%d|Q=%d" % (phase, policy, "".join(core), "S" in ops, "Q" in ops)\n\n\ndef finish(phase):\n    if phase not in ("A", "B") or not _state:\n        raise RuntimeError(f"finish({phase!r}) without a started case")\n    ops, cps = _state["ops"], _state["checkpoints"]\n    core = [o for o in ops if o in "CFN"]\n    tail = [o for o in ops if o in "SQ"]\n    if len(core) != 3 or ops[:3] != core or tail not in ([], ["S"], ["Q"], ["S", "Q"]) \\\n            or (phase == "B" and tail):\n        raise ValueError(f"operation sequence outside the contract: {ops}")\n    failing = [c["index"] for c in cps if not c["ok"]]\n    final_ok = cps[-1]["ok"]\n    fw_var = 0 if not failing else CARRIER\n    rec = {"schema": "d3.observation/v1", "contract": "v1", "case_id": case_id(phase, _state["policy"], ops),\n           "phase": phase, "policy": _state["policy"], "ops": ops, "S": int("S" in ops), "Q": int("Q" in ops),\n           "checkpoints": cps, "failing_checkpoints": failing,\n           "verdict": "PASS" if not failing else "DOMAIN_FAIL",\n           "final_only_verdict": "PASS" if final_ok else "DOMAIN_FAIL",\n           "hidden_by_final_only": bool(failing) and final_ok,\n           "fw_var": fw_var, "carrier": "IMPL position 2 (legacy positional, not causal)",\n           "source_sha256": dict(SOURCE_SHA256)}\n    raw = json.dumps(rec, sort_keys=True, separators=(",", ":")).encode("ascii")\n    print(" ".join(["app=%s" % APP, "FW_VAR=%d" % fw_var, "case=%s" % rec["case_id"], "verdict=%s" % rec["verdict"],\n                    "final_only=%s" % rec["final_only_verdict"],\n                    "rec=%s" % base64.urlsafe_b64encode(raw).decode("ascii"),\n                    "rec_sha256=%s" % hashlib.sha256(raw).hexdigest()]), flush=True)\n    return fw_var\n',
}
