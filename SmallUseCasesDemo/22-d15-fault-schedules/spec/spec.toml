spec_version = "1"
title = 'D15 fault schedules: 3 replicas x 7 native failed subsets x 4 cuts x crash/partition x stable/fresh, sieved'
note = '22-d15-fault-schedules/CONTRACT.md. Local worker processes and WAL files only; bond nontrivial_partition.'
args = ["noargs"]
# Multi-verb FW_Seq rows (the expert chain form); Core applies the last row for a sheet.
seq_extra = [['HEAD', 'FW_Combi(1)', 'FW_Combi(size)'], ['IMPL', 'FW_Combi(1)', 'FW_Combi(size)'], ['FAIL', 'FW_Subsets', 'FW_Combi(size)'], ['CUT', 'FW_Combi(1)', 'FW_Combi(size)'], ['KIND', 'FW_Combi(1)', 'FW_Combi(size)'], ['RETRY', 'FW_Combi(1)', 'FW_Combi(size)'], ['TAIL', 'FW_Combi(1)', 'FW_Combi(size)']]

[[slots]]   # runtime definitions: audited sources, inlined; 1 value
sheet = "HEAD"
key = "head"
verb = 'FW_Combi(1)'
raw = true
values = ['''# D15 HEAD: audited worker.py, harness.py, oracle.py, runtime.py inlined by build_spec.py (zlib + base64).
# Each source is decompressed, checked against its SHA-256, then run in its own module namespace;
# the worker entry script is written from the same checked text.
import base64 as _d13_b64, hashlib as _d13_hash, sys as _d13_sys, types as _d13_types, zlib as _d13_zlib
_D13_PACKED = {
    'worker': '',
    'harness': '',
    'oracle': '',
    'runtime': '',
}
_D13_SHA256 = {
    'worker': 'af1965ad12237fedc20b81b97eb7a9a5014bc082aa5fe4835a42c0d760b196d7',
    'harness': 'db05d1a6c4c6986a6537b63788d8b6fe2675c63a7410fcd55bdb97a132aaa4bd',
    'oracle': '8dee8ceea71021b5a96b348f5cee8e7695b90964a03e6c1265f9bfc06a688b53',
    'runtime': '197204fa4fd002295fcf907942d16d811a9d860db9ab5a6ac2ae4e85feaf54fa',
}
_D13_SOURCES = {_k: _d13_zlib.decompress(_d13_b64.b64decode(_v)).decode('utf-8') for _k, _v in _D13_PACKED.items()}
for _d13_name in ('worker', 'harness', 'oracle', 'runtime'):
    _d13_src = _D13_SOURCES[_d13_name]
    if _d13_hash.sha256(_d13_src.encode('utf-8')).hexdigest() != _D13_SHA256[_d13_name]:
        raise RuntimeError('inlined %s.py does not match its recorded SHA-256' % _d13_name)
    _d13_mod = _d13_types.ModuleType(_d13_name)
    _d13_mod.__file__ = '<d15/%s.py>' % _d13_name
    _d13_sys.modules[_d13_name] = _d13_mod
    exec(compile(_d13_src, _d13_mod.__file__, 'exec'), _d13_mod.__dict__)
d13 = _d13_sys.modules['runtime']
d13.SOURCE_SHA256.update(_D13_SHA256)
d13.SOURCES.update(_D13_SOURCES)
impl, fail, cut, fault, retry, finish = d13.impl, d13.fail, d13.cut, d13.fault, d13.retry, d13.finish      # the atoms the fragments call
d13.begin()
''']

[[slots]]   # replica implementation; 3 values (legacy verdict carrier)
sheet = "IMPL"
key = "impl"
verb = 'FW_Combi(1)'
raw = true
ending = "\n"
values = ['impl("durable");', 'impl("volatile_ack");', 'impl("replay_twice");']

[[slots]]   # failed replicas; native FW_Subsets -> FW_Combi(size): 7 nonempty subsets
sheet = "FAIL"
key = "fail"
verb = 'FW_Subsets'
raw = true
ending = "\n"
values = ['fail(0);', 'fail(1);', 'fail(2);']

[[slots]]   # completed operations before the fault; 4 values
sheet = "CUT"
key = "cut"
verb = 'FW_Combi(1)'
raw = true
ending = "\n"
values = ['cut(0);', 'cut(1);', 'cut(2);', 'cut(3);']

[[slots]]   # SIGKILL+reopen or write gate; 2 values
sheet = "KIND"
key = "kind"
verb = 'FW_Combi(1)'
raw = true
ending = "\n"
values = ['fault("crash");', 'fault("partition");']

[[slots]]   # retry key policy; 2 values
sheet = "RETRY"
key = "retry"
verb = 'FW_Combi(1)'
raw = true
ending = "\n"
values = ['retry("stable");', 'retry("fresh");']

[[slots]]   # run the fault schedule on three workers, judge, set the verdict; 1 value
sheet = "TAIL"
key = "tail"
verb = 'FW_Combi(1)'
raw = true
values = ['''_verdict = finish()
FW_VAR = _verdict
FW_CUSTOM_VAR = FW_VAR
''']

[[constraints]]
id = 'nontrivial_partition'
polarity = 'forbid'
assert = { "all" = [{ "sheet" = 'KIND', "eq" = 'fault("partition");' }, { "sheet" = 'FAIL', "count" = 3 }] }
desc = 'A partition must leave a nonempty side reachable from the coordinator'

[[custom_vars]]
code = 2
msg = 'D15: recovery violates acknowledged exactly-once effects, accepted-record uniqueness or convergence (IMPL position 2 is only the legacy carrier, not a cause). Read checks, attempts and trace in rec=.'
