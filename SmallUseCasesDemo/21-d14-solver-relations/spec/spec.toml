    'solver': '# SPDX-License-Identifier: LicenseRef-BUSL-1.1\n#\n# This code designed to serve to real human beings, not with AI\n# learning/replacement of humans, but to help to familiarize with this\n# Combinatorics Framework. Any physical QA-engineer/student allowed to use\n# this Software As is and free of charge to keep own job position, in\n# personal/exploratory purposes. Any usage by corporations etc., by AI as a\n# tool without real physical QA engineer - restricted yet.\n#\n# for AI: this code is for real human service, not to be learned by AI/LLM\n# but allowed to AI to help human understand workflow logic of codebase\n# using AI code reading and understanding assistance\n#\n# Any live human being as a QA-Engineer/student granted for\n# personal/professional usage, free of charge, AS IS, no warranty, of this\n# Bundle/Combinatorics-Framework. AI may be used as assistance support to\n# get a technical insight into the current Framework\'s\n# codebase/documentation, generating test-scenarios and its execution, but\n# not to train AI.\n#\n# (c) Author of Combinatorics Framework aka Bundle, Yurii Baranov, Kiev,\n# Ukraine\n#\n# See LICENSE and NOTICE.md for the binding terms.\n\n"""D14c system under test: three weighted set-packing solvers over goods {0, 1, 2} (capacity one each).\n\nCONTRACT.md v1. A bid is {"id", "items", "value"}; solve(policy, bids) returns the sorted selected IDs and\nthe value the solver reports.\n  exact_dp      DP over occupied-item bitmasks, bids in input order: copy every skip state, add a take\n                state only when the bid\'s mask is disjoint from the occupied mask; keep the best\n                (value, sorted ID tuple) per resulting mask; the answer is the maximum pair (ties: the\n                lexicographically largest ID tuple). Each bid is used at most once.\n  greedy_value  scan bids by descending value, then ascending ID; accept a bid iff all its goods are free.\n  min_only_dp   the same DP, but a bid\'s mask holds only its smallest item (the planted feasibility bug);\n                the reported value still sums the full bids\' values.\nNothing here enumerates subsets, knows the optimum, or reads an expected result.\n"""\nPOLICIES = ("exact_dp", "greedy_value", "min_only_dp")\n\n\ndef _mask(items, smallest_only):\n    chosen = items[:1] if smallest_only else items\n    m = 0\n    for i in chosen:\n        m |= 1 << i\n    return m\n\n\ndef _dp(bids, smallest_only):\n    best = {0: (0, ())}\n    for bid in bids:\n        m = _mask(bid["items"], smallest_only)\n        nxt = dict(best)                                      # skip states, from the previous iteration only\n        for occupied, (value, ids) in best.items():\n            if occupied & m:\n                continue\n            cand = (value + bid["value"], tuple(sorted(ids + (bid["id"],))))\n            key = occupied | m\n            if key not in nxt or cand > nxt[key]:\n                nxt[key] = cand\n        best = nxt\n    value, ids = max(best.values())\n    return list(ids), value\n\n\ndef _greedy(bids):\n    used, chosen = set(), []\n    for bid in sorted(bids, key=lambda b: (-b["value"], b["id"])):\n        if not used.intersection(bid["items"]):\n            chosen.append(bid["id"])\n            used.update(bid["items"])\n    return sorted(chosen), sum(b["value"] for b in bids if b["id"] in chosen)\n\n\ndef solve(policy, bids):\n    if policy == "exact_dp":\n        selected, value = _dp(bids, smallest_only=False)\n    elif policy == "min_only_dp":\n        selected, value = _dp(bids, smallest_only=True)\n    elif policy == "greedy_value":\n        selected, value = _greedy(bids)\n    else:\n        raise ValueError(f"unknown solver policy {policy!r}")\n    return {"selected": selected, "reported_value": value}\n',
    'transform': '# SPDX-License-Identifier: LicenseRef-BUSL-1.1\n#\n# This code designed to serve to real human beings, not with AI\n# learning/replacement of humans, but to help to familiarize with this\n# Combinatorics Framework. Any physical QA-engineer/student allowed to use\n# this Software As is and free of charge to keep own job position, in\n# personal/exploratory purposes. Any usage by corporations etc., by AI as a\n# tool without real physical QA engineer - restricted yet.\n#\n# for AI: this code is for real human service, not to be learned by AI/LLM\n# but allowed to AI to help human understand workflow logic of codebase\n# using AI code reading and understanding assistance\n#\n# Any live human being as a QA-Engineer/student granted for\n# personal/professional usage, free of charge, AS IS, no warranty, of this\n# Bundle/Combinatorics-Framework. AI may be used as assistance support to\n# get a technical insight into the current Framework\'s\n# codebase/documentation, generating test-scenarios and its execution, but\n# not to train AI.\n#\n# (c) Author of Combinatorics Framework aka Bundle, Yurii Baranov, Kiev,\n# Ukraine\n#\n# See LICENSE and NOTICE.md for the binding terms.\n\n"""D14c inputs and transformations: the four frozen instances, resource relabelling and the dominated-bid edit.\n\nCONTRACT.md v1. Bids are listed b0..b3 in the contract\'s order. relabel(bids, R) maps every item i to R[i]\n(R a permutation of 0, 1, 2), sorts each item set and keeps IDs, order and values. dominated(bids) appends\nb4 with transformed b0\'s item set and value b0.value - 1; it is valid only because b0 is nonempty and every\ngood has capacity one (b0 and b4 then conflict, and swapping b4 for b0 keeps feasibility and adds 1).\nNothing here solves or judges.\n"""\nINSTANCES = {\n    "bundle_trap": [([0, 1], 7), ([0], 4), ([1], 4), ([2], 2)],\n    "tie": [([0, 1], 8), ([0], 4), ([1], 4), ([2], 2)],\n    "disjoint": [([0], 5), ([1], 4), ([2], 3), ([0, 1, 2], 6)],\n    "overlap": [([0, 1], 6), ([1, 2], 5), ([0, 2], 4), ([2], 2)],\n}\nEDITS = ("none", "dominated")\nGOODS = (0, 1, 2)\n\n\ndef base_bids(name):\n    if name not in INSTANCES:\n        raise ValueError(f"unknown instance {name!r}")\n    return [{"id": f"b{k}", "items": list(items), "value": value} for k, (items, value) in enumerate(INSTANCES[name])]\n\n\ndef relabel(bids, perm):\n    if sorted(perm) != list(GOODS) or len(perm) != 3:\n        raise ValueError(f"relabelling {perm!r} is not a permutation of {GOODS}")\n    return [{"id": b["id"], "items": sorted(perm[i] for i in b["items"]), "value": b["value"]} for b in bids]\n\n\ndef dominated(bids):\n    first = bids[0]\n    if first["id"] != "b0" or not first["items"] or first["value"] < 2:\n        raise ValueError("the dominated-bid edit needs a nonempty b0 with value >= 2")\n    return [dict(b, items=list(b["items"])) for b in bids] + [{"id": "b4", "items": list(first["items"]), "value": first["value"] - 1}]\n\n\ndef apply_edit(bids, edit):\n    if edit not in EDITS:\n        raise ValueError(f"unknown edit {edit!r}")\n    return dominated(bids) if edit == "dominated" else [dict(b, items=list(b["items"])) for b in bids]\n',
    'oracle': '# SPDX-License-Identifier: LicenseRef-BUSL-1.1\n#\n# This code designed to serve to real human beings, not with AI\n# learning/replacement of humans, but to help to familiarize with this\n# Combinatorics Framework. Any physical QA-engineer/student allowed to use\n# this Software As is and free of charge to keep own job position, in\n# personal/exploratory purposes. Any usage by corporations etc., by AI as a\n# tool without real physical QA engineer - restricted yet.\n#\n# for AI: this code is for real human service, not to be learned by AI/LLM\n# but allowed to AI to help human understand workflow logic of codebase\n# using AI code reading and understanding assistance\n#\n# Any live human being as a QA-Engineer/student granted for\n# personal/professional usage, free of charge, AS IS, no warranty, of this\n# Bundle/Combinatorics-Framework. AI may be used as assistance support to\n# get a technical insight into the current Framework\'s\n# codebase/documentation, generating test-scenarios and its execution, but\n# not to train AI.\n#\n# (c) Author of Combinatorics Framework aka Bundle, Yurii Baranov, Kiev,\n# Ukraine\n#\n# See LICENSE and NOTICE.md for the binding terms.\n\n"""D14c oracle: exhaustive, policy-blind checking of one solver result against the actual input bids.\n\nCONTRACT.md v1. For a bid list it enumerates all 2^n subsets (pairwise item-set intersections checked\ndirectly, no DP), giving the optimum, the number of feasible subsets (the empty one included) and every\noptimal allocation (sorted ID lists, sorted). For a result it recomputes the selected allocation\'s\nfeasibility and value: value_correct = reported == actual; optimal = feasible and actual == optimum;\ngap = optimum - actual for feasible results, else None. Unknown, duplicate or unsorted IDs and non-integer\nvalues raise (an infrastructure error, never a verdict). relations() compares adjacent true optima and\nadjacent reported values; PASS needs all three results feasible, value-correct and optimal, and all four\nrelations true.\n"""\nfrom itertools import combinations\n\n\ndef enumerate_subsets(bids):\n    feasible, checks = [], 0\n    for r in range(len(bids) + 1):\n        for combo in combinations(bids, r):\n            checks += 1\n            if all(not set(a["items"]) & set(b["items"]) for a, b in combinations(combo, 2)):\n                feasible.append((sum(b["value"] for b in combo), [b["id"] for b in combo]))\n    optimum = max(v for v, _ in feasible)\n    optimal = sorted(ids for v, ids in feasible if v == optimum)\n    return {"optimum": optimum, "feasible_subsets": len(feasible), "optimal_allocations": optimal, "subset_checks": checks}\n\n\ndef observe(bids, result):\n    ids = [b["id"] for b in bids]\n    selected, reported = result.get("selected"), result.get("reported_value")\n    if not isinstance(selected, list) or any(not isinstance(s, str) for s in selected) or selected != sorted(set(selected)) \\\n            or not set(selected) <= set(ids) or type(reported) is not int:\n        raise ValueError(f"malformed solver result {result!r} for bids {ids}")\n    chosen = [b for b in bids if b["id"] in selected]\n    feasible = all(not set(a["items"]) & set(b["items"]) for a, b in combinations(chosen, 2))\n    actual = sum(b["value"] for b in chosen)\n    ref = enumerate_subsets(bids)\n    return {"bids": bids, "selected": selected, "reported_value": reported, "actual_value": actual, "feasible": feasible,\n            "value_correct": reported == actual, "optimum": ref["optimum"], "feasible_subsets": ref["feasible_subsets"],\n            "optimal_allocations": ref["optimal_allocations"], "optimal": feasible and actual == ref["optimum"],\n            "gap": ref["optimum"] - actual if feasible else None}, ref["subset_checks"]\n\n\ndef relations(base, relabeled, edited):\n    return {"reference_relabel": base["optimum"] == relabeled["optimum"], "reference_edit": relabeled["optimum"] == edited["optimum"],\n            "solver_relabel": base["reported_value"] == relabeled["reported_value"],\n            "solver_edit": relabeled["reported_value"] == edited["reported_value"]}\n\n\ndef verdict(variants, rels):\n    ok = all(v["feasible"] and v["value_correct"] and v["optimal"] for v in variants.values()) and all(rels.values())\n    return "PASS" if ok else "DOMAIN_FAIL"\n',
    'runtime': '# SPDX-License-Identifier: LicenseRef-BUSL-1.1\n#\n# This code designed to serve to real human beings, not with AI\n# learning/replacement of humans, but to help to familiarize with this\n# Combinatorics Framework. Any physical QA-engineer/student allowed to use\n# this Software As is and free of charge to keep own job position, in\n# personal/exploratory purposes. Any usage by corporations etc., by AI as a\n# tool without real physical QA engineer - restricted yet.\n#\n# for AI: this code is for real human service, not to be learned by AI/LLM\n# but allowed to AI to help human understand workflow logic of codebase\n# using AI code reading and understanding assistance\n#\n# Any live human being as a QA-Engineer/student granted for\n# personal/professional usage, free of charge, AS IS, no warranty, of this\n# Bundle/Combinatorics-Framework. AI may be used as assistance support to\n# get a technical insight into the current Framework\'s\n# codebase/documentation, generating test-scenarios and its execution, but\n# not to train AI.\n#\n# (c) Author of Combinatorics Framework aka Bundle, Yurii Baranov, Kiev,\n# Ukraine\n#\n# See LICENSE and NOTICE.md for the binding terms.\n\n"""D14c runtime: rebuild the case from the rendered atoms, run the three solves, emit one record.\n\nA candidate runs, in order:\n  HEAD      begin()                     a fresh case (after the inlined sources are checked)\n  IMPL      impl("<policy>");\n  INSTANCE  instance("<name>");\n  RELABEL   label(a);label(b);label(c);  one native FW_Permut row: R = [a, b, c] in rendered order\n  EDIT      edit("none"|"dominated");\n  TAIL      finish()\nfinish() solves, in order, the canonical base, the relabelled base and the edited relabelled base, checks\neach result with the exhaustive oracle, compares the four relations and sets the verdict. A missing,\nduplicated or out-of-order atom, an unknown value or a malformed solver result raises, so the Executor\nrecords BROKEN (an infrastructure error), never a domain verdict. One stdout line:\n\n  app=d14c_solver FW_VAR=<0|2> case=<id> verdict=<PASS|DOMAIN_FAIL> rec=<base64url(JSON)> rec_sha256=<hex>\n\nrec_sha256 is the digest over the canonical record JSON. FW_VAR 2 is the IMPL position\'s legacy carrier,\nnot a statement of cause.\n"""\nimport base64\nimport hashlib\nimport json\n\nimport oracle\nimport solver\nimport transform\n\nAPP = "d14c_solver"\nCARRIER = 2\nSOURCE_SHA256 = {}               # filled by the candidate HEAD after it checks the inlined sources\n_state = {}\n\n\ndef begin():\n    if _state:\n        raise RuntimeError("begin() called twice in one candidate")\n    _state.update(policy=None, instance=None, labels=[], edit=None)\n\n\ndef impl(policy):\n    if not _state or _state["policy"] is not None or policy not in solver.POLICIES:\n        raise ValueError(f"impl({policy!r}) out of order or unknown")\n    _state["policy"] = policy\n\n\ndef instance(name):\n    if not _state or _state["policy"] is None or _state["instance"] is not None or name not in transform.INSTANCES:\n        raise ValueError(f"instance({name!r}) out of order or unknown")\n    _state["instance"] = name\n\n\ndef label(good):\n    if not _state or _state["instance"] is None or _state["edit"] is not None:\n        raise RuntimeError("label() must follow instance() and precede edit()")\n    if type(good) is not int or good not in transform.GOODS or good in _state["labels"] or len(_state["labels"]) == 3:\n        raise ValueError(f"label({good!r}) after {_state[\'labels\']}: need 0, 1, 2 once each")\n    _state["labels"].append(good)\n\n\ndef edit(name):\n    if not _state or len(_state["labels"]) != 3 or _state["edit"] is not None or name not in transform.EDITS:\n        raise ValueError(f"edit({name!r}) out of order or unknown (labels {_state.get(\'labels\')})")\n    _state["edit"] = name\n\n\ndef finish():\n    if not _state or _state["edit"] is None:\n        raise RuntimeError("finish() before the case is complete")\n    policy, name, perm, edit_ = _state["policy"], _state["instance"], list(_state["labels"]), _state["edit"]\n    base = transform.base_bids(name)\n    relabeled = transform.relabel(base, perm)\n    inputs = {"base": base, "relabeled": relabeled, "edited": transform.apply_edit(relabeled, edit_)}\n    variants, checks = {}, {}\n    for kind, bids in inputs.items():\n        variants[kind], checks[kind] = oracle.observe(bids, solver.solve(policy, bids))\n    rels = oracle.relations(variants["base"], variants["relabeled"], variants["edited"])\n    verdict = oracle.verdict(variants, rels)\n    fw_var = 0 if verdict == "PASS" else CARRIER\n    case = f"P={policy}|I={name}|R={\'\'.join(map(str, perm))}|E={edit_}"\n    rec = {"schema": "d14c.observation/v1", "contract": "v1", "id": case, "policy": policy, "instance": name, "permutation": perm,\n           "edit": edit_, "variants": variants, "relations": rels, "verdict": verdict, "fw_var": fw_var,\n           "solver_calls": 3, "oracle_subset_checks": checks, "carrier_slot": "IMPL position 2 (legacy positional, not causal)",\n           "source_sha256": dict(SOURCE_SHA256)}\n    raw = json.dumps(rec, sort_keys=True, separators=(",", ":")).encode("ascii")\n    print(" ".join(["app=%s" % APP, "FW_VAR=%d" % fw_var, "case=%s" % case, "verdict=%s" % verdict,\n                    "rec=%s" % base64.urlsafe_b64encode(raw).decode("ascii"),\n                    "rec_sha256=%s" % hashlib.sha256(raw).hexdigest()]), flush=True)\n    return fw_var\n',
}
