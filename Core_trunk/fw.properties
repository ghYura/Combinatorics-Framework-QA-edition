# C3P0 connection pool sizing (REFACTOR7)
# All keys are optional — defaults apply when absent.
#
# [Iter3.1] Bumped from the hardcoded defaults (min=2, max=3) for the workload
# observed in this engine: ~67 sheets × parallel chunks each potentially issuing
# COPY-IN against the same main DbClient.  With maxSize=3 the copyGate cap was
# 3 system-wide; bumping to 8 widens that to 8 concurrent COPY ops without
# overrunning PostgreSQL's default max_connections=100 (main 8 + slot 12×2=24 +
# Hibernate 20 = 52 peak).
db.pool.minSize=2
db.pool.maxSize=8
db.pool.acquireIncrement=2
db.pool.maxStatements=0
# [REFACTOR18] Max simultaneous COPY FROM STDIN operations (default 4).
# Limits how many virtual threads can execute PostgreSQL COPY concurrently.
# Effective ceiling at runtime: min(maxConcurrentCopies, maxSize).
db.pool.maxConcurrentCopies=6

#<29042026 Issue1+Issue2>
# Auxiliary-data auto-generation for incomplete input XLSX files (e.g. test14042026v2.xlsx).
# Each flag is independent and defaults to the value below if missing.
#
# When 'true', WorkbookParser pre-scans 'FW_Seq' (after the main parse) and:
#   - registers an empty virtual data sheet for every name referenced in 'FW_Seq'
#     (column-0 cell or inside an 'FW_(...)' operand position) that has no real
#     Excel sheet (e.g. v2 references 'E1E2_6' but the sheet is missing).
#   - synthesises a virtual target sheet name for every headless 'FW_Seq' row
#     (a row whose first non-blank cell already starts with 'FW_'). The
#     synthesised name uses the prefix configured by 'workbook.virtualSheetNamePrefix'.
workbook.autoGenerateMissingSheetsFromFwSeq=true

# When 'true', MainRefactored.writeSheetNames augments the 'names' DB table by
# inserting a synthetic empty entry (sheet, '', '') for every data sheet that is
# NOT covered by the 'FW_SheetNames' control sheet — including virtual sheets
# generated above. Also covers the case where 'FW_SheetNames' itself is missing
# from the workbook entirely (universal workaround).
workbook.autoGenerateMissingFwSheetNames=true

# Prefix for synthesised target sheet names of headless 'FW_Seq' rows.
# The full name becomes <prefix><1-based-row-index>, e.g. 'FW_VIRTUAL_15'.
workbook.virtualSheetNamePrefix=FW_VIRTUAL_

# When 'true', SeqParser resets the per-row sheet-name tracker so that a
# headless row no longer inherits the previous row's target (which would
# overwrite the previous row's directive list). For a headless row the
# synthesised virtual target (see 'workbook.virtualSheetNamePrefix') is used.
seq.headlessRowsAutoSynthesizeTarget=true

# When 'true', SeqParser and BraceOperationHandler tolerate nested 'FW_()'
# operands inside an outer 'FW_(...)' directive at the excluded1/excluded2
# slots. Resolution rule:
#   - the FIRST nested 'FW_()' (excluded1 slot) → most-recent prior FW_( row's target
#   - the SECOND nested 'FW_()' (excluded2 slot) → second-most-recent prior FW_( row's target
# Either slot may also be a literal 'ParticularSheetName', mixed with the other
# slot being a nested FW_(): 'FW_(.. FW_() .. ParticularSheetName ..)' or
# 'FW_(.. ParticularSheetName .. FW_() ..)'.
seq.nestedFwBraceEnabled=true
#</29042026 Issue1+Issue2>

# ─── [Iter4] Precompute decision mode for end-to-end pipeline ───
# Controls whether the full pipeline (intermediates + finals) runs in pure JVM
# heap or via PostgreSQL.  Final tables (fw_final_base, fw_final_base_copy,
# fw_final, fw_opt<i>) always COPY to PG regardless — this only decides where
# the INTERMEDIATE work happens.
#
#   auto   (default) — Layer 1 estimator walks SeqParseResult, computes
#                       pessimistic upper-bound bytes per output table, and
#                       picks JAVA when peak × safety ≤ heap budget (0.65 × -Xmx).
#                       OS-free-RAM is reported as a -Xmx-bump hint when DB is
#                       chosen because heap was tight.
#   java               — force pure-Java end-to-end.  No intermediate PG tables;
#                       fw_/fw2_ live in JVM heap only.  core.intermediate.storage
#                       is IGNORED in this mode.  OOM on first overflow if data
#                       doesn't fit (no silent fall-back when explicitly requested).
#   db                 — force legacy PG-way.  core.intermediate.storage controls
#                       fw_/fw2_ storage (pg or memory) independently.
#
# Aliases: jvm / memory → java; pg / postgres / postgresql → db.
core.precompute=pg

# ─── [Iter2] Intermediate-table storage mode ───
# Controls where per-sheet intermediate tables (fw_<key>, fw2_<key>) live during
# a run.  Final tables (fw_final, fw_opt<i>) always go to PostgreSQL regardless.
#
#   pg     (default) — intermediates as PostgreSQL UNLOGGED tables, current
#                       byte-identical behaviour.  Persistent across crashes (to
#                       the extent UNLOGGED PG tables are), readable by external
#                       Reader process while a run is in progress.
#   memory             — intermediates in JVM heap.  Eliminates per-sheet COPY /
#                       SELECT round-trips and the between-directive DROP+CREATE
#                       cycle, accelerating small/medium workbooks.  Memory cost
#                       ~ rows × cells × 2 bytes (short) + ArrayList overhead;
#                       monitor heap on very large workbooks.  External Reader
#                       cannot see intermediates mid-run.
#
# Aliases accepted: "java", "mem", "in-memory" → memory; "postgres", "postgresql" → pg.
core.intermediate.storage=postgres

# ─── Tier-3.5: closed-loop feedback ingestion (Master mode) ───
# When the previous iteration's Analyzer wrote a BundleSeed JSON to disk
# (Reader-bridge property fw.analyzer.seedOutputPath), MainRefactored loads
# it here and logs winners + observedRanges + declaredMetrics.  Future
# Tier-3.5 follow-ups plug narrowing / elitism strategies on top of the
# loaded seed (com.company.bundle.BundleSeedAdapter accessors).
# Schema-compatible with com.yurii.analyzer.core.optimization.BundleSeed
