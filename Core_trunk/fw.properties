# Empty path → no-op, byte-for-byte identical legacy behaviour.
#core.seed.inputPath=/tmp/bundle_seeds.json

# ─── Tier-3.5: ParsedWorkbook → JSON dump (Master mode plumbing) ───
# After Core finishes parsing the input schedule (XLSX / JSON / YAML / TOML /
# Programmatic), it dumps the canonical ParsedWorkbook as a JSON sibling
# next to the input file in the schema com.company.excel.JsonScheduleParser
# reads.  The round-trip is lossless on the DataFormatter-view that the
# downstream Core pipeline sees.
#
# Why useful: Iter-0 of a Master-mode run typically takes XLSX (human-authored).
# Subsequent iterations need a plain-text representation an external
# orchestrator can mutate (e.g. inject FW_Seed_<id> sheets carrying the
# winners' kvPairs from the previous iteration's BundleSeed).  XLSX is binary;
# JSON is trivially mutable.  Re-launching Core with
#   core.input.format=json
#   excel.file=/path/to/workbook_iter1.json
# uses the dumped/mutated JSON directly.
#
# Behaviour:
#   • DEFAULT (no property set) — auto-derives sibling path.  Example:
#     excel.file=test_e2e_metric.xlsx → writes test_e2e_metric.iter0.json
#     next to the source.  Skips automatically when input is already .json
#     (no JSON-over-JSON clobber).
#   • core.input.dumpJsonPath=/custom/path.json — explicit override.
#   • core.input.dumpJsonSuffix=.dump.json — customise the auto suffix.
#   • core.input.dumpJsonAuto=false — disable auto-dump entirely.
#
# Explicit-override examples (commented out — auto-derivation is enabled):
#core.input.dumpJsonPath=/tmp/workbook_iter0.json
#core.input.dumpJsonSuffix=.dump.json
#core.input.dumpJsonAuto=false
