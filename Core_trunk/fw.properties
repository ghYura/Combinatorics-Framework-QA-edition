# --- STANDALONE DEVELOPMENT PROFILE ---------------------------------------
# The two optional-list properties below must satisfy R (consumed) SUBSET-OF
# P (produced): the Reader cannot consume an fw_opt<size> table Core never
# built. These example values are coherent (R = P).
# A normal Bundle run does NOT use these values: the launcher renders BOTH
# properties from one canonical optional-table contract derived from the
# scenario's FW_Optional sheets (bundle/optional_contract.py), validates it
# during planning, and verifies the tables exist after Core. Editing this
# file cannot change a launcher-driven run.
# --------------------------------------------------------------------------
core.optional.includeOptionalCombiPairsToDBCSVList=1,2,3,4

#
distinctify__fw_final_opt__Tables=true
distinctify__fwX_Y__Tables=true

# ─── [Iter3.2 Option C] In-JVM distinctify for fw_final / fw_opt<i> ──────────
# When TRUE, the engine's TableDataDistinctorFnl streams the table rows out of
# PostgreSQL, hashes each row's data columns to a 64-bit value (Murmur3
# finaliser, collision probability ~5×10^-11 on a 34M-row table — effectively
# zero), tracks seen hashes in a JVM HashSet<Long>, then issues a single
# PG DELETE keyed on the in-JVM list of duplicate combi_ids (staged via a
# COPY-IN to a TEMP table).
#
# Trade-off:
#   + Often faster than the PG-side GROUP BY DELETE when the table has many
#     short-int2[] columns (PG array hashing is slow on those).
#   + Uses ONE round-trip to read + ONE COPY + ONE DELETE (no large temp file
#     on PG side).
#   - JVM heap cost ≈ 50 bytes per distinct row.  A 34M-row fw_opt table needs
#     ~1.5 GB just for the seen-hash set during the scan.  Tune -Xmx and/or
#     prefer Option D below for huge tables.
#   - Falls back to PG-side automatically on any I/O or SQL error.
#
# Only consulted when an actual distinctify pass runs (i.e. when
# distinctify__fw_final_opt__Tables=true AND Option D below either is OFF
# or its sample probe DID see duplicates).
core.distinctify.javaSide=false

# ─── [Iter3.3 Option D] Sample-and-skip pre-check (overrides others) ─────────
#
# OVERRIDES OTHER DISTINCTIFY STRATEGY OPTIONS.  When TRUE, BEFORE running the
# actual distinctify pass on fw_final / fw_opt<i>, the engine first runs a
# cheap TABLESAMPLE SYSTEM(1) probe — comparing COUNT(*) to
# COUNT(DISTINCT (data_cols)) over ~1% of the table's pages.  If both counts
# agree (sample is fully distinct), the engine SKIPS the distinctify pass
# entirely — neither the PG-side GROUP BY DELETE nor the Option C in-JVM
# HashSet runs.
#
# Correctness:
#   • False positives (skipping a table that DOES have duplicates) are possible
#     when duplicates are extremely sparse — e.g. 1 duplicate pair in 34M rows
#     might not appear in a 1% sample.  For workloads where the Cartesian over
#     already-distinct sources mathematically cannot produce duplicates (see
#     fw_opt<i>: distinct fw_<k> sources × no NULLIF → distinct cartesian),
#     this risk is zero.
#   • False negatives (running the full distinctify when there ARE no
#     duplicates) cannot happen — sample is exact within its scope; the check
#     is conservative.
#
# Interoperation with Option C:
#   D ON,  C OFF → sample → if dups, run PG-side; if no dups, skip.
#   D ON,  C ON  → sample → if dups, run in-JVM (Option C); if no dups, skip.
#   D OFF, C ON  → always run in-JVM (Option C); no skip.
#   D OFF, C OFF → always run PG-side (legacy).
# In short: D decides "run a distinctify?"; C decides "which distinctify
# implementation?" once D says yes.
#core.distinctify.sampleAndSkip=false

