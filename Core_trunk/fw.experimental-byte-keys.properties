# ═══════════════════════════════════════════════════════════════════════════
# fw.experimental-byte-keys.properties            EXPERIMENTAL -- byte-width cell keys
#
# Core reads ./fw.properties only (no profiles), so enabling the experiment means appending
# these lines to it -- a later duplicate wins:
#
#     cat fw.experimental-byte-keys.properties >> fw.properties
#
# What it switches on, and only when the workbook needs at most 255 keys (otherwise the run is a
# plain short run and says so on the experimental logger):
#   * byte[] key rows in the JVM (labels -127..127), COPY streamed from byte buffers
#   * the DB guard sql/experimental/byte-keys-enable.sql right after the parse
#   * the audit sql/experimental/byte-keys-audit.sql after final assembly (fails the run on a
#     key outside the byte window)
#   * the log file logs/experimental-byte-keys.log (plus the console)
# The default (core.keys.dispatch=short) is the legacy behaviour and touches none of this.
# ═══════════════════════════════════════════════════════════════════════════
core.keys.dispatch=auto
core.keys.audit=true
# Numbering stays the legacy one while it fits the byte window; anchor / optimal (negative keys)
# are separate opt-ins, see fw.properties.
core.keys.strategy=identity
